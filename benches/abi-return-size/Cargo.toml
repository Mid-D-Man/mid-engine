[package]
name = "abi-return-size"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone falsification test for the `query2_static` 4x gap. See
# benches/abi_return_size.rs's own header doc comment for the full
# hypothesis, what each group isolates, and how to read the result.
#
# ZERO path dependencies, on purpose, and that is the whole point of the
# crate existing separately rather than as another group in
# crates/mid-ecs/benches/archetype_core.rs.
#
# docs/mid-ecs.md (builds #15-#18) records that adding diagnostic code to
# mid-ecs's own compilation unit tipped `query_static_single_component`
# and `query_static_unchecked_1col` -- the two most reliable "stays fast"
# controls in the matrix -- from ~65-106µs into the ~375µs slow cluster,
# with archetype.rs itself unchanged. Every variant measured in that era
# is confounded by it, because the control moved with the variable.
#
# This crate cannot be tipped that way: it links against nothing, its
# types are local layout-identical copies, and every comparison it makes
# is within its own binary in its own run. Its answer stays valid no
# matter what archetype_core.rs is doing.
#
# TOOLCHAIN: no MSRV wall of its own. criterion 0.5 only -- builds on the
# same toolchain `-p mid-collections` does, well below mid-ecs's own
# rustc 1.80+ rayon requirement and far below ecs-vs-bevy-ecs's 1.95.
# Deliberate: this is the one bench in the workspace that should be
# runnable absolutely anywhere, including locally, without CI.
[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "abi_return_size"
harness = false
