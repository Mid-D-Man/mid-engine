[workspace]
# NOTE on mid-net-transport-quinn (added this pass): its `web-transport-quinn`
# dependency needs a Cargo that understands `edition2024` (~1.85+) to even
# resolve, transitively (confirmed directly: `cargo check -p mid-net-transport-quinn`
# fails on rustc 1.75 at the `cpufeatures` manifest with exactly that error).
# `cargo check -p <anything-else>` and `cargo test -p <anything-else>` are
# UNAFFECTED — verified directly, resolver 2 scopes lockfile resolution to
# each `-p` target's own dependency closure, not the whole members list.
# Only a bare `cargo check`/`cargo build`/`cargo test` with NO `-p` (i.e.
# "build everything") pulls this crate in and needs the newer toolchain.
# If you're on an older Rust and something inexplicably won't resolve,
# this is almost certainly why — build with explicit `-p` flags instead.
# UPDATE (later pass): `examples/headless-server` now depends on
# `mid-net-transport-quinn` directly too (it's the actual thing exercising
# it over a real bind/dial, not just compiling it in isolation), so
# `-p headless-server` needs the same newer toolchain now as well.
# UPDATE (later pass): `mid-net-transport-wasm` added, and it behaves
# DIFFERENTLY from the two above — confirmed empirically, not assumed.
# `cargo check -p mid-net-transport-wasm` with NO `--target` flag
# resolves cleanly even on rustc 1.75 (its `web-transport-wasm` dependency
# lives under `[target.'cfg(target_arch = "wasm32")'.dependencies]`,
# and resolver 2 doesn't fetch platform-specific deps for a platform
# that isn't actually being built). The wall only shows up with an
# explicit `--target wasm32-unknown-unknown` — same edition2024 problem,
# this time via `idna_adapter` rather than `cpufeatures`, pulled in
# through `web-transport-wasm`'s own tree. So: `-p mid-net-transport-wasm`
# alone is fine anywhere; add `--target wasm32-unknown-unknown` and it
# needs the same ~1.85+ toolchain as the other two.
# UPDATE (later pass): `mid-net-transport-wasm/wasm-test-server` added --
# a native-only fixture server for the real browser test (see
# .github/workflows/mid-net-transport-wasm-test.yml). Depends on
# mid-net-transport-quinn directly, so `-p mid-net-transport-wasm-test-server`
# needs the ~1.85+ toolchain unconditionally, same as `-p mid-net-transport-quinn`
# itself -- not the conditional wasm32-only situation `mid-net-transport-wasm`
# is in.
# NOTE on mid-ecs (rayon dependency): needs rustc 1.80+, confirmed directly
# (`cargo check -p mid-ecs` fails on rustc 1.75 at `rayon-core`'s manifest).
# Independent of the edition2024 walls above -- ordinary MSRV drift, not the
# same root cause. `-p mid-collections` alone is unaffected (zero deps).
# NOTE on mid-collections' bench (criterion dev-dependency, added when the
# SparseSet bench suite was written): pulls in criterion -> clap_builder,
# which needs edition2024 same as the walls above -- confirmed directly,
# fails at `clap_builder`'s manifest on rustc 1.75. A FIFTH independent
# instance of this exact class of ordinary upstream MSRV drift, not a new
# root cause. REAL REGRESSION worth flagging explicitly: this affects
# `cargo test -p mid-collections` too, not just `--bench` -- verified
# directly (first assumed dev-dependencies were resolved per-target, that
# assumption was WRONG and corrected after actually testing it). Cargo
# resolves a package's full manifest, dev-dependencies included, before
# building ANY target from it, so mid-collections lost the "zero-MSRV-wall,
# fully testable in this sandbox" property this same comment block used to
# get to claim uniquely for it, the moment criterion was added as a dev-dep.
# Real tests were still run and verified before this dependency was added
# (18/18, see docs/mid-collections.md) -- this note is about local
# re-verification going forward, not about doubting that earlier result.
# NOTE on mid-arena's bench (criterion dev-dependency, added when
# vs_arena_crates was written): same edition2024 wall as every note
# above -- confirmed directly, fails at clap_builder's manifest on
# rustc 1.75. A SIXTH independent instance of this exact class of
# ordinary upstream MSRV drift. Same real regression as mid-collections
# took, same reason, not re-litigated -- `cargo test -p mid-arena` alone
# now needs the newer toolchain too, not just `--bench`. Real tests were
# run and verified BEFORE this dependency was added (16/16, see
# docs/mid-arena.md) -- same sequencing mid-collections used, same
# reason: verify everything the current toolchain still can, before
# adding the thing that closes that window.
members = [
    "crates/mid-log",
    "crates/mid-net",
    "crates/mid-net/wire",
    "crates/mid-net/transport",
    "crates/mid-net/reliable",
    "crates/mid-net/transport-quinn",
    "crates/mid-net/transport-wasm",
    "crates/mid-net/transport-wasm/wasm-test-server",
    "crates/mid-ecs",
    "crates/mid-collections",
    "crates/mid-arena",
    "crates/mid-alloc",
    "crates/mid-math",
    "crates/mid-geom",
    "crates/mid-common",
    "crates/mid-trace",
    "tools/mdix-compiler",
    "examples/headless-server",
      # New this pass (docs/roadmap.md, "What can be built in parallel"):
    # v0 stubs, not yet compiled/verified in this sandbox (no rustc
    # available here at all -- see that section's own honesty note).
    "crates/mid-time",
    "crates/mid-physics",
    "crates/mid-anim",
    "crates/mid-app",
    "tools/mdix-compiler",
    "examples/headless-server",
    "examples/custom-transport-demo",

    "benches/ecs-vs-bevy-ecs",
]

# NOTE on benches/ecs-vs-bevy-ecs (added this pass): its bevy_ecs dependency
# declares `rust-version = "1.95.0"` (confirmed directly: tried building
# bevy_ecs 0.19.1 from crates.io). Same class of wall as
# mid-net-transport-quinn's edition2024 requirement above, same isolation
# reasoning -- kept as its own workspace member specifically so a bare
# `cargo test`/`cargo build`/`cargo bench` without `-p` doesn't pull the
# newer-toolchain requirement into mid-ecs's own, otherwise-1.91-compatible
# build. `-p ecs-vs-bevy-ecs` needs the newer toolchain; nothing else does.
resolver = "2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
debug         = false

# cargo bench does NOT use [profile.release] — it has its own default
# profile (opt-level=3, but WITHOUT lto/codegen-units=1). That gap
# matters for cross-crate calls into external comparison crates in our
# benches (e.g. `wide`): our own mid-math methods are all
# #[inline(always)], which survives regardless, but a crate we only
# call via #[inline] (not #[inline(always)]) through a multi-hop call
# chain depends on aggressive cross-crate inlining to collapse down to
# the same single instruction our own code gets — added 2026-08-23
# after wide::i32x4::add benched ~14x slower than our i32x4::add,
# tracked to exactly this profile gap (see docs/platform-optimization.md §9).
[profile.bench]
opt-level     = 3
lto           = true
codegen-units = 1
debug         = true
