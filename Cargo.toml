[workspace]
# Full history, dated MSRV-wall notes, and rationale for every section
# in this file: see docs/workspace-cargo.md. Comments below are pointers
# only, per docs/DOCUMENTATION_AND_COMMENTING_GUIDELINES.md's "no fix
# history or decision logs inline" rule.

# MSRV/toolchain walls exist on: mid-net-transport-quinn, headless-server,
# mid-net-transport-wasm (only with --target wasm32-unknown-unknown),
# mid-net-transport-wasm-test-server, mid-ecs, mid-collections (bench),
# mid-arena (bench), mid-ptr, benches/ecs-vs-bevy-ecs. A bare `cargo
# build`/`test` with no `-p` flag pulls all of them in. See
# docs/workspace-cargo.md, "MSRV / toolchain walls," for which crate needs
# what and why.
#
# mid-platform has no MSRV wall, but does have real `std`/`alloc` cargo
# features (default = std) -- see docs/mid-platform.md. `cargo test -p
# mid-platform` alone only exercises the default (std) path; CI also runs
# it with --no-default-features to exercise the no_std fallback path.
members = [
    "crates/mid-log",
    "crates/mid-net",
    "crates/mid-net/wire",
    "crates/mid-net/transport",
    "crates/mid-net/reliable",
    "crates/mid-net/transport-quinn",
    "crates/mid-net/transport-wasm",
    "crates/mid-net/transport-wasm/wasm-test-server",
    "crates/mid-ecs",
    "crates/mid-collections",
    "crates/mid-arena",
    "crates/mid-alloc",
    "crates/mid-ptr",
    "crates/mid-platform",
    "crates/mid-math",
    "crates/mid-geom",
    "crates/mid-common",
    "crates/mid-trace",
    "crates/mid-time",
    "crates/mid-physics",
    "crates/mid-anim",
    "crates/mid-app",
    "tools/mdix-compiler",
    "examples/headless-server",
    "examples/custom-transport-demo",

    "benches/ecs-vs-bevy-ecs",
    "benches/iter1-isolated",
    # Sibling to iter1-isolated, same method, pointed at query2_static_ref
    # instead of query_static -- see that crate's own Cargo.toml.
    "benches/query2-ref-isolated",
]

# benches/ecs-vs-bevy-ecs needs rustc 1.95+ (bevy_ecs's own rust-version) --
# see docs/workspace-cargo.md, "MSRV / toolchain walls."
resolver = "2"

# See docs/workspace-cargo.md, "[workspace.lints] and [workspace.dependencies]."
[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
debug         = false

# cargo bench does NOT inherit [profile.release] -- see
# docs/workspace-cargo.md, "[profile.release] and [profile.bench]."
[profile.bench]
opt-level     = 3
lto           = true
codegen-units = 1
debug         = true

# See docs/workspace-cargo.md, "[profile.bench-nolto]."
[profile.bench-nolto]
inherits      = "release"
opt-level     = 3
lto           = false
codegen-units = 16
strip         = false
debug         = true
