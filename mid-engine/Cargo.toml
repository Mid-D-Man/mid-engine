[workspace]
# NOTE on mid-net-transport-quinn (added this pass): its `web-transport-quinn`
# dependency needs a Cargo that understands `edition2024` (~1.85+) to even
# resolve, transitively (confirmed directly: `cargo check -p mid-net-transport-quinn`
# fails on rustc 1.75 at the `cpufeatures` manifest with exactly that error).
# `cargo check -p <anything-else>` and `cargo test -p <anything-else>` are
# UNAFFECTED — verified directly, resolver 2 scopes lockfile resolution to
# each `-p` target's own dependency closure, not the whole members list.
# Only a bare `cargo check`/`cargo build`/`cargo test` with NO `-p` (i.e.
# "build everything") pulls this crate in and needs the newer toolchain.
# If you're on an older Rust and something inexplicably won't resolve,
# this is almost certainly why — build with explicit `-p` flags instead.
members = [
    "crates/mid-log",
    "crates/mid-net",
    "crates/mid-net/wire",
    "crates/mid-net/transport",
    "crates/mid-net/reliable",
    "crates/mid-net/transport-quinn",
    "crates/mid-ecs",
    "crates/mid-math",
    "crates/mid-geom",
    "crates/mid-common",
    "crates/mid-trace",
    "tools/mdix-compiler",
    "examples/headless-server",
    "examples/custom-transport-demo",
]
resolver = "2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
debug         = false
