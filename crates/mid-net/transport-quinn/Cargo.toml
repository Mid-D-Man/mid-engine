[package]
name = "mid-net-transport-quinn"
version = "0.1.0"
edition = "2021"

[lib]
name = "mid_net_transport_quinn"

# Exactly one crypto backend. `aws-lc-rs` is web-transport-quinn's own default and stays ours; `ring` is the
# fallback for targets where aws-lc-sys is hard to cross-compile (Android armv7). The choice is forwarded,
# so the C-ABI crate (mid-net-transport-quinn-ffi) can offer it too.
[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["web-transport-quinn/aws-lc-rs"]
ring = ["web-transport-quinn/ring"]

[dependencies]
mid-net-transport = { path = "../transport" }
web-transport-quinn = { version = "0.11", default-features = false }
bytes = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

# Test-only. tokio's extra features here (macros, time) merge with the
# [dependencies] entry above for the same crate/version -- this doesn't
# widen what ships in the actual library, only what `cargo test` builds.
# `web-transport-quinn`'s default `aws-lc-rs` feature (see its own
# Cargo.toml: `default = ["aws-lc-rs"]`) is what makes ServerBuilder/
# ClientBuilder available at all -- already on by default via the plain
# "0.11" dependency above, nothing extra needed here for that part.
[dev-dependencies]
tokio             = { version = "1", features = ["macros", "time"] }
rcgen             = "0.14"
rustls-pki-types  = "1"
url               = "2"
