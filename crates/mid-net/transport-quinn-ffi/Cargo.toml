[package]
name = "mid-net-transport-quinn-ffi"
version = "0.1.0"
edition = "2021"

# C ABI over the native QUIC/WebTransport transport. Kept out of the `mid-net`
# facade on purpose: the facade stays free of quinn/tokio (see docs/mid-net.md,
# "Crate Structure"). A native game that wants QUIC from C links this crate.
[lib]
name = "mid_net_quic"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["aws-lc-rs"]
# Exactly one of these. `ring` is the fallback for targets where aws-lc-sys is a
# problem to cross-compile (Android armv7 is the one to watch).
aws-lc-rs = ["mid-net-transport-quinn/aws-lc-rs", "web-transport-quinn/aws-lc-rs", "rcgen/aws_lc_rs"]
ring = ["mid-net-transport-quinn/ring", "web-transport-quinn/ring", "rcgen/ring"]

[dependencies]
mid-net-transport = { path = "../transport" }
mid-net-transport-quinn = { path = "../transport-quinn", default-features = false }
web-transport-quinn = { version = "0.11", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem"] }
rustls-pki-types = "1"
url = "2"
