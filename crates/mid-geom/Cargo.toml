[package]
name        = "mid-geom"
version     = "0.1.0"
edition     = "2021"
description = "Geometry primitives for Mid Engine — shapes, raycasts, planes, spatial queries, transforms"

[lib]
name = "mid_geom"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
mid-math = { path = "../mid-math" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "geometry"
harness = false
