[package]
name = "mid-ecs"
version = "0.1.0"
edition = "2021"

[lib]
name = "mid_ecs"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# `features = ["ffi"]`: pulls in `zerocopy` transitively, needed for
# `component.rs`'s new `register_ffi`/`raw_span` (the FFI-span
# mechanism, see docs/mid-collections.md and docs/mid-ecs.md's FFI
# sections). mid-ecs's own `ffi.rs` module is always compiled (not
# feature-gated), so this is unconditional too, rather than adding a
# second, redundant `ffi` feature flag on mid-ecs itself.
mid-collections = { path = "../mid-collections", features = ["ffi"] }
# `transform.rs`'s `GlobalTransform`/`GlobalTransformLWC` wrap mid-math's
# `Affine3`/`DAffine3` directly rather than re-deriving affine-transform
# math a second time in this crate -- see docs/mid-ecs.md's "Large World
# Coordinates: GlobalTransform" section for the locked-in design this
# implements. Workspace-internal path dependency, same discipline as the
# `mid-collections` dependency above: hand-rolled and already built, not
# a new external dependency.
mid-math = { path = "../mid-math" }
# Version pinned to match mid-collections' own declaration exactly
# (both 0.8.56) -- avoids relying on semver-range resolution picking
# the same version by coincidence. `default-features = false` for the
# same reason as mid-collections' own declaration: zerocopy has no
# default features today, kept explicit as insurance anyway.
zerocopy = { version = "0.8.56", default-features = false, features = ["derive"] }

# rayon and its whole transitive tree (crossbeam-deque/epoch/utils, either,
# rayon-core) depend on real OS threads, which wasm32-unknown-unknown
# doesn't provide the way rayon needs -- confirmed directly via
# `cargo tree --target wasm32-unknown-unknown -p mid-ecs`, which pulled
# the entire tree into the wasm32 graph before this gate existed. Same
# target-gating pattern already established in
# crates/mid-net/transport-wasm/Cargo.toml for the same class of problem.
# `query.rs`'s own eventual rayon-based parallel iteration will need the
# matching `#[cfg(not(target_arch = "wasm32"))]` code-level split when it's
# actually built -- not needed yet, query.rs is still a stub.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.8"

[dev-dependencies]
# Same version/feature choice as mid-collections's and mid-math's own
# criterion dev-dependency — html_reports for the local
# `target/criterion` report, default features kept.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "archetype_core"
harness = false

[[bench]]
name    = "sparse_shell"
harness = false

[features]
default = []
