[package]
name = "mid-ecs"
version = "0.1.0"
edition = "2021"

[lib]
name = "mid_ecs"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# `features = ["ffi"]`: pulls in `zerocopy` transitively, needed for
# `component.rs`'s new `register_ffi`/`raw_span` (the FFI-span
# mechanism, see docs/mid-collections.md and docs/mid-ecs.md's FFI
# sections). mid-ecs's own `ffi.rs` module is always compiled (not
# feature-gated), so this is unconditional too, rather than adding a
# second, redundant `ffi` feature flag on mid-ecs itself.
mid-collections = { path = "../mid-collections", features = ["default"] }
zerocopy = { version = "0.8.56", features = ["derive"] }

# rayon and its whole transitive tree (crossbeam-deque/epoch/utils, either,
# rayon-core) depend on real OS threads, which wasm32-unknown-unknown
# doesn't provide the way rayon needs -- confirmed directly via
# `cargo tree --target wasm32-unknown-unknown -p mid-ecs`, which pulled
# the entire tree into the wasm32 graph before this gate existed. Same
# target-gating pattern already established in
# crates/mid-net/transport-wasm/Cargo.toml for the same class of problem.
# `query.rs`'s own eventual rayon-based parallel iteration will need the
# matching `#[cfg(not(target_arch = "wasm32"))]` code-level split when it's
# actually built -- not needed yet, query.rs is still a stub.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.8"

[features]
default = []
