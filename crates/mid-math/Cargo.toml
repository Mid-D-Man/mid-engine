[[bench]]
name    = "vs_mat4_fastest"
harness = false

[[bench]]
name    = "vs_mat4_asm"
harness = false

[[bench]]
name    = "vs_int32"
harness = false

[[bench]]
name    = "vs_int64"
harness = false

[[bench]]
name    = "vs_wide_float"
harness = false

[[bench]]
name    = "vs_wide_int"
harness = false

[[bench]]
name    = "vs_curves"
harness = false

[[bench]]
