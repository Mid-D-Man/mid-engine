# crates/mid-math/Cargo.toml
[package]
name        = "mid-math"
version     = "0.2.0"
edition     = "2021"
description = "SIMD-aligned math primitives for Mid Engine — FFI-ready, cross-platform, f32+f64"

[lib]
name = "mid_math"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]

[dev-dependencies]
criterion   = { version = "0.5", features = ["html_reports"] }
glam        = { version = "0.28", features = [] }
nalgebra    = { version = "0.33" }
ultraviolet = { version = "0.9" }

[[bench]]
name    = "vs_glam"
harness = false

[[bench]]
name    = "vs_all"
harness = false

[[bench]]
name    = "vs_all_f64"
harness = false

[[bench]]
name    = "vs_int32"
harness = false

[[bench]]
name    = "vs_int64"
harness = false

[[bench]]
name    = "vs_wide_float"
harness = false

[[bench]]
name    = "vs_wide_int"
harness = false

[features]
default = []
simd    = []
avx2    = []
