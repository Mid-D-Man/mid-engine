[package]
name        = "mid-math"
version     = "0.2.0"
edition     = "2021"
description = "SIMD-aligned math primitives for Mid Engine — FFI-ready, cross-platform, f32+f64"

[lib]
name = "mid_math"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]

[dev-dependencies]
glam = { version = "0.28", features = [] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# default-features = false drops the rayon feature — so WASM compilation doesn't fail since it can't target wasi.
criterion = { version = "0.5", features = ["html_reports"], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Native builds keep default features (including rayon) for faster, parallel benchmark execution.
criterion      = { version = "0.5", features = ["html_reports"] }
nalgebra       = { version = "0.33" }
ultraviolet    = { version = "0.9" }
matrixmultiply = { version = "0.3" }
faer           = { version = "0.22" }
vek            = { version = "0.17", features = ["repr_simd"] }

[[bench]]
name    = "vs_glam"
harness = false

[[bench]]
name    = "vs_all"
harness = false

[[bench]]
name    = "vs_all_f64"
harness = false

[[bench]]
name    = "vs_mat4_fastest"
harness = false

[[bench]]
name    = "vs_mat4_asm"
harness = false

[[bench]]
name    = "vs_int32"
harness = false

[[bench]]
name    = "vs_int64"
harness = false

[[bench]]
name    = "vs_wide_float"
harness = false

[[bench]]
name    = "vs_wide_int"
harness = false

[[bench]]
name    = "vs_curves"
harness = false

[[bench]]
name    = "vs_color"
harness = false

[[bench]]
name    = "vs_fixed"
harness = false

[[bench]]
name    = "vs_helpers"
harness = false

[[bench]]
name    = "vs_rng"
harness = false

[[bench]]
name    = "noise"
harness = false

[[bench]]
name    = "camera"
harness = false

[[bench]]
name    = "geom"
harness = false

[features]
default  = []
simd     = []
avx2     = []
coresimd = []
