[package]
name        = "mid-platform"
version     = "0.0.1"
edition     = "2021"
description = "Platform-agnostic primitives for mid-engine (Mutex/RwLock/Once/OnceLock/LazyLock/Barrier/Arc/atomics/cells/FxHash-style hasher), bevy_platform-shaped but hand-rolled and dependency-free -- see docs/mid-platform.md"

[lib]
name = "mid_platform"
# NOT ["lib", "cdylib", "staticlib"] here, unlike mid-ecs's/mid-net's own
# [lib] shape -- tried that first, it broke `cargo build -p mid-platform
# --no-default-features` in CI (real failure, Build #3): a cdylib/staticlib
# is a final linked artifact needing a #[panic_handler] and unwind support,
# neither of which exist (or should exist) in the no_std fallback path, and
# Cargo has no way to make `crate-type` conditional on a feature within one
# manifest. mid-ecs/mid-net never hit this because neither is no_std-capable
# in the first place. Fix: keep crate-type as plain `["lib"]` here (works
# for every configuration, matching this crate's pre-FFI state), and build
# the cdylib the FFI smoke test actually needs on demand, only under
# default features, via `cargo rustc --crate-type cdylib` -- see
# .github/workflows/mid-platform-test.yml's own comment on that step.
crate-type = ["lib"]

[features]
default = ["std"]
std     = ["alloc"]
alloc   = []

[dependencies]

[dev-dependencies]
# Bench-only -- NOT a real dependency of this crate (see docs/mid-platform.md,
# "Why not just depend on mid-alloc for SpinLock," the same "no in-workspace/
# external dependency" premise applies here). Comparison baselines for
# benches/sync_bench.rs: `spin` is the real crate this crate's own no_std
# fallback algorithms were grounded in (Mutex, RwLock, Once, Barrier all read
# fresh from its real 0.10.0 source -- see each module's own doc comment), so
# it's the honest thing to bench against to confirm the hand-rolled versions
# aren't leaving obvious performance on the table. Same pattern mid-arena's
# `benches/vs_arena_crates.rs` and mid-alloc's `benches/allocators.rs` already
# use: real comparison crates as dev-dependencies only, never promoted to
# [dependencies].
#
# Adding criterion here pulls in clap_builder, which needs edition2024 --
# the third crate in this workspace to hit exactly this wall after
# mid-collections and mid-arena (see docs/workspace-cargo.md, "MSRV /
# toolchain walls"). `cargo test -p mid-platform` is affected too, not just
# `--bench` -- same real regression those two crates already took, same
# reason (Cargo resolves a package's full manifest, dev-dependencies
# included, before building ANY target from it).
criterion = { workspace = true }
spin = "0.10.0"
# Phase 3 hasher's comparison baseline AND parity-test reference (src/hash.rs's
# own tests, benches/hash_bench.rs): the real published crate whose algorithm
# `hash::FxHasher` is, read directly from its crates.io source (1.1.0, not
# 2.x -- 2.x switched to a different algorithm). Same dev-dependency-only
# discipline as `spin` above, never promoted to [dependencies].
rustc-hash = "1.1.0"

[[bench]]
name    = "sync_bench"
harness = false

[[bench]]
name    = "hash_bench"
harness = false

[lints]
workspace = true
