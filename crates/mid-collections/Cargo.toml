[package]
name        = "mid-collections"
version     = "0.1.0"
edition     = "2021"
description = "Hand-rolled data structures for Mid Engine, built piecemeal as mid-ecs actually needs them — sparse sets, generational arenas, lock-free ring buffers, and more. See docs/mid-collections.md for what's built and why."

[lib]
name       = "mid_collections"
crate-type = ["lib"]

[dependencies]
# Optional, only enters the graph for a consumer that explicitly opts
# into `features = ["ffi"]` — see lib.rs's own doc comment for why this
# is a feature gate rather than an unconditional dependency. Checked
# directly (not assumed) before picking this version: 0.8.56 with the
# `derive` feature builds and runs clean on this project's rustc 1.75
# floor — no MSRV wall, unlike five other dependencies this project has
# hit that exact problem with. `derive` is included here (not split into
# its own feature) because a consumer enabling `ffi` will need
# `#[derive(FromBytes, IntoBytes, KnownLayout, Immutable)]` on their own
# component types regardless — e.g. mid-ecs's own Position/Velocity —
# so re-exporting it through this feature is the actually-useful default,
# not unnecessary weight.
zerocopy = { version = "0.8.56", features = ["derive"], optional = true }

[dev-dependencies]
# Same version/feature choice as mid-math's own criterion dev-dependency
# (crates/mid-math/Cargo.toml) — html_reports for the local `target/criterion`
# report, default features kept (includes rayon) for faster bench-harness
# execution. No wasm-target split like mid-math's: nothing here targets
# wasm32 for benching, so there's no rayon/wasi conflict to route around.
criterion = { version = "0.5", features = ["html_reports"] }
# Unconditional (not gated by the `ffi` feature) so `ffi_span.rs`'s own
# `#[cfg(test)]` module — which only compiles when `ffi` is actually
# enabled — has it available under `cargo test --features ffi` without
# a caller needing to separately request it. Same version as the
# optional dependency above, deliberately, so a real `--features ffi`
# test build exercises the exact same zerocopy version production code
# would use, not a coincidentally-different one.
zerocopy = { version = "0.8.56", features = ["derive"] }

[[bench]]
name    = "sparse_set"
harness = false

[features]
default = []
# See lib.rs's own doc comment for the full rationale — a real, already-
# documented external-dependency need (docs/mid-collections.md's "FFI
# wrapper" section) weighed against this crate's own "zero external
# dependencies" line, resolved as an opt-in feature rather than by
# picking one doc over the other.
ffi = ["dep:zerocopy"]
