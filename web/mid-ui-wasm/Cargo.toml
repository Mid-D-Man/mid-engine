[package]
name        = "mid-ui-wasm"
version     = "0.1.0"
edition     = "2021"
description = "WASM bindings for the site's mid-ui playground (web/ui/) — a thin wrapper over mid-ui and mid-ui-mxui, no UI logic of its own"
publish     = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default   = ["dixscript"]
dixscript = ["mid-ui-mxui/dixscript"]

[dependencies]
mid-ui       = { path = "../../crates/mid-ui" }
mid-ui-mxui  = { path = "../../crates/mid-ui-mxui", default-features = false }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1

# Standalone on purpose: its own workspace keeps this cdylib out of the
# engine's workspace-wide builds, and needs no change to the root Cargo.toml.
[workspace]
