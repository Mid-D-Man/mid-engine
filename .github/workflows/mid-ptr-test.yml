# .github/workflows/mid-ptr-test.yml
name: mid-ptr — Tests

# Runs automatically the moment something relevant changes -- no manual
# commit-message trigger needed (see docs/RUST_AND_CRATE_GUIDELINES.md §7,
# "CI Triggering," for why this differs from mid-log-test.yml's convention).
on:
  push:
    branches: [main, master, develop]
    paths:
      - "crates/mid-ptr/**"
      - ".github/workflows/mid-ptr-test.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "crates/mid-ptr/**"
      - ".github/workflows/mid-ptr-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions:  read

jobs:

  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mid-ptr needs the &raw const / &raw mut operators (RFC 2582), stabilized
      # in Rust 1.82 — well above this workspace's usual rustc-1.75 floor. See
      # docs/mid-ptr.md and the root Cargo.toml's MSRV-wall comment. `@stable`
      # is always well past 1.82 by now, so no explicit version pin is needed.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Get Rust version
        run: rustc --version

      # NOTE (fixed after the first real run of this workflow failed): only the
      # registry index/cache/git dirs are cached here, deliberately NOT
      # ~/.cargo/bin/. That directory holds the actual `cargo`/`rustc` binaries,
      # which are architecture-specific -- caching them under a workspace-wide
      # generic `cargo-registry-` key prefix (this workflow's first version
      # copied that prefix from mid-log-test.yml) let this run's restore-keys
      # fallback match a DIFFERENT workflow's cache
      # (`benches/ecs-vs-bevy-ecs`, built on an `ubuntu-24.04-arm` runner) and
      # overwrite this run's real x86_64 `cargo` with an incompatible ARM
      # binary -- "cannot execute binary file: Exec format error" on every
      # cargo invocation that followed. The key below is scoped to this crate
      # and this runner's OS specifically, so it can only ever hit mid-ptr's
      # own, same-architecture cache. mid-log-test.yml and any other workflow
      # copied from its cache block carries the same latent risk -- flagged in
      # docs/RUST_AND_CRATE_GUIDELINES.md §7, not fixed there in this pass.
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-ptr-${{ runner.os }}-${{ hashFiles('crates/mid-ptr/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-ptr-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt -p mid-ptr --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy -p mid-ptr -- -D warnings
        continue-on-error: true

      - name: Build (no_std, zero dependencies)
        run: cargo build -p mid-ptr

      - name: Run unit tests + doc-tests
        run: cargo test -p mid-ptr --no-fail-fast -- --show-output

  summary:
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  mid-ptr Test Summary"
          echo "============================================="
          echo "Build:  #${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Tests:  ${{ needs.run-tests.result || 'skipped' }}"
