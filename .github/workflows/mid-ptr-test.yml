# .github/workflows/mid-ptr-test.yml
#
# Fixed after review: this workflow originally ran on push/pull_request
# with a fake "summary" job that just echoed a few lines to the job log,
# not a real $GITHUB_STEP_SUMMARY. Both are wrong against this project's
# actual, established convention -- confirmed directly against
# mid-ecs-test.yml and docs/benching-standards.md's "recommended shape"
# (point 1: "workflow_dispatch only... Never push/pull_request"), not
# checked before this workflow was first written. See
# docs/RUST_AND_CRATE_GUIDELINES.md §7 for the corrected policy.
#
# The HTML-report + gh-pages-deploy half of mid-ecs-test.yml's own pattern
# is deliberately NOT replicated here -- the whole gh-pages reporting
# pipeline is about to move to Cloudflare Pages (see docs/mid-platform.md-
# adjacent site-migration discussion), so building more gh-pages-specific
# tooling right now would likely be thrown away almost immediately. This
# workflow's real, structured $GITHUB_STEP_SUMMARY is the part that
# matters regardless of where the dashboard ends up living, so that part
# is fully built; the deploy step is not.

name: mid-ptr — Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  actions:  read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mid-ptr needs the &raw const / &raw mut operators (RFC 2582), stabilized
      # in Rust 1.82 — well above this workspace's usual rustc-1.75 floor. See
      # docs/mid-ptr.md and the root Cargo.toml's MSRV-wall comment. `@stable`
      # is always well past 1.82 by now, so no explicit version pin is needed.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      # Cache key scoped to this crate + this runner's OS specifically --
      # never a bare "cargo-registry-" prefix. A generic prefix let this
      # workflow's own first real run collide with a different, ARM-runner
      # workflow's cache -- see docs/RUST_AND_CRATE_GUIDELINES.md §7.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-ptr-${{ runner.os }}-${{ hashFiles('crates/mid-ptr/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-ptr-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt -p mid-ptr --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy -p mid-ptr -- -D warnings
        continue-on-error: true

      - name: Build (no_std, zero dependencies)
        run: cargo build -p mid-ptr

      - name: Run unit tests + doc-tests
        continue-on-error: true
        run: |
          # set -o pipefail: without this, `cargo test | tee file` reports
          # tee's exit code (always 0), not cargo test's -- see
          # docs/benching-standards.md's own "correctness detail" section.
          set -o pipefail
          cargo test -p mid-ptr --color=never --no-fail-fast \
            -- --show-output 2>&1 | tee mid-ptr-test-raw.txt

      - name: Parse results to JSON
        if: always()
        env:
          BUILD_NUM:    ${{ github.run_number }}
          BRANCH:       ${{ github.ref_name }}
          COMMIT:       ${{ github.sha }}
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          python3 - << 'PYEOF'
          import re, json, os

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          def strip(s): return RE_ANSI.sub('', s)

          try:
              raw = open('mid-ptr-test-raw.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              raw = ''
          text = strip(raw)

          test_output = {}
          for m in re.finditer(
              r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)'
              r'(?=\n---- |\n\n(?:successes|failures):\n|\ntest result:|\Z)',
              text, re.DOTALL):
              content = m.group(2).strip()
              if content:
                  test_output[m.group(1)] = content

          fail_output = {}
          fail_section = re.search(r'\nfailures:\n(.*?)(?:\ntest result:|\Z)', text, re.DOTALL)
          if fail_section:
              for m in re.finditer(
                  r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)(?=\n---- |\Z)',
                  fail_section.group(1), re.DOTALL):
                  content = m.group(2).strip()
                  if content:
                      fail_output[m.group(1)] = content

          suites    = []
          cur_name  = None
          cur_tests = []
          cur_dur   = 0.0

          # Captures the real binary/crate name out of
          # "... (target/debug/deps/mid_ptr-f0bd8e754cfd2210)" rather than
          # the source-file path that precedes it -- see mid-ecs-test.yml's
          # own header comment for why that distinction matters once a
          # crate has more than one test binary (this one has two: the
          # unittests binary and the doc-tests binary).
          RE_RUN    = re.compile(r'Running\s+.*?\(\S*?/deps/([A-Za-z0-9_]+)-[0-9a-f]{8,}\)\s*$')
          RE_DOC    = re.compile(r'^\s*Doc-tests\s+(\S+)\s*$')
          RE_TEST   = re.compile(
              r'^test\s+([\w:./-]+(?:::\w+)*(?:\s-\s\S+\s\(line\s\d+\))?)\s+\.\.\.\s+'
              r'(ok|FAILED|ignored)(?:\s+\(([\d.]+)s\))?'
          )
          RE_RESULT = re.compile(r'test result:.*?finished in ([\d.]+)s')

          def flush(name, tests, dur):
              if name is not None:
                  suites.append({
                      'name':       name,
                      'passed':     sum(1 for t in tests if t['status'] == 'passed'),
                      'failed':     sum(1 for t in tests if t['status'] == 'failed'),
                      'ignored':    sum(1 for t in tests if t['status'] == 'ignored'),
                      'duration_s': round(dur, 4),
                      'tests':      tests,
                  })

          for line in text.splitlines():
              m = RE_RUN.search(line)
              if m:
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = m.group(1).replace('_', '-'), [], 0.0
                  continue
              m = RE_DOC.match(line)
              if m:
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = f"{m.group(1)} (doc-tests)", [], 0.0
                  continue
              m = RE_TEST.match(line)
              if m:
                  if cur_name is None:
                      cur_name, cur_tests, cur_dur = 'unknown suite', [], 0.0
                  tname, status, dur = m.group(1), m.group(2), m.group(3)
                  out = fail_output.get(tname) or test_output.get(tname, '')
                  cur_tests.append({
                      'name':        tname,
                      'status':      {'ok':'passed','FAILED':'failed','ignored':'ignored'}.get(status,'unknown'),
                      'duration_ms': int(float(dur) * 1000) if dur else 0,
                      'output':      out,
                  })
                  continue
              m = RE_RESULT.search(line)
              if m:
                  cur_dur = float(m.group(1))
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = None, [], 0.0

          flush(cur_name, cur_tests, cur_dur)

          total   = sum(s['passed'] + s['failed'] + s['ignored'] for s in suites)
          passed  = sum(s['passed']  for s in suites)
          failed  = sum(s['failed']  for s in suites)
          ignored = sum(s['ignored'] for s in suites)
          dur     = sum(s['duration_s'] for s in suites)

          result = {
              'build':        os.environ.get('BUILD_NUM',    '0'),
              'branch':       os.environ.get('BRANCH',       'unknown'),
              'commit':       os.environ.get('COMMIT',       'unknown')[:8],
              'rust_version': os.environ.get('RUST_VERSION', 'stable'),
              'crate':        'mid-ptr',
              'summary': {
                  'total':      total,
                  'passed':     passed,
                  'failed':     failed,
                  'ignored':    ignored,
                  'duration_s': round(dur, 3),
              },
              'suites': suites,
          }

          with open('mid-ptr-test-results.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"Suites:{len(suites)}  Passed:{passed}  Failed:{failed}  Ignored:{ignored}")
          PYEOF

      - name: Write test results to job summary
        if: always()
        run: |
          python3 - << 'PYEOF'
          import json, os

          try:
              with open('mid-ptr-test-results.json') as f:
                  result = json.load(f)
          except FileNotFoundError:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("## mid-ptr Test Results\n\n")
                  f.write("`mid-ptr-test-results.json` wasn't produced — the parse step "
                          "above likely failed before writing it. Check its log.\n")
              raise SystemExit(0)

          summary = result['summary']
          suites  = result['suites']

          lines = []
          lines.append(f"## mid-ptr Test Results — Build #{result['build']}")
          lines.append("")
          lines.append(
              f"Branch: `{result['branch']}` &nbsp;|&nbsp; "
              f"Commit: `{result['commit']}` &nbsp;|&nbsp; "
              f"Rust: `{result['rust_version']}`"
          )
          lines.append("")

          if summary['failed'] == 0 and summary['total'] > 0:
              lines.append(f"### ✅ All {summary['total']} tests passed")
          elif summary['total'] == 0:
              lines.append("### ⚠️ No tests were collected — check the raw log")
          else:
              lines.append(f"### ❌ {summary['failed']} of {summary['total']} tests failed")
          lines.append("")

          failing = [
              (s['name'], t)
              for s in suites
              for t in s['tests']
              if t['status'] == 'failed'
          ]
          if failing:
              lines.append("### Failures")
              lines.append("")
              for suite_name, t in failing:
                  lines.append(f"- **{suite_name} :: {t['name']}**")
                  if t.get('output'):
                      first_line = t['output'].strip().splitlines()[0]
                      lines.append(f"  - `{first_line}`")
              lines.append("")

          lines.append("| Suite | Passed | Failed | Ignored | Duration |")
          lines.append("|---|---|---|---|---|")
          for s in suites:
              mark = "✅" if s['failed'] == 0 else "❌"
              lines.append(
                  f"| {mark} {s['name']} | {s['passed']} | {s['failed']} | "
                  f"{s['ignored']} | {s['duration_s']:.2f}s |"
              )
          lines.append("")
          lines.append(
              f"**Total: {summary['total']}** &nbsp;|&nbsp; "
              f"Passed: {summary['passed']} &nbsp;|&nbsp; "
              f"Failed: {summary['failed']} &nbsp;|&nbsp; "
              f"Ignored: {summary['ignored']} &nbsp;|&nbsp; "
              f"Duration: {summary['duration_s']:.2f}s"
          )
          lines.append("")

          for s in suites:
              lines.append(f"<details><summary>{s['name']} — {len(s['tests'])} tests</summary>")
              lines.append("")
              lines.append("| Test | Status |")
              lines.append("|---|---|")
              for t in s['tests']:
                  mark = "✅" if t['status'] == 'passed' else "❌"
                  lines.append(f"| `{t['name']}` | {mark} |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Upload raw log + JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-ptr-test-results-${{ github.run_number }}
          path: |
            mid-ptr-test-raw.txt
            mid-ptr-test-results.json
          retention-days: 7
