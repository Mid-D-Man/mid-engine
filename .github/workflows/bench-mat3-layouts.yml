# .github/workflows/bench-mat3-layouts.yml
# Run: Actions → "mid-math: bench Mat3 vs Affine2 vs flat f32 layouts" → Run workflow
# DO NOT add push/pull_request triggers — benchmarks take 5-10 minutes.
#
# Experiment: does the storage layout (Mat3's 3×Vec3 vs Affine2's 2×Vec2+Vec2
# vs raw f32[6]) actually matter once everything is inlined, or does the
# abstraction cost nothing? See benches/vs_mat3_layouts.rs for the full
# rationale and what each group is isolating.

name: mid-math — bench Mat3 vs Affine2 vs flat f32 layouts

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Why are you running this? (e.g. "after Affine2 inverse rewrite")'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      # ── Bench: vs_mat3_layouts ───────────────────────────────────────────────
      - name: Run vs_mat3_layouts criterion benchmarks
        run: |
          echo "Running: cargo bench --bench vs_mat3_layouts -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_mat3_layouts -p mid-math 2>&1 | tee bench-mat3-layouts-raw.txt

      # ── Publish summary ──────────────────────────────────────────────────────
      - name: Publish benchmark summary
        run: |
          {
            echo "## mid-math — Mat3 vs Affine2 vs flat f32[6] layouts"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "**Candidates:**"
            echo "- \`Mat3\`     — general 3×3, \`[[f32;3];3]\`, 36 bytes, cofactor inverse"
            echo "- \`Affine2\`  — TRS-only, 2×\`Vec2\`+\`Vec2\`, 24 bytes, fast specialized inverse"
            echo "- \`f32_flat\` — raw \`[f32; 6]\`, hand-written scalar math, no struct at all"
            echo ""
            echo "> Lower is faster. \`Affine2\` vs \`f32_flat\` is the number that matters —"
            echo "> if they're statistically indistinguishable, the \`Vec2\` abstraction is free."
            echo "> \`Mat3\` is the general-case reference point; it's expected to lose on"
            echo "> \`inverse\` (different algorithm, not just layout) but should be close on"
            echo "> \`compose\`/\`transform_point\`."
            echo ""

            python3 - << 'PYEOF'
          import re

          RE_ANSI  = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          RE_RESULT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE,
          )
          RE_THROUGHPUT = re.compile(
              r'^(\S[^\n]+?)\s+thrpt:\s+\[\s*([\d.]+\s+\S+/s)\s+([\d.]+\s+\S+/s)\s+([\d.]+\s+\S+/s)\s*\]',
              re.MULTILINE,
          )

          def parse_bench_file(path, title):
              try:
                  raw = open(path, encoding='utf-8', errors='replace').read()
              except FileNotFoundError:
                  print(f"*({path} not found)*")
                  return

              text = RE_ANSI.sub('', raw)
              throughputs = {m.group(1).strip(): m.group(3).strip() for m in RE_THROUGHPUT.finditer(text)}
              current_group = None
              group_rows = []

              print(f"\n---\n\n### {title}\n")

              for m in RE_RESULT.finditer(text):
                  name = m.group(1).strip()
                  mean = m.group(3).strip()
                  thrpt = throughputs.get(name, '')

                  parts = name.split('/')
                  if len(parts) >= 2:
                      group   = '/'.join(parts[:-1])
                      variant = parts[-1]
                  else:
                      group   = name
                      variant = ''

                  if group != current_group:
                      if current_group is not None:
                          print()
                      print(f"#### {group}")
                      if thrpt:
                          print("| Layout | Mean | Throughput |")
                          print("|---|---|---|")
                      else:
                          print("| Layout | Mean |")
                          print("|---|---|")
                      current_group = group
                      group_rows = []

                  group_rows.append((variant, mean))
                  if thrpt:
                      print(f"| {variant} | {mean} | {thrpt} |")
                  else:
                      print(f"| {variant} | {mean} |")

          parse_bench_file('bench-mat3-layouts-raw.txt', 'vs_mat3_layouts — Mat3 / Affine2 / f32_flat')
          PYEOF

          } >> $GITHUB_STEP_SUMMARY

      # ── Upload raw logs and criterion HTML ────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-mat3-layouts-results-${{ github.run_number }}
          path: |
            bench-mat3-layouts-raw.txt
            target/criterion/
          retention-days: 30
