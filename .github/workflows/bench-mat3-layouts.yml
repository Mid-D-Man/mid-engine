# .github/workflows/bench-mat3-layouts.yml
# Does the storage layout (Mat3's 3xVec3 vs Affine2's 2xVec2+Vec2 vs raw f32[6]) matter once inlined? See benches/vs_mat3_layouts.rs for the full rationale. Upgraded from a single free-text-note input to the standard target_cpu dropdown; summary now uses the shared scripts/bench_vs_all.py parser instead of an inline heredoc copy of the same logic.
# Run: Actions → "mid-math — bench Mat3 vs Affine2 vs flat f32 layouts" → Run workflow
# DO NOT add push/pull_request triggers.

name: mid-math — bench Mat3 vs Affine2 vs flat f32 layouts

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: >
          Compiler target-cpu or architecture configuration.
          native     = all hardware features the runner has.
          x86-64-v4  = AVX-512 requested — this crate has no hand-written
                       AVX-512 backend anywhere, so this activates the same
                       AVX2 path as x86-64-v3. Kept for platform-matrix
                       consistency and because requesting this target-cpu
                       carries a real SIGILL risk on non-AVX-512 hardware
                       regardless of hand-written code (rustc's
                       autovectorizer can emit it anywhere) — same hardware
                       soft-gate as every other bench workflow in this repo.
          x86-64-v3  = AVX2+FMA+BMI2 guaranteed (Haswell+).
          x86-64-v2  = SSE4.2 baseline — no AVX.
          x86-64     = SSE2 only.
          neon       = ARM NEON via -C target-cpu=native on a native
                       aarch64 runner.
          wasm       = WebAssembly wasm32-wasip1 + simd128 via wasmtime.
          scalar     = pure scalar fallback via --features force-scalar.
        required: true
        default: 'native'
        type: choice
        options:
          - native
          - x86-64-v4
          - x86-64-v3
          - x86-64-v2
          - x86-64
          - neon
          - wasm
          - scalar
      mat3_group:
        description: >
          Which mat3_layouts criterion group to run (without the mat3_layouts/ prefix). Matched as ^mat3_layouts/<group>/ (anchored, not a bare substring) against benches/vs_mat3_layouts.rs's group names — e.g. 'compose' runs only mat3_layouts/compose, and deliberately does NOT also sweep in mat3_layouts/batch_10k_compose_and_transform (which contains 'compose' as a substring) the way a bare unanchored filter would.
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - batch_10k_compose_and_transform
          - compose
          - construction
          - inverse
          - transform_point

env:
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    name: bench (${{ inputs.target_cpu }}, ${{ inputs.mat3_group }})
    runs-on: ${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure target environment
        run: python3 scripts/bench_target_env.py "${{ inputs.target_cpu }}" >> "$GITHUB_ENV"

      - name: Check AVX-512 hardware availability
        id: hwcheck
        if: inputs.target_cpu == 'x86-64-v4'
        run: |
          if grep -qw 'avx512f' /proc/cpuinfo; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## bench (x86-64-v4) — skipped"
              echo ""
              echo "> GitHub-hosted \`ubuntu-latest\` runners use AMD EPYC CPUs without AVX-512."
              echo "> rustc will happily emit AVX-512 instructions for \`-C target-cpu=x86-64-v4\`"
              echo "> regardless of the host's real capabilities — running the resulting binary"
              echo "> here would SIGILL. This run is marked successful (skipped, not failed)."
              echo "> x86-64-v3 gets you the same AVX2 path this crate actually has."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ inputs.target_cpu == 'wasm' && 'wasm32-wasip1' || '' }}
          rustflags: ""

      - name: Install wasmtime
        if: inputs.target_cpu == 'wasm'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: v25.0.2

      - name: Configure WASM test runner
        if: inputs.target_cpu == 'wasm'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.wasm32-wasip1]
          runner = ["wasmtime", "run", "--dir", ".", "--env", "CRITERION_DEBUG=1", "--"]
          EOF

      - name: Confirm CPU and compiler features
        run: |
          {
            echo "## CPU & Compiler — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Runner        | \`${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}\` |"
            echo "| target-cpu    | \`${{ inputs.target_cpu }}\` |"
            echo "| mat3_group | \`${{ inputs.mat3_group }}\` |"
            echo "| ACTIVE_CPU_FLAGS | \`$ACTIVE_CPU_FLAGS\` |"
            echo "| Rust          | \`$(rustc --version)\` |"
            echo "| Branch        | \`${{ github.ref_name }}\` |"
            echo "| Commit        | \`${GITHUB_SHA:0:8}\` |"
            echo ""
            echo "### Rustc target_feature cfg"
            echo '```'
            if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
              rustc --print cfg --target wasm32-wasip1 $RUSTFLAGS 2>&1 | grep '^target_feature' | sort
            else
              rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -E '^target_(arch|feature)' | sort
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache cargo registry + build artifacts
        if: steps.hwcheck.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-bench-mat3-layouts-${{ inputs.target_cpu }}-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bench-mat3-layouts-${{ inputs.target_cpu }}-v1-

      - name: Run vs_mat3_layouts criterion benchmarks
        if: steps.hwcheck.outputs.skip != 'true'
        run: |
          set -o pipefail
          SEL="${{ inputs.mat3_group }}"
          if [ "$SEL" = "all" ]; then FILTER=""; else FILTER="^mat3_layouts/${SEL}/"; fi
          cargo bench --bench vs_mat3_layouts -p mid-math $BENCH_TARGET $BENCH_FEATURES -- "$FILTER" 2>&1 | tee bench-mat3-layouts-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      - name: Surface bench diagnostics
        if: steps.hwcheck.outputs.skip != 'true'
        run: |
          {
            echo "### Diagnostics"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|Completed [0-9]+ iterations' \
              bench-mat3-layouts-raw.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary
        if: steps.hwcheck.outputs.skip != 'true'
        env:
          BENCH_RAW_FILE: bench-mat3-layouts-raw.txt
        run: |
          {
            echo "## mid-math — Mat3 vs Affine2 vs flat f32[6] layouts"
            echo ""
            echo "Build: #${{ github.run_number }} &nbsp;|&nbsp; Rust: \`$(rustc --version | cut -d' ' -f2)\` &nbsp;|&nbsp; target-cpu: \`${{ inputs.target_cpu }}\` &nbsp;|&nbsp; mat3_group: \`${{ inputs.mat3_group }}\`"
            echo ""
            echo "> Candidates: Mat3 (general 3x3, [[f32;3];3], 36 bytes, cofactor inverse); Affine2 (TRS-only, 2xVec2+Vec2, 24 bytes, fast specialized inverse); f32_flat (raw [f32; 6], hand-written scalar math, no struct at all)."
            echo "> Lower is faster. Affine2 vs f32_flat is the number that matters — if they're statistically indistinguishable, the Vec2 abstraction is free."
            echo "> Mat3 is the general-case reference point; expected to lose on inverse (different algorithm, not just layout) but should be close on compose/transform_point."
            echo ""
            python3 scripts/bench_vs_all.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: steps.hwcheck.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-mat3-layouts-results-${{ github.run_number }}-${{ inputs.target_cpu }}-${{ inputs.mat3_group }}
          path: |
            bench-mat3-layouts-raw.txt
            target/criterion/
          retention-days: 30
