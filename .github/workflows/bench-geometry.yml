name: bench-geometry

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: geometry benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-bench-geom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-bench-geom-

      - name: Build release
        run: cargo build --release -p mid-geom

      - name: Run geometry benchmarks
        run: |
          cargo bench -p mid-geom 2>&1 | tee bench-output.txt

      - name: Print summary
        run: |
          echo "=== GEOMETRY BENCHMARK SUMMARY ==="
          grep -E "(micro|bulk|ray|ns|µs|ms|time:)" bench-output.txt | head -100 || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-geometry-${{ github.sha }}
          path: |
            bench-output.txt
            target/criterion/
          retention-days: 30
