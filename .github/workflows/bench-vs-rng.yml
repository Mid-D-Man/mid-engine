# .github/workflows/bench-vs-rng.yml
name: mid-math — bench rng

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context (e.g. "baseline Xorshift64 vs PCG32")'
        required: false
        default: 'manual rng benchmark run'

permissions:
  contents: read
  actions: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-bench-rng-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-bench-rng-

      - name: Run RNG benchmarks
        run: |
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_rng -p mid-math 2>&1 | tee bench-rng-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      - name: Surface bench diagnostics
        run: |
          {
            echo "### Diagnostics"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|Completed [0-9]+ iterations' \
              bench-rng-raw.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary
        env:
          BENCH_RAW_FILE: bench-rng-raw.txt
        run: |
          {
            echo "## mid-math RNG Benchmarks — Xorshift64 vs PCG32"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> **Xorshift64:** 3 XOR+shift ops ~1 ns. Best for hot simulation loops."
            echo "> **PCG32:** 1 multiply + XSH-RR permutation ~1–2 ns. Better stats; independent streams."
            echo "> PCG32 advance() is O(log n) — enables parallel skip-ahead."
            echo "> Both are deterministic: same seed → same sequence on x86, ARM, WASM."
            echo "> bulk\_1m sample\_size=20."
            echo ""
            python3 scripts/bench_vs_all.py

          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: bench-rng-${{ github.run_number }}
          path: |
            bench-rng-raw.txt
            target/criterion/
          retention-days: 30
