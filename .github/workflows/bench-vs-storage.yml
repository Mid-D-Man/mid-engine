# .github/workflows/bench-vs-storage.yml
# f16/bf16/F8/F4/BitMask. Upgraded from a single free-text-note input to the standard target_cpu dropdown; summary now uses the shared scripts/bench_vs_all.py parser instead of an inline heredoc copy of the same logic (which already supported throughput columns, same as the generic script).
# Run: Actions → "mid-math — bench storage types" → Run workflow
# DO NOT add push/pull_request triggers.

name: mid-math — bench storage types

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: >
          Compiler target-cpu or architecture configuration.
          native     = all hardware features the runner has.
          x86-64-v4  = AVX-512 requested — this crate has no hand-written
                       AVX-512 backend anywhere, so this activates the same
                       AVX2 path as x86-64-v3. Kept for platform-matrix
                       consistency and because requesting this target-cpu
                       carries a real SIGILL risk on non-AVX-512 hardware
                       regardless of hand-written code (rustc's
                       autovectorizer can emit it anywhere) — same hardware
                       soft-gate as every other bench workflow in this repo.
          x86-64-v3  = AVX2+FMA+BMI2 guaranteed (Haswell+).
          x86-64-v2  = SSE4.2 baseline — no AVX.
          x86-64     = SSE2 only.
          neon       = ARM NEON via -C target-cpu=native on a native
                       aarch64 runner.
          wasm       = WebAssembly wasm32-wasip1 + simd128 via wasmtime.
          scalar     = pure scalar fallback via --features force-scalar.
        required: true
        default: 'native'
        type: choice
        options:
          - native
          - x86-64-v4
          - x86-64-v3
          - x86-64-v2
          - x86-64
          - neon
          - wasm
          - scalar
      storage_type:
        description: >
          Which storage type's criterion group(s) to run. Matched as ^<type>/ (anchored, not a bare substring) against benches/vs_storage.rs's group names — e.g. 'f16' runs only f16/batch, f16/scalar, f16/slice_1k, and deliberately does NOT also sweep in bf16/* (which contains the substring 'f16') the way a bare unanchored filter would.
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bf16
          - bitmask256
          - bitmask64
          - f16
          - f4
          - f4e2m1
          - f4e3m0
          - f8
          - f8e4m3
          - f8e5m2
          - f8norm

env:
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    name: bench (${{ inputs.target_cpu }}, ${{ inputs.storage_type }})
    runs-on: ${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure target environment
        run: python3 scripts/bench_target_env.py "${{ inputs.target_cpu }}" >> "$GITHUB_ENV"

      - name: Check AVX-512 hardware availability
        id: hwcheck
        if: inputs.target_cpu == 'x86-64-v4'
        run: |
          if grep -qw 'avx512f' /proc/cpuinfo; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## bench (x86-64-v4) — skipped"
              echo ""
              echo "> GitHub-hosted \`ubuntu-latest\` runners use AMD EPYC CPUs without AVX-512."
              echo "> rustc will happily emit AVX-512 instructions for \`-C target-cpu=x86-64-v4\`"
              echo "> regardless of the host's real capabilities — running the resulting binary"
              echo "> here would SIGILL. This run is marked successful (skipped, not failed)."
              echo "> x86-64-v3 gets you the same AVX2 path this crate actually has."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ inputs.target_cpu == 'wasm' && 'wasm32-wasip1' || '' }}
          rustflags: ""

      - name: Install wasmtime
        if: inputs.target_cpu == 'wasm'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: v25.0.2

      - name: Configure WASM test runner
        if: inputs.target_cpu == 'wasm'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.wasm32-wasip1]
          runner = ["wasmtime", "run", "--dir", ".", "--env", "CRITERION_DEBUG=1", "--"]
          EOF

      - name: Confirm CPU and compiler features
        run: |
          {
            echo "## CPU & Compiler — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Runner        | \`${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}\` |"
            echo "| target-cpu    | \`${{ inputs.target_cpu }}\` |"
            echo "| storage_type | \`${{ inputs.storage_type }}\` |"
            echo "| ACTIVE_CPU_FLAGS | \`$ACTIVE_CPU_FLAGS\` |"
            echo "| Rust          | \`$(rustc --version)\` |"
            echo "| Branch        | \`${{ github.ref_name }}\` |"
            echo "| Commit        | \`${GITHUB_SHA:0:8}\` |"
            echo ""
            echo "### Rustc target_feature cfg"
            echo '```'
            if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
              rustc --print cfg --target wasm32-wasip1 $RUSTFLAGS 2>&1 | grep '^target_feature' | sort
            else
              rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -E '^target_(arch|feature)' | sort
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache cargo registry + build artifacts
        if: steps.hwcheck.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-bench-storage-${{ inputs.target_cpu }}-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bench-storage-${{ inputs.target_cpu }}-v1-

      - name: Run vs_storage criterion benchmarks
        if: steps.hwcheck.outputs.skip != 'true'
        run: |
          set -o pipefail
          SEL="${{ inputs.storage_type }}"
          if [ "$SEL" = "all" ]; then FILTER=""; else FILTER="^${SEL}/"; fi
          cargo bench --bench vs_storage -p mid-math $BENCH_TARGET $BENCH_FEATURES -- "$FILTER" 2>&1 | tee bench-vs-storage-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      - name: Surface bench diagnostics
        if: steps.hwcheck.outputs.skip != 'true'
        run: |
          {
            echo "### Diagnostics"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|Completed [0-9]+ iterations' \
              bench-vs-storage-raw.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary
        if: steps.hwcheck.outputs.skip != 'true'
        env:
          BENCH_RAW_FILE: bench-vs-storage-raw.txt
        run: |
          {
            echo "## mid-math storage types — Criterion Benchmarks"
            echo ""
            echo "Build: #${{ github.run_number }} &nbsp;|&nbsp; Rust: \`$(rustc --version | cut -d' ' -f2)\` &nbsp;|&nbsp; target-cpu: \`${{ inputs.target_cpu }}\` &nbsp;|&nbsp; storage_type: \`${{ inputs.storage_type }}\`"
            echo ""
            echo "> Covers: f16, bf16, F8Norm/F8E4M3/F8E5M2, F4E2M1/F4E3M0 (+ packed pairs), BitMask8–BitMask256."
            echo "> Lower is faster. Each group shows related operations side by side."
            echo "> Throughput groups (batch_x4/x8, slice_1k, ecs_query_10k) also report elements/sec."
            echo "> No external-crate comparison yet (the half crate would be the natural target for f16/bf16 — not added this pass)."
            echo ""
            python3 scripts/bench_vs_all.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: steps.hwcheck.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-storage-results-${{ github.run_number }}-${{ inputs.target_cpu }}-${{ inputs.storage_type }}
          path: |
            bench-vs-storage-raw.txt
            target/criterion/
          retention-days: 30
