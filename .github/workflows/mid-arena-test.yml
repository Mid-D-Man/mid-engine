# .github/workflows/mid-arena-test.yml
#
# Tests, lint, Miri and AddressSanitizer for mid-arena, including every
# feature gate. workspace-ci.yml builds mid-arena with default features
# only, so `bump`, `compact`, `unchecked` and `ffi` get no coverage there.
#
# Shape follows docs/RUST_AND_CRATE_GUIDELINES.md section 7:
# workflow_dispatch only, a real $GITHUB_STEP_SUMMARY, raw log and JSON
# uploaded as an artifact, `set -o pipefail` before every `| tee`.
#
# Benches are not linted here. They need the newer toolchain and are
# covered by bench-vs-c-arena-libs.yml.
#
# The Miri and ASan jobs call `cargo +nightly` explicitly because the
# repo's rust-toolchain.toml pins `stable`, which would otherwise win.

name: mid-arena - Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  actions:  read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-arena-${{ runner.os }}-${{ hashFiles('crates/mid-arena/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-arena-${{ runner.os }}-

      - name: Record resolved dependency versions
        continue-on-error: true
        run: |
          {
            echo "### Resolved versions"
            echo '```'
            cargo tree --color never -p mid-arena --all-features -e normal,dev | grep -E "zerocopy|bumpalo" | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check formatting
        id: fmt
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt -p mid-arena --check -- --color never 2>&1 | tee fmt.txt

      - name: Clippy, every feature set
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          : > clippy.txt
          status=0
          for F in "" ffi bump compact unchecked "bump,compact,unchecked,ffi"; do
            echo "=== clippy: features [${F:-default}]" | tee -a clippy.txt
            cargo clippy -p mid-arena --lib --tests --examples ${F:+--features "$F"} --color=never -- \
              -D warnings -A clippy::excessive_precision -A clippy::approx_constant -A clippy::float_cmp -A clippy::too_many_arguments \
              -W clippy::undocumented_unsafe_blocks 2>&1 | tee -a clippy.txt || status=1
          done
          exit $status

      - name: Build, default features (zero dependencies) and all features
        run: |
          cargo build -p mid-arena
          cargo build -p mid-arena --all-features

      - name: Run unit tests + doc-tests, every feature set
        continue-on-error: true
        run: |
          # set -o pipefail: without this, `cargo test | tee file` reports
          # tee's exit code (always 0), not cargo test's -- see
          # docs/benching-standards.md's own "correctness detail" section.
          set -o pipefail
          : > mid-arena-test-raw.txt
          status=0
          run_set() {
            local feats="$1" prof="$2" label="$3"
            echo "===FEATURES: $label===" >> mid-arena-test-raw.txt
            cargo test -p mid-arena ${feats:+--features "$feats"} $prof \
              --color=never --no-fail-fast -- --show-output 2>&1 \
              | tee -a mid-arena-test-raw.txt || status=1
          }
          for F in "" ffi bump compact unchecked "bump,compact,unchecked,ffi"; do
            run_set "$F" "" "${F:-default} / debug"
          done
          for F in "" "bump,compact,unchecked,ffi"; do
            run_set "$F" "--release" "${F:-default} / release"
          done
          exit $status

      - name: Parse results to JSON
        if: always()
        env:
          BUILD_NUM:    ${{ github.run_number }}
          BRANCH:       ${{ github.ref_name }}
          COMMIT:       ${{ github.sha }}
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          python3 - << 'PYEOF'
          import re, json, os

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          def strip(s): return RE_ANSI.sub('', s)

          try:
              raw = open('mid-arena-test-raw.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              raw = ''
          text = strip(raw)

          test_output = {}
          for m in re.finditer(
              r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)'
              r'(?=\n---- |\n\n(?:successes|failures):\n|\ntest result:|\Z)',
              text, re.DOTALL):
              content = m.group(2).strip()
              if content:
                  test_output[m.group(1)] = content

          fail_output = {}
          fail_section = re.search(r'\nfailures:\n(.*?)(?:\ntest result:|\Z)', text, re.DOTALL)
          if fail_section:
              for m in re.finditer(
                  r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)(?=\n---- |\Z)',
                  fail_section.group(1), re.DOTALL):
                  content = m.group(2).strip()
                  if content:
                      fail_output[m.group(1)] = content

          suites    = []
          cur_name  = None
          cur_tests = []
          cur_dur   = 0.0
          cur_feat  = ''

          # One marker line per `cargo test` run names the feature set and profile,
          # so the same suite name from different runs stays distinguishable.
          RE_FEAT   = re.compile(r'^===FEATURES: (.*)===\s*$')
          RE_RUN    = re.compile(r'Running\s+.*?\(\S*?/deps/([A-Za-z0-9_]+)-[0-9a-f]{8,}\)\s*$')
          RE_DOC    = re.compile(r'^\s*Doc-tests\s+(\S+)\s*$')
          RE_TEST   = re.compile(
              r'^test\s+([\w:./-]+(?:::\w+)*(?:\s-\s\S+\s\(line\s\d+\))?)\s+\.\.\.\s+'
              r'(ok|FAILED|ignored)(?:\s+\(([\d.]+)s\))?'
          )
          RE_RESULT = re.compile(r'test result:.*?finished in ([\d.]+)s')

          def label(base):
              return f"{base} [{cur_feat}]" if cur_feat else base

          def flush(name, tests, dur):
              if name is not None:
                  suites.append({
                      'name':       name,
                      'passed':     sum(1 for t in tests if t['status'] == 'passed'),
                      'failed':     sum(1 for t in tests if t['status'] == 'failed'),
                      'ignored':    sum(1 for t in tests if t['status'] == 'ignored'),
                      'duration_s': round(dur, 4),
                      'tests':      tests,
                  })

          for line in text.splitlines():
              m = RE_FEAT.match(line)
              if m:
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = None, [], 0.0
                  cur_feat = m.group(1)
                  continue
              m = RE_RUN.search(line)
              if m:
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = label(m.group(1).replace('_', '-')), [], 0.0
                  continue
              m = RE_DOC.match(line)
              if m:
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = label(f"{m.group(1)} (doc-tests)"), [], 0.0
                  continue
              m = RE_TEST.match(line)
              if m:
                  if cur_name is None:
                      cur_name, cur_tests, cur_dur = label('unknown suite'), [], 0.0
                  tname, status, dur = m.group(1), m.group(2), m.group(3)
                  out = fail_output.get(tname) or test_output.get(tname, '')
                  cur_tests.append({
                      'name':        tname,
                      'status':      {'ok': 'passed', 'FAILED': 'failed', 'ignored': 'ignored'}.get(status, 'unknown'),
                      'duration_ms': int(float(dur) * 1000) if dur else 0,
                      'output':      out,
                  })
                  continue
              m = RE_RESULT.search(line)
              if m:
                  cur_dur = float(m.group(1))
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = None, [], 0.0

          flush(cur_name, cur_tests, cur_dur)

          total   = sum(s['passed'] + s['failed'] + s['ignored'] for s in suites)
          passed  = sum(s['passed']  for s in suites)
          failed  = sum(s['failed']  for s in suites)
          ignored = sum(s['ignored'] for s in suites)
          dur     = sum(s['duration_s'] for s in suites)

          result = {
              'build':        os.environ.get('BUILD_NUM',    '0'),
              'branch':       os.environ.get('BRANCH',       'unknown'),
              'commit':       os.environ.get('COMMIT',       'unknown')[:8],
              'rust_version': os.environ.get('RUST_VERSION', 'stable'),
              'crate':        'mid-arena',
              'summary': {
                  'total':      total,
                  'passed':     passed,
                  'failed':     failed,
                  'ignored':    ignored,
                  'duration_s': round(dur, 3),
              },
              'suites': suites,
          }

          with open('mid-arena-test-results.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"Suites:{len(suites)}  Passed:{passed}  Failed:{failed}  Ignored:{ignored}")
          PYEOF

      - name: Write test results to job summary
        if: always()
        run: |
          python3 - << 'PYEOF'
          import json, os

          try:
              with open('mid-arena-test-results.json') as f:
                  result = json.load(f)
          except FileNotFoundError:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("## mid-arena Test Results\n\n")
                  f.write("`mid-arena-test-results.json` was not produced. The parse step "
                          "above likely failed before writing it. Check its log.\n")
              raise SystemExit(0)

          summary = result['summary']
          suites  = result['suites']

          lines = []
          lines.append(f"## mid-arena Test Results - Build #{result['build']}")
          lines.append("")
          lines.append(
              f"Branch: `{result['branch']}` &nbsp;|&nbsp; "
              f"Commit: `{result['commit']}` &nbsp;|&nbsp; "
              f"Rust: `{result['rust_version']}`"
          )
          lines.append("")

          if summary['failed'] == 0 and summary['total'] > 0:
              lines.append(f"### ✅ All {summary['total']} tests passed")
          elif summary['total'] == 0:
              lines.append("### ⚠️ No tests were collected. Check the raw log")
          else:
              lines.append(f"### ❌ {summary['failed']} of {summary['total']} tests failed")
          lines.append("")

          failing = [
              (s['name'], t)
              for s in suites
              for t in s['tests']
              if t['status'] == 'failed'
          ]
          if failing:
              lines.append("### Failures")
              lines.append("")
              for suite_name, t in failing:
                  lines.append(f"- **{suite_name} :: {t['name']}**")
                  if t.get('output'):
                      first_line = t['output'].strip().splitlines()[0]
                      lines.append(f"  - `{first_line}`")
              lines.append("")

          lines.append("| Suite | Passed | Failed | Ignored | Duration |")
          lines.append("|---|---|---|---|---|")
          for s in suites:
              mark = "✅" if s['failed'] == 0 else "❌"
              lines.append(
                  f"| {mark} {s['name']} | {s['passed']} | {s['failed']} | "
                  f"{s['ignored']} | {s['duration_s']:.2f}s |"
              )
          lines.append("")
          lines.append(
              f"**Total: {summary['total']}** &nbsp;|&nbsp; "
              f"Passed: {summary['passed']} &nbsp;|&nbsp; "
              f"Failed: {summary['failed']} &nbsp;|&nbsp; "
              f"Ignored: {summary['ignored']} &nbsp;|&nbsp; "
              f"Duration: {summary['duration_s']:.2f}s"
          )
          lines.append("")

          for s in suites:
              lines.append(f"<details><summary>{s['name']} - {len(s['tests'])} tests</summary>")
              lines.append("")
              lines.append("| Test | Status |")
              lines.append("|---|---|")
              for t in s['tests']:
                  mark = "✅" if t['status'] == 'passed' else "❌"
                  lines.append(f"| `{t['name']}` | {mark} |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Write format and clippy status to job summary
        if: always()
        run: |
          {
            echo "## mid-arena fmt and clippy"
            echo ""
            for entry in \
              "rustfmt|${{ steps.fmt.outcome }}|fmt.txt" \
              "clippy|${{ steps.clippy.outcome }}|clippy.txt"; do
              IFS='|' read -r name outcome file <<< "$entry"
              if [ "$outcome" = "success" ]; then
                echo "### ✅ $name"
              else
                echo "### ❌ $name ($outcome)"
                echo ""
                if [ "$name" = "clippy" ]; then
                  echo "Diagnostics, one line each (count, message, location):"
                  echo ""
                  echo '```'
                  awk '/^(warning|error)/ {msg=$0; next} /^ +--> / {print msg " @ " $2; msg=""}' "$file" 2>/dev/null | sort | uniq -c | sort -rn | head -40
                  echo '```'
                  echo ""
                fi
                echo "<details><summary>First 120 lines of the raw log</summary>"
                echo ""
                echo '```'
                head -n 120 "$file" 2>/dev/null || echo "(no log)"
                echo '```'
                echo "</details>"
              fi
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw log + JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-arena-test-results-${{ github.run_number }}
          path: |
            mid-arena-test-raw.txt
            mid-arena-test-results.json
            fmt.txt
            clippy.txt
          retention-days: 7

  miri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-arena-miri-${{ runner.os }}-${{ hashFiles('crates/mid-arena/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-arena-miri-${{ runner.os }}-

      # Stacked Borrows is Miri's default model and the stricter one for
      # the `&self` -> `&mut T` arena API. Tree Borrows runs second so a
      # failure under only one model is visible as such.
      - name: Miri, Stacked Borrows, every feature
        id: miri_sb
        continue-on-error: true
        run: |
          set -o pipefail
          cargo +nightly miri test -p mid-arena --all-features --lib --color=never 2>&1 \
            | tee miri-stacked-borrows.txt

      - name: Miri, Tree Borrows, every feature
        id: miri_tb
        continue-on-error: true
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
        run: |
          set -o pipefail
          cargo +nightly miri test -p mid-arena --all-features --lib --color=never 2>&1 \
            | tee miri-tree-borrows.txt

      - name: Write Miri results to job summary
        if: always()
        run: |
          {
            echo "## mid-arena Miri"
            echo ""
            for entry in \
              "Stacked Borrows|${{ steps.miri_sb.outcome }}|miri-stacked-borrows.txt" \
              "Tree Borrows|${{ steps.miri_tb.outcome }}|miri-tree-borrows.txt"; do
              IFS='|' read -r name outcome file <<< "$entry"
              if [ "$outcome" = "success" ]; then
                echo "### ✅ $name"
                echo ""
                grep -E "^test result:" "$file" | sed 's/^/    /' || true
              else
                echo "### ❌ $name ($outcome)"
                echo ""
                echo "<details><summary>Last 60 lines</summary>"
                echo ""
                echo '```'
                tail -n 60 "$file" 2>/dev/null || echo "(no log)"
                echo '```'
                echo "</details>"
              fi
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Miri logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-arena-miri-${{ github.run_number }}
          path: |
            miri-stacked-borrows.txt
            miri-tree-borrows.txt
          retention-days: 7

  asan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-arena-asan-${{ runner.os }}-${{ hashFiles('crates/mid-arena/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-arena-asan-${{ runner.os }}-

      # `--target` keeps the sanitizer off proc macros and build scripts.
      # LeakSanitizer is on by default for this target.
      - name: AddressSanitizer, every feature
        id: asan
        continue-on-error: true
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          set -o pipefail
          cargo +nightly test -p mid-arena --all-features --lib \
            --target x86_64-unknown-linux-gnu --color=never 2>&1 | tee asan.txt

      - name: Write AddressSanitizer result to job summary
        if: always()
        run: |
          {
            echo "## mid-arena AddressSanitizer"
            echo ""
            if [ "${{ steps.asan.outcome }}" = "success" ]; then
              echo "### ✅ passed"
              echo ""
              grep -E "^test result:" asan.txt | sed 's/^/    /' || true
            else
              echo "### ❌ ${{ steps.asan.outcome }}"
              echo ""
              echo "<details><summary>Last 60 lines</summary>"
              echo ""
              echo '```'
              tail -n 60 asan.txt 2>/dev/null || echo "(no log)"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AddressSanitizer log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-arena-asan-${{ github.run_number }}
          path: asan.txt
          retention-days: 7
