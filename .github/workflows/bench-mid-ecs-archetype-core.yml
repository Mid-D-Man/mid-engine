# .github/workflows/bench-mid-ecs-archetype-core.yml
#
# mid-ecs's own Archetype Core operations (spawn+insert_bundle,
# query_static, query2_static, structural churn, a zero-abstraction
# raw_slice_ceiling floor) -- mid-ecs only, no bevy_ecs dependency, so
# unlike benches/ecs-vs-bevy-ecs this doesn't need rustc 1.95+ and runs
# on any toolchain this workspace already supports. See
# crates/mid-ecs/benches/archetype_core.rs's own header doc comment for
# the full rationale and group-by-group breakdown -- that comment is
# the authoritative, current writeup; treat anything below as a summary
# of it, not a replacement.
#
# Uses scripts/bench_mid_ecs_archetype_core.py for the summary --
# earlier version of this workflow used a bash-grep dump instead (the
# same pattern bench-mid-collections-sparse-set.yml still uses), on the
# reasoning that this suite has no natural "vs X" baseline the way
# sparse_set has HashMap or vs_bevy_ecs has bevy_ecs. That reasoning
# didn't hold up: query_static_single_component vs
# query2_static_two_components at the same N *is* a real, meaningful
# ratio (see the .py script and the bench file's own doc comment for
# what it should look like and why), so it gets the same structured
# table+ratio+badge treatment as everything else. `set -o pipefail`
# included from the start -- not a retrofit, see docs/benching-
# standards.md's own "correctness detail that actually matters more
# than formatting" section for why.
#
# No ISA-tier target_cpu matrix -- same reasoning docs/benching-
# standards.md already gives for bench-mid-collections-sparse-set.yml
# and bench-vs-bevy-ecs.yml: this suite's operations are archetype-
# migration, SparseSet-lookup, and Box<dyn Any>-downcast bound, not
# vectorizable arithmetic. No cross-OS matrix either for now -- mid-ecs
# has no platform-specific code path to diverge on (unlike mid-math's
# per-ISA SIMD backends); worth adding the same opt-in `platforms`
# pattern bench-vs-bevy-ecs.yml has if that ever changes.
#
# REAL STATE, as of the session that added raw_slice_ceiling and this
# script (see crates/mid-ecs/benches/archetype_core.rs's own doc
# comment for the full, current writeup -- this is a summary, not a
# replacement): query_static_single_component and
# query2_static_two_components both went through a real, two-part fix
# each (a per-entity-redundant-lookup fix, then a combinator-chain
# -> hand-written-iterator rewrite, `Iter1`/`Iter2` in
# crates/mid-ecs/src/archetype.rs). Both are now within noise of
# bevy_ecs's own real CI numbers for the same N=10,000 workload -- zero
# `unsafe` added either time. spawn_insert_bundle and
# structural_churn_insert_remove have NOT had an equivalent root-cause
# pass -- real CI (benches/ecs-vs-bevy-ecs) shows mid-ecs ~2.9-5x
# slower than bevy_ecs on both, same order of magnitude, no evidence
# yet they share a cause with the now-fixed query-iteration gap.
#
# Run: Actions -> "mid-ecs — bench Archetype Core" -> Run workflow
# DO NOT add push/pull_request triggers.

name: mid-ecs — bench Archetype Core

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run (e.g. "after iter2 column-resolution fix")'
        required: false
        default: 'manual Archetype Core benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      # Caches target/ too, not just the registry -- same reasoning as
      # bench-mid-collections-sparse-set.yml: lets criterion's own
      # target/criterion baseline persist between runs, so after the
      # first run each subsequent one shows a real comparison-to-
      # previous delta, not just an absolute number in isolation. This
      # is the actual mechanism that will show whether a future change
      # regresses query2_static_two_components back toward its old
      # per-entity-lookup cost.
      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-mid-ecs-archetype-core-${{ hashFiles('crates/mid-ecs/**/Cargo.toml', 'crates/mid-collections/**/Cargo.toml', 'crates/mid-math/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-bench-mid-ecs-archetype-core-

      - name: Confirm environment
        env:
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          {
            echo "## mid-ecs Archetype Core Bench — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Rust   | \`${RUST_VERSION}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
            echo "| Note   | ${{ inputs.baseline_note }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Archetype Core criterion benchmarks
        run: |
          # set -o pipefail: without it, `cargo bench | tee file`
          # reports tee's exit code (always 0), not cargo bench's, and
          # a real failure would show as green. See docs/benching-
          # standards.md's own "correctness detail" section -- this
          # workflow has it from the start, not as a later fix.
          set -o pipefail
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench -p mid-ecs --bench archetype_core -- --color never \
            2>&1 | tee bench-mid-ecs-archetype-core-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      - name: Surface bench diagnostics
        if: always()
        run: |
          {
            echo "### Diagnostics"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|Completed [0-9]+ iterations' \
              bench-mid-ecs-archetype-core-raw.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Results"
            echo ""
            echo "Lower is faster. Groups: spawn_insert_bundle, query_static_single_component,"
            echo "query2_static_two_components, structural_churn_insert_remove, raw_slice_ceiling"
            echo "-- each swept over N = 100 / 1,000 / 10,000 / 100,000. See"
            echo "\`crates/mid-ecs/benches/archetype_core.rs\`'s own header doc comment for"
            echo "what each group tests and why, including which gaps are fixed and which"
            echo "are still real, open, and not yet investigated."
            echo ""
            python3 scripts/bench_mid_ecs_archetype_core.py
            echo ""
            echo "<details><summary>Full raw output</summary>"
            echo ""
            echo '```'
            cat bench-mid-ecs-archetype-core-raw.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-mid-ecs-archetype-core-${{ github.run_number }}
          path: |
            bench-mid-ecs-archetype-core-raw.txt
            target/criterion
          retention-days: 30
