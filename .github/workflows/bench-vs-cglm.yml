# .github/workflows/bench-vs-cglm.yml
# UPDATED: fixed C benchmark + improved result parsing.
# Run: Actions → "mid-math: bench vs cglm" → Run workflow

name: mid-math — bench vs cglm

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cglm and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcglm-dev gcc

      - name: Verify cglm
        run: pkg-config --modversion cglm || dpkg -l libcglm-dev | tail -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-cglm-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Compile cglm benchmark
        run: |
          gcc -O3 -march=native \
              -o cglm_bench \
              crates/mid-math/benches/cglm_bench.c \
              $(pkg-config --cflags cglm) \
              -lcglm -lm
          echo "cglm_bench compiled OK"

      - name: Run cglm benchmark
        run: |
          echo "=== cglm benchmark (fixed: data-dependency chains) ==="
          stdbuf -oL ./cglm_bench 2>&1 | tee cglm-bench-raw.txt
          echo "exit: ${PIPESTATUS[0]}"

      - name: Run mid-math criterion benchmarks
        run: |
          echo "=== mid-math criterion ==="
          cargo bench --bench vs_all -p mid-math \
            --color=never 2>&1 | tee midmath-bench-raw.txt

      - name: Publish comparison summary
        run: |
          {
            echo "## mid-math vs cglm (fixed C benchmark)"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> **Previous cglm bug fixed:** all ops now show real latencies"
            echo "> (was showing 4.22ns for everything — compiler was hoisting constant"
            echo "> computations out of the loop entirely)."
            echo "> cglm = data-dependency-chain ns/op, mid-math = criterion mean ns."
            echo ""

            python3 - << 'PYEOF'
import re, sys

RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')

# ── Parse cglm with section awareness ────────────────────────────────────────
# 'mul/cglm' appears in BOTH quat and mat4 sections — must track section.
# 'dot/cglm' and 'normalize/cglm' also appear in both vec3 and vec4 sections.
cglm = {}
try:
    raw = open('cglm-bench-raw.txt', encoding='utf-8', errors='replace').read()
    section = 'other'
    RE_OP = re.compile(r'^\s+([\w/\s()]+?)\s{2,}([\d.]+)\s+ns/op')
    for line in raw.splitlines():
        stripped = line.strip().lower()
        for sec in ('vec3', 'vec4', 'quat', 'mat4'):
            if stripped.startswith(sec):
                section = sec
                break
        m = RE_OP.match(line)
        if m:
            key = m.group(1).strip()
            # Strip /cglm suffix and any parenthetical notes
            key = re.sub(r'/cglm\b', '', key).strip()
            key = re.sub(r'\s*\(.*\)\s*$', '', key).strip()
            cglm[f'{section}/{key}'] = float(m.group(2))
except FileNotFoundError:
    print("*(cglm-bench-raw.txt not found)*")

# ── Parse criterion output ────────────────────────────────────────────────────
# Criterion emits names like:  rotation/mul/mid-math-quat
# We strip '/mid-math' and any trailing variant suffix (-quat, -unitquat, etc.)
RE_CRIT = re.compile(
    r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
    re.MULTILINE)
midmath = {}
try:
    raw2 = RE_ANSI.sub('', open('midmath-bench-raw.txt', encoding='utf-8', errors='replace').read())
    for m in RE_CRIT.finditer(raw2):
        name = m.group(1).strip()
        mean = m.group(3).strip()
        if 'mid-math' in name:
            # Remove '/mid-math' and any trailing non-path suffix like '-quat'
            clean = re.sub(r'/mid-math[^/\s]*', '', name).strip('/ ')
            midmath[clean] = mean
except FileNotFoundError:
    print("*(midmath-bench-raw.txt not found)*")

# ── Side-by-side table ────────────────────────────────────────────────────────
print("### Results (section-aware cglm + criterion Rust)")
print("")
print("| Operation | mid-math | cglm |")
print("|---|---|---|")

ops = [
    # (cglm section/key,        midmath criterion key,    display label)
    ('vec3/add',             'vec3/add',              'vec3 add'),
    ('vec3/dot',             'vec3/dot',              'vec3 dot'),
    ('vec3/cross',           'vec3/cross',            'vec3 cross'),
    ('vec3/normalize',       'vec3/normalize',        'vec3 normalize'),
    ('vec3/lerp',            'vec3/lerp',             'vec3 lerp'),
    ('quat/mul',             'rotation/mul',          'quat mul'),
    ('quat/rotate',          'rotation/rotate',       'quat rotate'),
    ('quat/slerp',           'rotation/slerp',        'quat slerp'),
    ('quat/nlerp',           'rotation/nlerp',        'quat nlerp'),
    ('mat4/mul',             'mat4/mul',              'mat4 mul'),
    ('mat4/transform_point', 'mat4/transform_point',  'mat4 transform_point'),
    ('mat4/inverse_general', 'mat4/inverse_general',  'mat4 inverse_general'),
]
for ck, mk, label in ops:
    cv = f"{cglm[ck]:.2f} ns" if ck in cglm else "—"
    mv = midmath.get(mk, "—")
    print(f"| {label} | {mv} | {cv} |")

print("")
print("---")
print("### Raw cglm output")
print("```")
try:
    print(open('cglm-bench-raw.txt').read().strip())
except FileNotFoundError:
    print("(not found)")
print("```")
PYEOF

          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-cglm-${{ github.run_number }}
          path: |
            cglm-bench-raw.txt
            midmath-bench-raw.txt
            target/criterion/
          retention-days: 30
