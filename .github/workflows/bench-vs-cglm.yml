# .github/workflows/bench-vs-cglm.yml
# Benchmark mid-math vs cglm (best C game math library).
# cglm: hand-written SSE/AVX, column-major, Vulkan/OpenGL standard.
# Run: Actions → "mid-math: bench vs cglm" → Run workflow

name: mid-math — bench vs cglm

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cglm and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcglm-dev gcc

      - name: Verify cglm version
        run: |
          pkg-config --modversion cglm || dpkg -l libcglm-dev | tail -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-cglm-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      # ── Compile cglm C benchmark ──────────────────────────────────────────
      - name: Compile cglm benchmark
        run: |
          gcc -O3 -march=native \
              -o cglm_bench \
              crates/mid-math/benches/cglm_bench.c \
              $(pkg-config --cflags cglm) \
              -lm
          echo "cglm_bench compiled OK"

      # ── Run cglm benchmark ────────────────────────────────────────────────
      - name: Run cglm benchmark
        run: |
          echo "=== cglm benchmark output ==="
          ./cglm_bench 2>&1 | tee cglm-bench-raw.txt
          echo "cglm_bench exit: $?"

      # ── Run mid-math criterion bench for same operations ──────────────────
      - name: Run mid-math vs_all criterion benchmarks
        run: |
          echo "=== mid-math criterion benchmarks ==="
          cargo bench --bench vs_all -p mid-math \
            --color=never 2>&1 | tee midmath-bench-raw.txt

      # ── Publish combined summary ──────────────────────────────────────────
      - name: Publish comparison summary
        run: |
          {
            echo "## mid-math vs cglm"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> cglm: hand-written SSE/AVX C library, column-major, the industry C baseline."
            echo "> mid-math criterion numbers are from the vs_all bench."
            echo "> cglm numbers are wall-clock ns/op from the C benchmark."
            echo "> Both run on the same ubuntu-latest runner so comparison is fair."
            echo ""

            python3 - << 'PYEOF'
          import re, sys

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')

          # ── Parse cglm output ──────────────────────────────────────────────
          # Lines look like: "  add/cglm                                    0.96 ns/op"
          RE_CGLM = re.compile(r'^\s+(\S[^|]+?)\s{2,}([\d.]+)\s+(ns/op|µs)', re.MULTILINE)

          cglm_results = {}
          try:
              raw = open('cglm-bench-raw.txt', encoding='utf-8', errors='replace').read()
              for m in RE_CGLM.finditer(raw):
                  key = m.group(1).strip()
                  val = float(m.group(2))
                  unit = m.group(3)
                  cglm_results[key] = (val, unit)
          except FileNotFoundError:
              print("*(cglm-bench-raw.txt not found)*")

          # ── Parse criterion output ─────────────────────────────────────────
          RE_CRIT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE,
          )
          midmath_results = {}
          try:
              raw2 = open('midmath-bench-raw.txt', encoding='utf-8', errors='replace').read()
              raw2 = RE_ANSI.sub('', raw2)
              for m in RE_CRIT.finditer(raw2):
                  name = m.group(1).strip()
                  mean = m.group(3).strip()
                  # Only keep mid-math rows
                  if 'mid-math' in name:
                      clean = name.replace('/mid-math', '').replace('mid-math', '').strip('/ ')
                      midmath_results[clean] = mean
          except FileNotFoundError:
              print("*(midmath-bench-raw.txt not found)*")

          # ── Print side-by-side table ───────────────────────────────────────
          print("### Side-by-side: mid-math vs cglm")
          print("")
          print("| Operation | mid-math | cglm |")
          print("|---|---|---|")

          # Map cglm keys to criterion group/op keys
          op_map = {
              'add/cglm':           'vec3/add',
              'dot/cglm':           'vec3/dot',       # will also match vec4
              'cross/cglm':         'vec3/cross',
              'normalize/cglm':     'vec3/normalize',
              'lerp/cglm':          'vec3/lerp',
              'mul/cglm':           'quat/mul',        # quat section
              'rotate/cglm':        'rotation/rotate',
              'slerp/cglm':         'rotation/slerp',
              'nlerp/cglm':         'rotation/nlerp',
          }

          # Print vec3
          for cglm_key, mm_key in op_map.items():
              cglm_val = cglm_results.get(cglm_key, None)
              mm_val   = midmath_results.get(mm_key, None)
              cglm_str = f"{cglm_val[0]:.2f} {cglm_val[1]}" if cglm_val else "—"
              mm_str   = mm_val if mm_val else "—"
              print(f"| {cglm_key.replace('/cglm','')} | {mm_str} | {cglm_str} |")

          # Mat4 ops
          mat_cglm = [
              ('mul/cglm (mat4)',          'mat4/mul'),
              ('transform_point/cglm',     'mat4/transform_point'),
              ('inverse_general/cglm',     'mat4/inverse_general'),
              ('inverse_trs/cglm',         'mat4/inverse_trs'),
          ]
          for cglm_key, mm_key in mat_cglm:
              raw_key = cglm_key.split(' ')[0]
              cglm_val = cglm_results.get(raw_key, None)
              mm_val   = midmath_results.get(mm_key, None)
              cglm_str = f"{cglm_val[0]:.2f} {cglm_val[1]}" if cglm_val else "—"
              mm_str   = mm_val if mm_val else "—"
              label    = mm_key.replace('mat4/', '').replace('_', ' ')
              print(f"| {label} | {mm_str} | {cglm_str} |")

          print("")
          print("---")
          print("")
          print("### Raw cglm output")
          print("```")
          try:
              print(open('cglm-bench-raw.txt').read().strip())
          except FileNotFoundError:
              print("(not found)")
          print("```")
          PYEOF

          } >> $GITHUB_STEP_SUMMARY

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-cglm-${{ github.run_number }}
          path: |
            cglm-bench-raw.txt
            midmath-bench-raw.txt
            target/criterion/
          retention-days: 30
