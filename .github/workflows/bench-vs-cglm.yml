# .github/workflows/bench-vs-cglm.yml
# Run: Actions → "mid-math: bench vs cglm" → Run workflow

name: mid-math — bench vs cglm

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cglm and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcglm-dev gcc

      - name: Verify cglm
        run: pkg-config --modversion cglm || dpkg -l libcglm-dev | tail -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-cglm-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Compile cglm benchmark
        run: |
          gcc -O3 -march=native \
              -o cglm_bench \
              crates/mid-math/benches/cglm_bench.c \
              $(pkg-config --cflags cglm) \
              -lcglm -lm
          echo "cglm_bench compiled OK"

      - name: Run cglm benchmark
        run: |
          echo "=== cglm benchmark (fixed: data-dependency chains) ==="
          stdbuf -oL ./cglm_bench 2>&1 | tee cglm-bench-raw.txt
          echo "exit: ${PIPESTATUS[0]}"

      - name: Run mid-math criterion benchmarks
        run: |
          echo "=== mid-math criterion ==="
          cargo bench --bench vs_all -p mid-math \
            --color=never 2>&1 | tee midmath-bench-raw.txt

      - name: Publish comparison summary
        run: |
          {
            echo "## mid-math vs cglm (fixed C benchmark)"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> **Previous cglm bug fixed:** all ops now show real latencies"
            echo "> (was showing 4.22ns for everything — compiler was hoisting constant"
            echo "> computations out of the loop entirely)."
            echo "> cglm = data-dependency-chain ns/op, mid-math = criterion mean ns."
            echo ""
            python3 scripts/bench_vs_cglm.py
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-cglm-${{ github.run_number }}
          path: |
            cglm-bench-raw.txt
            midmath-bench-raw.txt
            target/criterion/
          retention-days: 30
