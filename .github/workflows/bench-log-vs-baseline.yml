# .github/workflows/bench-log-vs-baseline.yml
name: mid-log — bench vs baseline

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Why are you running this?'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-log-${{ hashFiles('crates/mid-log/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Compile benchmarks
        run: cargo build --bench vs_baseline -p mid-log --release

      - name: Run benchmarks
        run: |
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_baseline -p mid-log 2>&1 | tee bench-vs-baseline-raw.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## mid-log vs slog vs fast_log vs tracing — Build #${{ github.run_number }}"
            echo ""
            echo "**Rust:** \`${{ steps.rustver.outputs.ver }}\` &nbsp; **Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> 1s measurement · 10 samples · no HTML plots (CI mode)"
            echo ""
            echo "| Logger | Disabled path | Enabled path | Notes |"
            echo "|---|---|---|---|"
            echo "| mid-log | ~300 ps target | ~730 ns | format!() + channel send |"
            echo "| slog/async | ~1–5 ns | ~200–500 ns | structured args, no format!() |"
            echo "| fast_log | N/A | ~similar to mid-log | same pattern |"
            echo "| tracing | ~1–5 ns | ~2 µs | subscriber dispatch overhead |"
            echo "| env_logger | N/A | ~500 ns–2 µs | synchronous, mutex |"
            echo ""

            python3 - << 'PYEOF'
          import re, sys

          RE_ANSI   = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          RE_RESULT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE,
          )
          try:
              raw = open('bench-vs-baseline-raw.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print("*(raw file not found)*"); sys.exit(0)

          text = RE_ANSI.sub('', raw)
          group = None
          for m in RE_RESULT.finditer(text):
              name = m.group(1).strip()
              mean = m.group(3).strip()
              parts = name.split('/')
              grp   = '/'.join(parts[:-1]) if len(parts) >= 2 else name
              var   = parts[-1]            if len(parts) >= 2 else ''
              if grp != group:
                  if group: print()
                  print(f"#### {grp}")
                  print("| Variant | Mean |")
                  print("|---|---|")
                  group = grp
              print(f"| {var} | {mean} |")
          PYEOF
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-log-vs-baseline-${{ github.run_number }}
          path: bench-vs-baseline-raw.txt
          retention-days: 30
