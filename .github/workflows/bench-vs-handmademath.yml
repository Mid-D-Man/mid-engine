# .github/workflows/bench-vs-handmademath.yml
# Benchmark mid-math vs HandmadeMath v2 — popular single-header indie lib.
# Used extensively in the Handmade Hero / Casey Muratori community.
# Run: Actions → "mid-math: bench vs HandmadeMath" → Run workflow

name: mid-math — bench vs HandmadeMath

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc curl

      - name: Download HandmadeMath v2 (single header)
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/HandmadeMath/Handmade-Math/master/HandmadeMath.h" \
            -o crates/mid-math/benches/HandmadeMath.h
          echo "HandmadeMath downloaded: $(wc -l < crates/mid-math/benches/HandmadeMath.h) lines"

      - name: Compile HandmadeMath benchmark
        run: |
          gcc -O3 -march=native \
              -I crates/mid-math/benches \
              -o hmm_bench \
              crates/mid-math/benches/handmademath_bench.c \
              -lm
          echo "hmm_bench compiled OK"

      - name: Run HandmadeMath benchmark
        run: |
          echo "=== HandmadeMath v2 benchmark ==="
          stdbuf -oL ./hmm_bench 2>&1 | tee hmm-bench-raw.txt
          echo "exit: ${PIPESTATUS[0]}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-hmm-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Run mid-math criterion benchmarks
        run: |
          cargo bench --bench vs_all -p mid-math \
            --color=never 2>&1 | tee midmath-bench-raw.txt

      - name: Publish comparison summary
        run: |
          {
            echo "## mid-math vs HandmadeMath v2"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> HandmadeMath: scalar structs with optional SSE2."
            echo "> Represents a 'well-written idiomatic C' baseline used in real indie games."
            echo "> mid-math = criterion throughput, HMM = 4-way-interleaved latency approx."
            echo ""

            python3 - << 'PYEOF'
          import re, sys

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')

          RE_HMM = re.compile(r'^\s+([\w/]+)\s{2,}([\d.]+)\s+ns/op', re.MULTILINE)
          hmm = {}
          try:
              raw = open('hmm-bench-raw.txt', encoding='utf-8', errors='replace').read()
              for m in RE_HMM.finditer(raw):
                  hmm[m.group(1).strip()] = float(m.group(2))
          except FileNotFoundError:
              print("*(hmm-bench-raw.txt not found)*")

          RE_CRIT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE)
          mm = {}
          try:
              raw2 = RE_ANSI.sub('', open('midmath-bench-raw.txt', encoding='utf-8', errors='replace').read())
              for m in RE_CRIT.finditer(raw2):
                  name = m.group(1).strip()
                  mean = m.group(3).strip()
                  if 'mid-math' in name:
                      clean = name.replace('/mid-math','').replace('mid-math','').strip('/ ')
                      mm[clean] = mean
          except FileNotFoundError:
              print("*(midmath-bench-raw.txt not found)*")

          print("### Side-by-side: mid-math vs HandmadeMath v2")
          print("")
          print("| Operation | mid-math (criterion) | HandmadeMath (ns/op) |")
          print("|---|---|---|")

          ops = [
              ('add/handmademath',            'vec3/add',           'vec3 add'),
              ('dot/handmademath',            'vec3/dot',           'vec3 dot'),
              ('cross/handmademath',          'vec3/cross',         'vec3 cross'),
              ('normalize/handmademath',      'vec3/normalize',     'vec3 normalize'),
              ('lerp/handmademath',           'vec3/lerp',          'vec3 lerp'),
              ('mul/handmademath',            'rotation/mul',       'quat mul'),
              ('rotate/handmademath',         'rotation/rotate',    'quat rotate'),
              ('slerp/handmademath',          'rotation/slerp',     'quat slerp'),
              ('mul/handmademath',            'mat4/mul',           'mat4 mul'),
              ('transform_point/handmademath','mat4/transform_point','mat4 transform_point'),
              ('inverse_general/handmademath','mat4/inverse_general','mat4 inverse'),
          ]
          for hk, mk, label in ops:
              hv = f"{hmm[hk]:.2f} ns" if hk in hmm else "—"
              mv = mm.get(mk, "—")
              print(f"| {label} | {mv} | {hv} |")

          print("")
          print("---")
          print("### Raw HandmadeMath output")
          print("```")
          try:
              print(open('hmm-bench-raw.txt').read().strip())
          except FileNotFoundError:
              print("(not found)")
          print("```")
          PYEOF

          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-handmademath-${{ github.run_number }}
          path: |
            hmm-bench-raw.txt
            midmath-bench-raw.txt
            target/criterion/
          retention-days: 30
