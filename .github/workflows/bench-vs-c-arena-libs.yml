# .github/workflows/bench-vs-c-arena-libs.yml
# Build and run tsoding/arena.h / APR pools / talloc(_pool) C benchmarks
# alongside mid-arena's Rust vs_arena_crates suite, then produce a unified
# comparison in the step summary.
#
# Structure follows bench-vs-bevy-ecs.yml -- docs/benching-standards.md's
# actual "canonical reference" -- not bench-vs-c-libs.yml, which that same
# doc names directly as one of 12 workflows missing `set -o pipefail`.
# First version of this file copied the latter's shape by surface
# similarity (C-library comparison) without checking that; wrong call,
# fixed here rather than left in place.
#
# Real incident this fixes, not a hypothetical one: run #1 failed with
# "cargo: command not found" inside "Run Rust vs_arena_crates benchmark",
# reported as a green/succeeded step. Root cause, confirmed directly
# against this repo's other workflows, not assumed:
#   1. `restore-keys: cargo-registry-` (this file's first version) is a
#      prefix search across the WHOLE repo's cache entries, not scoped to
#      this workflow. `mid-ecs-test.yml`, `mid-log-test.yml`,
#      `mid-math-test.yml`, and `mid-net-test.yml` all use keys starting
#      with that exact same `cargo-registry-` string. On this workflow's
#      first run (guaranteed miss on its own unique key), the restore
#      step fell through to the most recent of those four and overwrote
#      the just-installed `~/.cargo/bin/` with theirs.
#   2. `cargo bench ... | tee /tmp/rust.txt` with no `set -o pipefail`
#      reports `tee`'s exit code (always 0), not cargo's -- so the
#      resulting empty/error-only /tmp/rust.txt showed a green step
#      instead of a failure. Same real incident class
#      docs/benching-standards.md already documents for
#      Abench-vs-all-f64.yml and mid-ecs-test.yml.
# Fix: workflow-scoped cache key/restore-keys (can't collide with any
# other workflow in this repo, present or future), `set -o pipefail` on
# every step piping through `tee` (C steps included -- same masking risk,
# not just the Rust one), and `if: always()` on diagnostics/summary/
# upload so a real failure stays visible in the step summary instead of
# just going missing.
#
# UPDATE: now runs with --features bump to include BumpArena<T> in the
# comparison, once that module was built (docs/mid-arena.md "Modules").
# UPDATE: now also --features compact, once CompactSlotArena<T> was
# built and wired into vs_arena_crates.rs.
#
# DO NOT add push/pull_request triggers.

name: mid-arena — bench vs C arena libraries

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run'
        required: false
        default: 'C arena library comparison'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify cargo is on PATH
        run: |
          # Added after run #2 still failed with "cargo: command not
          # found" despite a workflow-scoped cache key that should have
          # been a clean miss (nothing to restore) -- root cause not
          # fully confirmed, so this step exists to actually show the
          # real PATH/toolchain state going forward instead of leaving
          # a bare "command not found" to guess from a third time.
          echo "PATH=$PATH"
          which cargo || echo "cargo NOT on PATH here"
          which rustc || echo "rustc NOT on PATH here"
          ls -la ~/.cargo/bin/ 2>&1 || echo "~/.cargo/bin/ doesn't exist"
          cargo --version
          rustc --version

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libapr1-dev \
            libtalloc-dev \
            gcc \
            curl \
            git

      - name: Fetch tsoding/arena.h
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/tsoding/arena/master/arena.h" \
            -o crates/mid-arena/benches/arena.h
          echo "arena.h downloaded ($(wc -l < crates/mid-arena/benches/arena.h) lines)"

      - name: Compile C benchmarks
        working-directory: crates/mid-arena/benches
        run: |
          echo "=== tsoding/arena.h ==="
          gcc -O3 -march=native \
            -o /tmp/tsoding_bench \
            tsoding_arena_bench.c \
            -lm
          echo "✓ tsoding_bench"

          echo "=== APR pools ==="
          gcc -O3 -march=native $(pkg-config --cflags apr-1) \
            -o /tmp/apr_bench \
            apr_pool_bench.c \
            $(pkg-config --libs apr-1)
          echo "✓ apr_bench"

          echo "=== talloc ==="
          gcc -O3 -march=native \
            -o /tmp/talloc_bench \
            talloc_bench.c \
            -ltalloc
          echo "✓ talloc_bench"

      - name: Run C benchmarks
        run: |
          set -o pipefail
          echo "--- tsoding/arena.h ---"
          /tmp/tsoding_bench 2>&1 | tee /tmp/tsoding.txt

          echo "--- APR pools ---"
          /tmp/apr_bench 2>&1 | tee /tmp/apr.txt

          echo "--- talloc ---"
          /tmp/talloc_bench 2>&1 | tee /tmp/talloc.txt

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # ~/.cargo/bin/ deliberately NOT cached -- that's where the
          # toolchain binary itself (cargo, rustc) lives, freshly placed
          # there by "Install Rust toolchain" one step above. Caching
          # registry/git sources is safe and standard; caching the
          # toolchain's own bin dir is the actual suspect for run #2's
          # "cargo: command not found" (exact mechanism not fully
          # confirmed -- see "Verify cargo is on PATH" above -- but
          # there's no upside to caching this directory and a real,
          # repeated failure right where it would matter if there is one).
          key: cargo-registry-bench-vs-c-arena-libs-${{ hashFiles('crates/mid-arena/Cargo.toml') }}
          restore-keys: cargo-registry-bench-vs-c-arena-libs-

      - name: Run Rust vs_arena_crates benchmark
        run: |
          # set -o pipefail: without it, `cargo bench | tee` reports tee's
          # exit code (always 0), not cargo bench's -- see header comment,
          # this is the real incident that made run #1 look green while
          # actually failing at "cargo: command not found".
          set -o pipefail
          echo "PATH=$PATH"
          which cargo
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_arena_crates -p mid-arena --features bump,compact 2>&1 | tee /tmp/rust.txt

      - name: Surface bench diagnostics
        if: always()
        run: |
          {
            echo "### Diagnostics"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|command not found|error\[|Completed [0-9]+ iterations' \
              /tmp/rust.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## mid-arena vs C Arena Libraries"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> Rust: criterion medians. C: single-pass, clock_gettime, real side effects (no interleaving trick needed)."
            echo "> All binaries compiled \`-O3 -march=native\` on the same \`ubuntu-latest\` runner."
            echo ""
            python3 scripts/bench_vs_c_arena_libs.py
            echo ""
            echo "---"
            echo "### Raw C Benchmark Output"
            echo ""
            echo "<details><summary>tsoding/arena.h (click to expand)</summary>"
            echo ""
            echo '```'
            cat /tmp/tsoding.txt 2>/dev/null || echo "(compilation or run failed)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>APR pools (click to expand)</summary>"
            echo ""
            echo '```'
            cat /tmp/apr.txt 2>/dev/null || echo "(compilation or run failed)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>talloc (click to expand)</summary>"
            echo ""
            echo '```'
            cat /tmp/talloc.txt 2>/dev/null || echo "(compilation or run failed)"
            echo '```'
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload all benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-c-arena-libs-${{ github.run_number }}
          path: |
            /tmp/tsoding.txt
            /tmp/apr.txt
            /tmp/talloc.txt
            /tmp/rust.txt
          retention-days: 30
