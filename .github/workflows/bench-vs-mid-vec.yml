# .github/workflows/bench-vs-mid-vec.yml
# Run: Actions → "mid-math: bench MidVec vs Vec/VecDeque/SmallVec/TinyVec" → Run workflow
# DO NOT add push/pull_request triggers — benchmarks take 5-10 minutes.

name: mid-math — bench MidVec vs Vec/VecDeque/SmallVec/TinyVec

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Why are you running this? (e.g. "post push_unchecked fast-path change")'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      # ── Bench: vs_mid_vec (MidVec<T,N> vs Vec/VecDeque/SmallVec/TinyVec) ────
      - name: Run vs_mid_vec criterion benchmarks
        run: |
          echo "Running: cargo bench --bench vs_mid_vec -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_mid_vec -p mid-math 2>&1 | tee bench-vs-mid-vec-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      # ── Surface criterion's own diagnostics directly in the summary ─────────
      # Same idea as Abemch-vs-all.yml: a clean "Bench exit code: 0" does not
      # by itself guarantee every benchmark printed a result row (criterion
      # can silently skip printing one whose measured time hit exactly 0.0).
      - name: Surface bench diagnostics
        run: |
          {
            echo "### Diagnostics"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|Completed [0-9]+ iterations' \
              bench-vs-mid-vec-raw.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Publish summary ──────────────────────────────────────────────────────
      - name: Publish benchmark summary
        run: |
          {
            echo "## mid-math small-vec containers — Criterion Benchmarks"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "Containers: \`vec\` (\`std::vec::Vec\`, baseline), \`vecdeque\`"
            echo "(\`std::collections::VecDeque\`, the ring-buffer comparison — no inline"
            echo "storage, bucketed with \`vec\` where that matters), \`mid_vec\` (this crate's"
            echo "own \`MidVec<T, N>\`), \`smallvec\` (\`smallvec::SmallVec<[T; N]>\`, \`union\`"
            echo "feature — same union+MaybeUninit storage strategy as MidVec), \`tinyvec\`"
            echo "(\`tinyvec::TinyVec<[T; N]>\`, the auto-spilling Inline/Heap enum), and"
            echo "\`tinyvec_arrayvec\` (\`tinyvec::ArrayVec<[T; N]>\`, fixed-capacity, only"
            echo "benched at sizes <= N since it panics past that)."
            echo ""
            echo "Covers: \`construct_push\` (organic push, no pre-reserve), \`construct_and_drop\`"
            echo "(alloc/dealloc round trip at/under and over N), \`bulk_collect\` (FromIterator"
            echo "from a known-size iterator), \`hermite_keys\` (same shapes with the real"
            echo "\`HermiteKey<Vec3>\` element type), \`array_of_curves\` (many independent small"
            echo "curves, summed — the per-bone/per-object animation-evaluation shape), and"
            echo "\`csm_like_small\` (3-8 element f32 collections, shaped like"
            echo "\`camera::csm_split_depths\`)."
            echo ""
            echo "> Lower is faster. Each group shows related operations side by side."
            echo "> MidVec is expected to win construct_push/construct_and_drop (fewer or zero"
            echo "> allocations) and be roughly at par or slightly behind on bulk_collect (Vec's"
            echo "> collect specialisation also allocates only once there, so every tagged"
            echo "> inline/heap container's per-element tag check is pure overhead in that"
            echo "> specific group). \`smallvec\` is MidVec's closest structural relative (same"
            echo "> union storage) — the two should track each other closely everywhere; a"
            echo "> persistent gap there is the signal worth digging into."
            echo ""

            python3 scripts/bench_vs_mid_vec.py

          } >> $GITHUB_STEP_SUMMARY

      # ── Upload raw logs and criterion HTML ────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-mid-vec-results-${{ github.run_number }}
          path: |
            bench-vs-mid-vec-raw.txt
            target/criterion/
          retention-days: 30
