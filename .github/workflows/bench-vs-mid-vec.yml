# .github/workflows/bench-vs-mid-vec.yml
# Run: Actions → "mid-math: bench MidVec vs Vec" → Run workflow
# DO NOT add push/pull_request triggers — benchmarks take 5-10 minutes.

name: mid-math — bench MidVec vs Vec

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Why are you running this? (e.g. "post push_unchecked fast-path change")'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      # ── Bench: vs_mid_vec (MidVec<T,N> vs Vec<T>) ───────────────────────────
      - name: Run vs_mid_vec criterion benchmarks
        run: |
          echo "Running: cargo bench --bench vs_mid_vec -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_mid_vec -p mid-math 2>&1 | tee bench-vs-mid-vec-raw.txt

      # ── Publish summary ──────────────────────────────────────────────────────
      - name: Publish benchmark summary
        run: |
          {
            echo "## mid-math MidVec vs Vec — Criterion Benchmarks"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "Covers: \`construct_push\` (organic push, no pre-reserve), \`construct_and_drop\`"
            echo "(alloc/dealloc round trip at/under and over N), \`bulk_collect\` (FromIterator"
            echo "from a known-size iterator), \`hermite_keys\` (same shapes with the real"
            echo "\`HermiteKey<Vec3>\` element type), \`array_of_curves\` (many independent small"
            echo "curves, summed — the per-bone/per-object animation-evaluation shape), and"
            echo "\`csm_like_small\` (3-8 element f32 collections, shaped like"
            echo "\`camera::csm_split_depths\`)."
            echo ""
            echo "> Lower is faster. Each group shows related operations side by side."
            echo "> MidVec is expected to win construct_push/construct_and_drop (fewer or zero"
            echo "> allocations) and be roughly at par or slightly behind on bulk_collect (Vec's"
            echo "> collect specialisation also allocates only once there, so MidVec's per-"
            echo "> element heap/inline tag check is pure overhead in that specific group)."
            echo ""

            python3 - << 'PYEOF'
          import re, sys

          RE_ANSI  = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          RE_RESULT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE,
          )
          RE_THROUGHPUT = re.compile(
              r'^(\S[^\n]+?)\s+thrpt:\s+\[\s*([\d.]+\s+\S+/s)\s+([\d.]+\s+\S+/s)\s+([\d.]+\s+\S+/s)\s*\]',
              re.MULTILINE,
          )

          def parse_bench_file(path, title):
              try:
                  raw = open(path, encoding='utf-8', errors='replace').read()
              except FileNotFoundError:
                  print(f"*({path} not found)*")
                  return

              text = RE_ANSI.sub('', raw)
              throughputs = {m.group(1).strip(): m.group(3).strip() for m in RE_THROUGHPUT.finditer(text)}
              current_group = None

              print(f"\n---\n\n### {title}\n")

              for m in RE_RESULT.finditer(text):
                  name = m.group(1).strip()
                  mean = m.group(3).strip()
                  thrpt = throughputs.get(name, '')

                  parts = name.split('/')
                  if len(parts) >= 2:
                      group   = '/'.join(parts[:-1])
                      variant = parts[-1]
                  else:
                      group   = name
                      variant = ''

                  if group != current_group:
                      if current_group is not None:
                          print()
                      print(f"#### {group}")
                      if thrpt:
                          print("| Op | Mean | Throughput |")
                          print("|---|---|---|")
                      else:
                          print("| Op | Mean |")
                          print("|---|---|")
                      current_group = group

                  if thrpt:
                      print(f"| {variant} | {mean} | {thrpt} |")
                  else:
                      print(f"| {variant} | {mean} |")

          parse_bench_file('bench-vs-mid-vec-raw.txt', 'vs_mid_vec — MidVec<T,N> vs Vec<T>')
          PYEOF

          } >> $GITHUB_STEP_SUMMARY

      # ── Upload raw logs and criterion HTML ────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-mid-vec-results-${{ github.run_number }}
          path: |
            bench-vs-mid-vec-raw.txt
            target/criterion/
          retention-days: 30
