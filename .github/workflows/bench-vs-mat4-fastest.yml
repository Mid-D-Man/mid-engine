# .github/workflows/bench-vs-mat4-fastest.yml
# Who has the fastest 4×4 matrix multiply?
# mid-math vs glam vs nalgebra vs ultraviolet vs vek vs matrixmultiply vs faer
# Run: Actions → "mid-math: bench vs mat4 fastest" → Run workflow
# DO NOT add push/pull_request triggers — benchmarks take 15+ minutes.

name: mid-math — bench vs mat4 fastest

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run (e.g. "pre storage layout fix")'
        required: false
        default: 'manual mat4 benchmark'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-mat4fastest-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Run vs_mat4_fastest benchmarks
        run: |
          echo "Running: cargo bench --bench vs_mat4_fastest -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_mat4_fastest -p mid-math 2>&1 | tee bench-mat4-fastest-raw.txt

      - name: Publish summary
        run: |
          {
            echo "## mid-math — 4×4 Matrix Multiply: Who's Fastest?"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> Lower is faster. glam (~7 ns) is the x86-64 gold standard."
            echo "> mid-math target after storage fix: ≤7 ns (parity). After AVX2 (OPT-7): ~3.5 ns."
            echo "> faer 0.22: linalg::matmul::Accum is pub(crate); benches use allocating path."
            echo ""
            python3 scripts/bench_vs_mat4_fastest.py
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: bench-mat4-fastest-${{ github.run_number }}
          path: bench-mat4-fastest-raw.txt
          retention-days: 30
