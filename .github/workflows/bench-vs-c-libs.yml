# .github/workflows/bench-vs-c-libs.yml
# Build and run cglm / HandmadeMath v2 / DirectXMath C benchmarks alongside
# the Rust vs_all suite, then produce a unified comparison in the step summary.
#
# C libs are compiled with -O3 -march=native (same as Rust release + target-cpu=native).
# C timing: 4-way interleaved throughput (matches criterion's throughput mode).
# Rust timing: criterion median.
#
# DO NOT add push/pull_request triggers.

name: mid-math — bench vs C libs

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run'
        required: false
        default: 'C library comparison'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcglm-dev \
            gcc \
            g++ \
            curl \
            git

      - name: Fetch HandmadeMath v2 header
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/HandmadeMath/HandmadeMath/master/HandmadeMath.h" \
            -o crates/mid-math/benches/HandmadeMath.h
          echo "HandmadeMath.h downloaded ($(wc -l < crates/mid-math/benches/HandmadeMath.h) lines)"

      - name: Fetch DirectXMath headers and create sal.h stub
        run: |
          git clone --quiet --depth 1 \
            https://github.com/microsoft/DirectXMath \
            /tmp/dxm
          echo "DirectXMath headers fetched"

          # Comprehensive sal.h stub — SAL is Windows source annotation language.
          # All annotations expand to nothing on Linux. Must cover every annotation
          # used in DirectXMath.h and its .inl files including _Use_decl_annotations_,
          # _Out_writes_bytes_, _In_reads_bytes_, etc.
          cat > /tmp/dxm/Inc/sal.h << 'SALEOF'
#pragma once
/* sal.h stub for Linux/GCC — SAL (Source Annotation Language) is MSVC-only.
   All annotations expand to nothing. Required for DirectXMath on Linux. */
#define _In_
#define _In_z_
#define _In_opt_
#define _In_opt_z_
#define _In_reads_(n)
#define _In_reads_opt_(n)
#define _In_reads_bytes_(n)
#define _In_reads_bytes_opt_(n)
#define _In_range_(lo,hi)
#define _In_z_count_(n)
#define _Out_
#define _Out_opt_
#define _Out_writes_(n)
#define _Out_writes_opt_(n)
#define _Out_writes_bytes_(n)
#define _Out_writes_bytes_opt_(n)
#define _Out_writes_to_(n,c)
#define _Out_writes_all_(n)
#define _Out_range_(lo,hi)
#define _Inout_
#define _Inout_opt_
#define _Inout_updates_(n)
#define _Inout_updates_bytes_(n)
#define _Inout_updates_to_(n,c)
#define _Inout_updates_all_(n)
#define _Inout_updates_bytes_all_(n)
#define _Check_return_
#define _Must_inspect_result_
#define _Use_decl_annotations_
#define _Analysis_assume_(e)
#define _Pre_satisfies_(c)
#define _Post_satisfies_(c)
#define _Deref_in_range_(lo,hi)
#define _Deref_out_range_(lo,hi)
#define _Field_range_(lo,hi)
#define _Ret_range_(lo,hi)
#define _COM_Outptr_
#define _Outptr_
#define _Outptr_opt_
#define _Outptr_result_maybenull_
#define _Outptr_opt_result_maybenull_
#define _Outptr_result_z_
#define _Outptr_opt_result_z_
#define _Outptr_result_buffer_(n)
#define _Outptr_opt_result_buffer_(n)
#define _Outptr_result_buffer_all_(n)
#define _Outptr_opt_result_buffer_all_(n)
#define _Outptr_result_bytebuffer_(n)
#define _Outptr_result_bytebuffer_all_(n)
#define _Outptr_result_maybenull_z_
#define _Result_nullonfailure_
#define _Result_zeroonfailure_
#define _Ret_maybenull_
#define _Ret_notnull_
#define _Ret_null_
#define _Ret_valid_
#define _Success_(e)
#define _On_failure_(a)
#define _Always_(a)
#define _Printf_format_string_
#define _Scanf_format_string_
#define _Scanf_s_format_string_
SALEOF
          echo "sal.h stub created at /tmp/dxm/Inc/sal.h"

      - name: Compile C benchmarks
        working-directory: crates/mid-math/benches
        run: |
          echo "=== cglm ==="
          gcc -O3 -march=native \
            -o /tmp/cglm_bench \
            cglm_bench.c \
            -lm
          echo "✓ cglm_bench"

          echo "=== HandmadeMath v2 ==="
          gcc -O3 -march=native \
            -o /tmp/hmm_bench \
            handmademath_bench.c \
            -lm
          echo "✓ hmm_bench"

          echo "=== DirectXMath ==="
          g++ -std=c++17 -O3 -march=native \
            -I/tmp/dxm/Inc \
            -o /tmp/dxm_bench \
            directxmath_bench.cpp
          echo "✓ dxm_bench"

      - name: Run C benchmarks
        run: |
          echo "--- cglm ---"
          /tmp/cglm_bench 2>&1 | tee /tmp/cglm.txt

          echo "--- HandmadeMath ---"
          /tmp/hmm_bench 2>&1 | tee /tmp/hmm.txt

          echo "--- DirectXMath ---"
          /tmp/dxm_bench 2>&1 | tee /tmp/dxm.txt

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-c-libs-bench-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Run Rust vs_all benchmark
        run: |
          cargo bench --bench vs_all -p mid-math 2>&1 | tee /tmp/rust.txt

      - name: Publish summary
        run: |
          {
            echo "## mid-math vs C Libraries"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> Rust: criterion medians. C: 4-way interleaved throughput approximation."
            echo "> All binaries compiled \`-O3 -march=native\` on the same \`ubuntu-latest\` runner."
            echo ""
            python3 scripts/bench_vs_c_libs.py
            echo ""
            echo "---"
            echo "### Raw C Benchmark Output"
            echo ""
            echo "<details><summary>cglm (click to expand)</summary>"
            echo ""
            echo '```'
            cat /tmp/cglm.txt 2>/dev/null || echo "(compilation or run failed)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>HandmadeMath v2 (click to expand)</summary>"
            echo ""
            echo '```'
            cat /tmp/hmm.txt 2>/dev/null || echo "(compilation or run failed)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>DirectXMath (click to expand)</summary>"
            echo ""
            echo '```'
            cat /tmp/dxm.txt 2>/dev/null || echo "(compilation or run failed)"
            echo '```'
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload all benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-c-libs-${{ github.run_number }}
          path: |
            /tmp/cglm.txt
            /tmp/hmm.txt
            /tmp/dxm.txt
            /tmp/rust.txt
          retention-days: 30
