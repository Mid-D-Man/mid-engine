# .github/workflows/mid-ecs-ffi-test.yml
#
# The C ABI of mid-ecs, tested on its own. Split out of mid-ecs-test.yml,
# where the FFI smoke test was one `continue-on-error` step among many
# and its raw log was only ever an artifact: nothing in that workflow's
# dashboard or job summary could tell you it had failed. Here the FFI
# surface has its own dashboard (gh-pages `mid-ecs-ffi/`), its own job
# summary, and its own pass/fail.
#
# What runs, in order:
#   1. the Rust-side `ffi::` unit tests (cargo test -p mid-ecs --lib ffi::)
#   2. crates/mid-ecs/ffi-smoke-test/test.c, a real C program, compiled
#      with gcc `-Wall -Wextra` and run against libmid_ecs.so
#   3. the same program linked against libmid_ecs.a (static)
#   4. the same program, against the .so, under valgrind: no memory
#      errors, no definitely-lost blocks
# Every step is allowed to fail on its own so that the later ones still
# run and the dashboard is always published (same "always report" shape as
# mid-ecs-test.yml). The LAST step then fails the run if any check in the
# results JSON failed, so a real FFI regression is a red run, not a
# quietly-orange step in a green one. That final gate is the one thing
# this workflow deliberately does differently from mid-ecs-test.yml.
#
# What a missing log means: scripts/mid_ecs_ffi_results.py turns a C log
# with no closing "=== N check(s) failed ===" line (compile error, link
# error, crash) into one failed check, not an empty passing suite. A
# broken build cannot pass by producing no output.
#
# Not here: FFI call overhead. That is .github/workflows/bench-mid-ecs-
# ffi.yml.
#
# Run: Actions -> "mid-ecs — FFI Tests" -> Run workflow
# DO NOT add push/pull_request triggers.

name: mid-ecs — FFI Tests

on:
  workflow_dispatch:

permissions:
  contents: write
  actions:  read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      # Registry only, not target/: same reasoning as mid-ecs-test.yml.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('crates/mid-collections/**/Cargo.toml', 'crates/mid-ecs/**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      # Builds the rlib, the cdylib (libmid_ecs.so) and the staticlib
      # (libmid_ecs.a) the C steps below link against. Not allowed to
      # fail: nothing after it can mean anything without the libraries.
      - name: Build mid-ecs (rlib + cdylib + staticlib)
        run: |
          cargo build -p mid-ecs
          find target/debug -maxdepth 1 \( -name "libmid_ecs.so" -o -name "libmid_ecs.a" \) -exec ls -lh {} \;

      - name: Rust ffi unit tests
        id: rust_ffi
        continue-on-error: true
        run: |
          # pipefail: `cargo test | tee` would otherwise report tee's
          # exit code, always 0 (the lesson Abench-vs-all-f64.yml paid for).
          set -o pipefail
          cargo test -p mid-ecs --lib ffi:: \
            --color=never \
            --no-fail-fast \
            -- --show-output 2>&1 | tee ffi-rust-raw.txt

      - name: Compile the C smoke test (shared and static)
        id: compile
        continue-on-error: true
        run: |
          mkdir -p ffi-smoke-build
          echo "=== gcc against libmid_ecs.so ==="
          gcc -o ffi-smoke-build/test_so \
            crates/mid-ecs/ffi-smoke-test/test.c \
            -I crates/mid-ecs/ffi-smoke-test \
            -L target/debug \
            -lmid_ecs -Wall -Wextra
          echo "=== gcc against libmid_ecs.a ==="
          gcc -o ffi-smoke-build/test_a \
            crates/mid-ecs/ffi-smoke-test/test.c \
            -I crates/mid-ecs/ffi-smoke-test \
            target/debug/libmid_ecs.a \
            -lpthread -ldl -lm -Wall -Wextra

      - name: C smoke test against libmid_ecs.so
        continue-on-error: true
        run: |
          set -o pipefail
          LD_LIBRARY_PATH=target/debug ffi-smoke-build/test_so 2>&1 | tee ffi-smoke-so-raw.txt

      - name: C smoke test against libmid_ecs.a
        continue-on-error: true
        run: |
          set -o pipefail
          ffi-smoke-build/test_a 2>&1 | tee ffi-smoke-a-raw.txt

      # --error-exitcode=99 makes valgrind's own findings the program's
      # exit status; the definite-leak flags make a leaked world handle
      # one of those findings. Measured, not assumed: with one
      # mid_ecs_world_free removed from test.c, this exits 99.
      - name: C smoke test under valgrind
        id: valgrind
        continue-on-error: true
        run: |
          set +e
          LD_LIBRARY_PATH=target/debug valgrind \
            --error-exitcode=99 \
            --leak-check=full \
            --show-leak-kinds=definite \
            --errors-for-leak-kinds=definite \
            ffi-smoke-build/test_so > ffi-valgrind-stdout.txt 2> ffi-valgrind-raw.txt
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 20 ffi-valgrind-raw.txt
          exit $status

      - name: Parse results to JSON
        if: always()
        env:
          BUILD_NUM:    ${{ github.run_number }}
          BRANCH:       ${{ github.ref_name }}
          COMMIT:       ${{ github.sha }}
          BUILD_DATE:   ${{ github.event.head_commit.timestamp }}
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
          VG_STATUS:    ${{ steps.valgrind.outputs.status }}
        run: |
          python3 scripts/mid_ecs_ffi_results.py parse \
            --out mid-ecs-ffi-test-results.json \
            --build "$BUILD_NUM" --branch "$BRANCH" --commit "$COMMIT" \
            --date "$BUILD_DATE" --rust-version "$RUST_VERSION" \
            --cargo-raw ffi-rust-raw.txt \
            --c-log "C smoke test (libmid_ecs.so)=ffi-smoke-so-raw.txt" \
            --c-log "C smoke test (libmid_ecs.a)=ffi-smoke-a-raw.txt" \
            --valgrind ffi-valgrind-raw.txt \
            --valgrind-status "${VG_STATUS:-127}"

      - name: Write results to job summary
        if: always()
        run: python3 scripts/mid_ecs_ffi_results.py summary mid-ecs-ffi-test-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build HTML report
        if: always()
        env:
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          cp .github/mid-ecs-ffi-test-template.html mid-ecs-ffi-test-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g"  mid-ecs-ffi-test-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"       mid-ecs-ffi-test-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"            mid-ecs-ffi-test-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                     mid-ecs-ffi-test-index.html
          sed -i "s|RUST_VERSION_PLACEHOLDER|${RUST_VERSION}|g"        mid-ecs-ffi-test-index.html

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-ecs-ffi-test-results-${{ github.run_number }}
          path: |
            mid-ecs-ffi-test-results.json
            mid-ecs-ffi-test-index.html
            ffi-rust-raw.txt
            ffi-smoke-so-raw.txt
            ffi-smoke-a-raw.txt
            ffi-valgrind-raw.txt
          retention-days: 14

      # Last on purpose: everything above has already published. Fails
      # the run when any check in the JSON failed, or when nothing was
      # collected at all (a run that produced no results is not a pass).
      - name: Fail the run if any FFI check failed
        if: always()
        run: |
          python3 - << 'PYEOF'
          import json, sys
          try:
              summary = json.load(open('mid-ecs-ffi-test-results.json'))['summary']
          except FileNotFoundError:
              print("No results JSON was produced -- failing.")
              sys.exit(1)
          print(f"total={summary['total']} passed={summary['passed']} failed={summary['failed']}")
          if summary['total'] == 0:
              print("No checks were collected -- failing.")
              sys.exit(1)
          if summary['failed'] > 0:
              print(f"{summary['failed']} FFI check(s) failed -- see the job summary.")
              sys.exit(1)
          PYEOF

  deploy-results:
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: always() && needs.run-tests.result != 'skipped'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mid-ecs-ffi-test-results-${{ github.run_number }}
          path: deploy/mid-ecs-ffi/

      - name: Ensure deploy content exists
        run: |
          mkdir -p deploy/mid-ecs-ffi
          if [ ! -f deploy/mid-ecs-ffi/mid-ecs-ffi-test-results.json ]; then
            echo '{
              "build":"${{ github.run_number }}",
              "branch":"${{ github.ref_name }}",
              "commit":"${{ github.sha }}",
              "crate":"mid-ecs-ffi",
              "summary":{"total":0,"passed":0,"failed":0,"ignored":0,"duration_s":0},
              "suites":[]
            }' > deploy/mid-ecs-ffi/mid-ecs-ffi-test-results.json
          fi
          if [ ! -f deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html ]; then
            cp .github/mid-ecs-ffi-test-template.html deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html
            sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g" deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html
            sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"      deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html
            sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"           deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html
            sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                   deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html
            sed -i "s|RUST_VERSION_PLACEHOLDER|unknown|g"              deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html
          fi

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "Mid Engine CI"
          git config --global user.email "ci@mid-engine.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/mid-ecs-ffi" "$WORK/mid-ecs-ffi/builds/build_${BUILD_NUM}"

          cp deploy/mid-ecs-ffi/mid-ecs-ffi-test-results.json "$WORK/mid-ecs-ffi/mid-ecs-ffi-test-results.json"
          cp deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html   "$WORK/mid-ecs-ffi/index.html"
          cp deploy/mid-ecs-ffi/mid-ecs-ffi-test-results.json "$WORK/mid-ecs-ffi/builds/build_${BUILD_NUM}/mid-ecs-ffi-test-results.json"
          cp deploy/mid-ecs-ffi/mid-ecs-ffi-test-index.html   "$WORK/mid-ecs-ffi/builds/build_${BUILD_NUM}/index.html"

          cp .github/mid-engine-landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy."
            exit 0
          fi
          git commit -m "mid-ecs FFI tests — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

  summary:
    runs-on: ubuntu-latest
    needs: [run-tests, deploy-results]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  mid-ecs FFI Test Summary"
          echo "============================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Tests:   ${{ needs.run-tests.result    || 'skipped' }}"
          echo "Deploy:  ${{ needs.deploy-results.result || 'skipped' }}"
