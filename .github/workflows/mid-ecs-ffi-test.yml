# .github/workflows/mid-ecs-ffi-test.yml
#
# The C ABI of mid-ecs, tested on its own. Split out of mid-ecs-test.yml,
# where the FFI smoke test was one `continue-on-error` step among many
# and its raw log was only ever an artifact: nothing in that workflow's
# dashboard or job summary could tell you it had failed. Here the FFI
# surface has its own job summary, its own results JSON and its own
# pass/fail, and the site's tests page reads that JSON (see "Publishing").
#
# What runs, in order:
#   1. the Rust-side `ffi::` unit tests (cargo test -p mid-ecs --lib ffi::)
#   2. crates/mid-ecs/ffi-smoke-test/test.c, a real C program, compiled
#      with gcc `-Wall -Wextra` and run against libmid_ecs.so
#   3. the same program linked against libmid_ecs.a (static)
#   4. the same program, against the .so, under valgrind: no memory
#      errors, no definitely-lost blocks
# Every step is allowed to fail on its own so that the later ones still
# run and the results are always reported (same "always report" shape as
# mid-ecs-test.yml). The LAST step then fails the run if any check in the
# results JSON failed, so a real FFI regression is a red run, not a
# quietly-orange step in a green one. That final gate is the one thing
# this workflow deliberately does differently from mid-ecs-test.yml.
#
# What a missing log means: scripts/mid_ecs_ffi_results.py turns a C log
# with no closing "=== N check(s) failed ===" line (compile error, link
# error, crash) into one failed check, not an empty passing suite. A
# broken build cannot pass by producing no output.
#
# Not here: FFI call overhead. That is .github/workflows/bench-mid-ecs-
# ffi.yml.
#
# Publishing: this workflow deploys nothing. The Cloudflare Pages site
# (.github/workflows/deploy-site.yml) re-runs these same steps behind its
# `run_tests_first` input and publishes the JSON as the "mid-ecs FFI" card
# on web/tests/index.html, the way it already does for mid-ptr and
# mid-platform. If a step changes here, change its mirror there. An earlier
# version of this file pushed an HTML dashboard to gh-pages; the
# gh-pages half is being migrated away (docs/RUST_AND_CRATE_GUIDELINES.md
# section 7) and was removed rather than built on.
#
# Run: Actions -> "mid-ecs — FFI Tests" -> Run workflow
# DO NOT add push/pull_request triggers.

name: mid-ecs — FFI Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  actions:  read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      # Registry only: not target/ (same reasoning as mid-ecs-test.yml), and
      # not ~/.cargo/bin/ either (see "Toolchain check" below).
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-ecs-${{ runner.os }}-${{ hashFiles('crates/mid-collections/**/Cargo.toml', 'crates/mid-ecs/**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-ecs-${{ runner.os }}-

      # Added after the first real run of this job on rustc 1.98.1 died with
      # `cargo: command not found` (exit 127) at its first cargo call, in
      # this workflow and in mid-ecs-ffi-test.yml alike. `rustc --version`
      # had worked right after the toolchain install, and the only steps in
      # between were the cache restore (plus valgrind's apt install in the
      # FFI workflow). The cache is the suspect, by the mechanism
      # docs/RUST_AND_CRATE_GUIDELINES.md section 7 records for
      # mid-ptr-test.yml: a bare `cargo-registry-` restore prefix can match
      # ANOTHER workflow's archive, and an archive holding ~/.cargo/bin/
      # overwrites the freshly installed rustup proxies when restored. So
      # the key above is scoped to this crate and the runner OS, and
      # ~/.cargo/bin/ is out of the paths (nothing here `cargo install`s
      # anything). The symptom here was 127, not that incident's "Exec
      # format error": same mechanism family, not a proven match. This step
      # prints what is actually on PATH so that, if the cache was not the
      # cause, the next failure says what was. It fails the run by design
      # when cargo is unusable: with cargo dead, the later steps that are
      # continue-on-error would fail silently (127).
      - name: Toolchain check
        run: |
          echo "PATH=$PATH"
          command -v rustup rustc cargo || true
          ls -la "$HOME/.cargo/bin" 2>&1 | head -20 || true
          rustc --version
          cargo --version

      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      # Builds the rlib, the cdylib (libmid_ecs.so) and the staticlib
      # (libmid_ecs.a) the C steps below link against. Not allowed to
      # fail: nothing after it can mean anything without the libraries.
      - name: Build mid-ecs (rlib + cdylib + staticlib)
        run: |
          cargo build -p mid-ecs
          find target/debug -maxdepth 1 \( -name "libmid_ecs.so" -o -name "libmid_ecs.a" \) -exec ls -lh {} \;

      - name: Rust ffi unit tests
        id: rust_ffi
        continue-on-error: true
        run: |
          # pipefail: `cargo test | tee` would otherwise report tee's
          # exit code, always 0 (the lesson Abench-vs-all-f64.yml paid for).
          set -o pipefail
          cargo test -p mid-ecs --lib ffi:: \
            --color=never \
            --no-fail-fast \
            -- --show-output 2>&1 | tee ffi-rust-raw.txt

      - name: Compile the C smoke test (shared and static)
        id: compile
        continue-on-error: true
        run: |
          mkdir -p ffi-smoke-build
          echo "=== gcc against libmid_ecs.so ==="
          gcc -o ffi-smoke-build/test_so \
            crates/mid-ecs/ffi-smoke-test/test.c \
            -I crates/mid-ecs/ffi-smoke-test \
            -L target/debug \
            -lmid_ecs -Wall -Wextra
          echo "=== gcc against libmid_ecs.a ==="
          gcc -o ffi-smoke-build/test_a \
            crates/mid-ecs/ffi-smoke-test/test.c \
            -I crates/mid-ecs/ffi-smoke-test \
            target/debug/libmid_ecs.a \
            -lpthread -ldl -lm -Wall -Wextra

      - name: C smoke test against libmid_ecs.so
        continue-on-error: true
        run: |
          set -o pipefail
          LD_LIBRARY_PATH=target/debug ffi-smoke-build/test_so 2>&1 | tee ffi-smoke-so-raw.txt

      - name: C smoke test against libmid_ecs.a
        continue-on-error: true
        run: |
          set -o pipefail
          ffi-smoke-build/test_a 2>&1 | tee ffi-smoke-a-raw.txt

      # --error-exitcode=99 makes valgrind's own findings the program's
      # exit status; the definite-leak flags make a leaked world handle
      # one of those findings. Measured, not assumed: with one
      # mid_ecs_world_free removed from test.c, this exits 99.
      - name: C smoke test under valgrind
        id: valgrind
        continue-on-error: true
        run: |
          set +e
          LD_LIBRARY_PATH=target/debug valgrind \
            --error-exitcode=99 \
            --leak-check=full \
            --show-leak-kinds=definite \
            --errors-for-leak-kinds=definite \
            ffi-smoke-build/test_so > ffi-valgrind-stdout.txt 2> ffi-valgrind-raw.txt
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 20 ffi-valgrind-raw.txt
          exit $status

      - name: Parse results to JSON
        if: always()
        env:
          BUILD_NUM:    ${{ github.run_number }}
          BRANCH:       ${{ github.ref_name }}
          COMMIT:       ${{ github.sha }}
          BUILD_DATE:   ${{ github.event.head_commit.timestamp }}
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
          VG_STATUS:    ${{ steps.valgrind.outputs.status }}
        run: |
          python3 scripts/mid_ecs_ffi_results.py parse \
            --out mid-ecs-ffi-test-results.json \
            --build "$BUILD_NUM" --branch "$BRANCH" --commit "$COMMIT" \
            --date "$BUILD_DATE" --rust-version "$RUST_VERSION" \
            --cargo-raw ffi-rust-raw.txt \
            --c-log "C smoke test (libmid_ecs.so)=ffi-smoke-so-raw.txt" \
            --c-log "C smoke test (libmid_ecs.a)=ffi-smoke-a-raw.txt" \
            --valgrind ffi-valgrind-raw.txt \
            --valgrind-status "${VG_STATUS:-127}"

      - name: Write results to job summary
        if: always()
        run: python3 scripts/mid_ecs_ffi_results.py summary mid-ecs-ffi-test-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-ecs-ffi-test-results-${{ github.run_number }}
          path: |
            mid-ecs-ffi-test-results.json
            ffi-rust-raw.txt
            ffi-smoke-so-raw.txt
            ffi-smoke-a-raw.txt
            ffi-valgrind-raw.txt
          retention-days: 14

      # Last on purpose: everything above has already reported. Fails
      # the run when any check in the JSON failed, or when nothing was
      # collected at all (a run that produced no results is not a pass).
      - name: Fail the run if any FFI check failed
        if: always()
        run: |
          python3 - << 'PYEOF'
          import json, sys
          try:
              summary = json.load(open('mid-ecs-ffi-test-results.json'))['summary']
          except FileNotFoundError:
              print("No results JSON was produced -- failing.")
              sys.exit(1)
          print(f"total={summary['total']} passed={summary['passed']} failed={summary['failed']}")
          if summary['total'] == 0:
              print("No checks were collected -- failing.")
              sys.exit(1)
          if summary['failed'] > 0:
              print(f"{summary['failed']} FFI check(s) failed -- see the job summary.")
              sys.exit(1)
          PYEOF
