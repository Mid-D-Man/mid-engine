name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests — default features
        run: cargo test --workspace --verbose

      - name: Run tests — mid-math SSE2 explicit
        if: runner.os == 'Linux'
        run: |
          RUSTFLAGS="-C target-feature=+sse2" \
          cargo test -p mid-math --verbose

      - name: Run tests — mid-geom
        run: cargo test -p mid-geom --verbose

  # Separate job: doc-tests, since they can be slow and noisy
  doctest:
    name: doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-doctest-${{ hashFiles('**/Cargo.lock') }}
      - name: Doctests
        run: cargo test --workspace --doc
