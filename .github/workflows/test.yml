name: test-geometry

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: mid-geom tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-geom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-geom-

      - name: Build mid-math (dependency)
        run: cargo build -p mid-math --release

      - name: Build mid-geom
        run: cargo build -p mid-geom

      - name: Run mid-geom tests
        run: cargo test -p mid-geom --verbose -- --nocapture

      - name: Run mid-geom tests (release)
        run: cargo test -p mid-geom --release --verbose
