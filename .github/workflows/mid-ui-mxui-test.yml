# .github/workflows/mid-ui-mxui-test.yml
#
# workflow_dispatch only, per docs/RUST_AND_CRATE_GUIDELINES.md section 7.
# Cache keys are scoped to this crate and the runner OS, and ~/.cargo/bin/ is
# not cached (same failure documented there for mid-ptr-test.yml).

name: mid-ui-mxui — Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-ui-mxui-${{ runner.os }}-${{ hashFiles('crates/mid-ui-mxui/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-ui-mxui-${{ runner.os }}-

      - name: Clippy (reader only)
        run: cargo clippy -p mid-ui-mxui --no-default-features --all-targets -- -D warnings
        continue-on-error: true

      - name: Reader tests (no DixScript)
        run: |
          set -o pipefail
          cargo test -p mid-ui-mxui --no-default-features --color=never --no-fail-fast 2>&1 | tee reader-raw.txt

      - name: Summary
        if: always()
        run: |
          read passed failed < <(awk '/^test result:/ { p += $4; f += $6 } END { print p + 0, f + 0 }' reader-raw.txt)
          {
            echo "## mid-ui-mxui reader tests (no DixScript)"
            echo ""
            echo "- Toolchain: $(rustc --version)"
            echo "- Passed: ${passed}"
            echo "- Failed: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"

  dixscript-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-ui-mxui-dix-${{ runner.os }}-${{ hashFiles('crates/mid-ui-mxui/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-ui-mxui-dix-${{ runner.os }}-

      - name: All tests (DixScript feature on, includes the e2e file)
        run: |
          set -o pipefail
          cargo test -p mid-ui-mxui --color=never --no-fail-fast 2>&1 | tee dix-raw.txt

      - name: Summary
        if: always()
        run: |
          read passed failed < <(awk '/^test result:/ { p += $4; f += $6 } END { print p + 0, f + 0 }' dix-raw.txt)
          {
            echo "## mid-ui-mxui all tests (DixScript on)"
            echo ""
            echo "- Toolchain: $(rustc --version)"
            echo "- Passed: ${passed}"
            echo "- Failed: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"

  wasm32-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-mid-ui-mxui-wasm-${{ runner.os }}-${{ hashFiles('crates/mid-ui-mxui/Cargo.toml') }}
          restore-keys: |
            cargo-registry-mid-ui-mxui-wasm-${{ runner.os }}-

      - name: Check wasm32 build, reader only
        run: cargo check -p mid-ui-mxui --no-default-features --target wasm32-unknown-unknown

      - name: Check wasm32 build, with DixScript
        run: cargo check -p mid-ui-mxui --target wasm32-unknown-unknown
