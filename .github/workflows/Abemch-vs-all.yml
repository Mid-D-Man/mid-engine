name: A-mid-math — bench vs all

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: >
          Compiler target-cpu or architecture configuration. Controls which SIMD instructions rustc emits.
          native     = all hardware features the runner has (AVX-512+AVX2+FMA on GitHub-hosted).
          x86-64-v4  = AVX-512F+BW+CD+DQ+VL — activates avx512/mat4.rs Mul<Mat4>, target ~2.0 ns.
          x86-64-v3  = AVX2+FMA+BMI2 guaranteed (Haswell+) — use for OPT-7 AVX2 work, target ~4.0 ns.
          x86-64-v2  = SSE4.2 baseline — no AVX.
          x86-64     = SSE2 only — baseline numbers before AVX2 work lands.
          neon       = ARM NEON acceleration (runs on native aarch64 runner).
          wasm       = WebAssembly wasm32-wasip1 target + simd128 via wasmtime.
        required: true
        default: 'native'
        type: choice
        options:
          - native
          - x86-64-v4
          - x86-64-v3
          - x86-64-v2
          - x86-64
          - neon
          - wasm

env:
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bench:
    name: bench (${{ inputs.target_cpu }})
    runs-on: ${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      # ── Setup environment flags based on target selection ──────────────────
      - name: Configure target environment
        run: |
          if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
            echo "RUSTFLAGS=-C target-feature=+simd128" >> $GITHUB_ENV
            echo "BENCH_TARGET=--target wasm32-wasip1" >> $GITHUB_ENV
            echo "ACTIVE_CPU_FLAGS=-C target-feature=+simd128" >> $GITHUB_ENV
          elif [ "${{ inputs.target_cpu }}" = "neon" ]; then
            echo "BENCH_TARGET=" >> $GITHUB_ENV
            echo "ACTIVE_CPU_FLAGS=" >> $GITHUB_ENV
          else
            # IMPORTANT: use CARGO_TARGET_<TRIPLE>_RUSTFLAGS, NOT RUSTFLAGS.
            # RUSTFLAGS bleeds into build scripts (num-traits, zerocopy etc) which
            # are compiled for the HOST. If the runner lacks the requested ISA
            # (e.g. AVX-512 on AMD EPYC), those build scripts SIGILL at compile time.
            # CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS applies only to the
            # TARGET binary (the bench), never to host/build-script compilations.
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C target-cpu=${{ inputs.target_cpu }}" >> $GITHUB_ENV
            echo "BENCH_TARGET=" >> $GITHUB_ENV
            echo "ACTIVE_CPU_FLAGS=-C target-cpu=${{ inputs.target_cpu }}" >> $GITHUB_ENV
          fi

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ inputs.target_cpu == 'wasm' && 'wasm32-wasip1' || '' }}
          # Disable the default `-D warnings` that setup-rust-toolchain injects.
          # Bench runs should not fail on dead-code or other style warnings —
          # those belong in CI lint/test jobs, not perf measurement workflows.
          rustflags: ""

      - name: Install wasmtime
        if: inputs.target_cpu == 'wasm'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: v25.0.2

      - name: Configure WASM test runner
        if: inputs.target_cpu == 'wasm'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.wasm32-wasip1]
          runner = ["wasmtime", "run", "--allow-unknown-experimental-proposals", "--"]
          EOF

      # ── Confirm what the runner and compiler actually have ──────────────────
      - name: Confirm CPU and compiler features
        run: |
          {
            echo "## CPU & Compiler — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Runner        | \`${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}\` |"
            echo "| target-cpu    | \`${{ inputs.target_cpu }}\` |"
            echo "| ACTIVE_CPU_FLAGS | \`$ACTIVE_CPU_FLAGS\` |"
            echo "| Rust          | \`$(rustc --version)\` |"
            echo "| Branch        | \`${{ github.ref_name }}\` |"
            echo "| Commit        | \`${GITHUB_SHA:0:8}\` |"
            echo ""
            echo "### Hardware SIMD flags (/proc/cpuinfo)"
            echo '```'
            if grep -q '^Features' /proc/cpuinfo; then
              grep -m1 '^Features' /proc/cpuinfo | tr ' ' '\n' | grep -E '(neon|fp|asimd|sve)' | sort
            elif grep -q '^flags' /proc/cpuinfo; then
              grep -m1 '^flags' /proc/cpuinfo \
                | tr ' ' '\n' \
                | grep -E '^(sse|avx|fma|bmi|aes|sha|vpclm|avx512)' \
                | sort \
                | paste - - - - - - -
            else
              echo "No standard CPU flags found"
            fi
            echo '```'
            echo ""
            echo "### Rustc target_feature cfg"
            echo '```'
            if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
              rustc --print cfg --target wasm32-wasip1 $RUSTFLAGS 2>&1 | grep '^target_feature' | sort
            else
              rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -E '^target_(arch|feature)' | sort
            fi
            echo '```'
            echo ""

            if [ "${{ inputs.target_cpu }}" != "wasm" ] && [ "${{ inputs.target_cpu }}" != "neon" ]; then
              AVX512=$(rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -c 'target_feature="avx512f"' || true)
              AVXFMA=$(rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -c 'target_feature="avx"' || true)
              if [ "$AVX512" -gt 0 ]; then
                echo "> **Active path:** avx512/mat4.rs (target ~2.0 ns mat4/mul)" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$AVXFMA" -gt 0 ]; then
                echo "> **Active path:** avx/mat4.rs AVX2+FMA (target ~4.0 ns mat4/mul)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "> **Active path:** sse2/mat4.rs (target ~7.0 ns mat4/mul)" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.target_cpu }}" = "x86-64-v3" ]; then
            rustc --print cfg -C target-cpu=x86-64-v3 2>&1 \
              | grep -q 'target_feature="avx2"' \
              || echo "::warning::x86-64-v3 selected but avx2 not found in rustc output — verify hardware"
          fi

          if [ "${{ inputs.target_cpu }}" = "x86-64-v4" ]; then
            rustc --print cfg -C target-cpu=x86-64-v4 2>&1 \
              | grep -q 'target_feature="avx512f"' \
              || echo "::warning::x86-64-v4 selected but avx512f not found — runner may not support AVX-512"
          fi

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-bench-${{ inputs.target_cpu }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bench-${{ inputs.target_cpu }}-
            ${{ runner.os }}-${{ runner.arch }}-bench-

      - name: Run vs_all benchmarks
        run: |
          cargo bench --bench vs_all -p mid-math $BENCH_TARGET 2>&1 | tee bench-vs-all-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish bench summary
        run: |
          {
            echo "## bench summary mid-math vs glam vs nalgebra vs ultraviolet"
            echo ""
            echo "Build: #${{ github.run_number }} &nbsp;|&nbsp; Rust: \`$(rustc --version | cut -d' ' -f2)\` &nbsp;|&nbsp; target-cpu: \`${{ inputs.target_cpu }}\`"
            echo ""
            echo "> Note: manual benchmark run"
            if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
              echo "> Warning: Criterion process timing constraints may impact accuracy inside wasmtime runtime."
            fi
            echo ""
            echo "Lower is faster. Gaps vs mid-math show what to borrow."
            echo ""
            python3 scripts/bench_vs_all.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw bench output
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-all-${{ github.run_number }}-${{ inputs.target_cpu }}
          path: bench-vs-all-raw.txt
          retention-days: 90
