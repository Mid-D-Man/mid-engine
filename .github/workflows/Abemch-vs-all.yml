name: A-mid-math — bench vs all

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: >
          Compiler target-cpu or architecture configuration. Controls which SIMD instructions rustc emits.
          native     = all hardware features the runner has (AVX-512+AVX2+FMA on GitHub-hosted).
          x86-64-v4  = AVX-512F+BW+CD+DQ+VL — activates avx512/mat4.rs Mul<Mat4>, target ~2.0 ns.
          x86-64-v3  = AVX2+FMA+BMI2 guaranteed (Haswell+) — use for OPT-7 AVX2 work, target ~4.0 ns.
          x86-64-v2  = SSE4.2 baseline — no AVX.
          x86-64     = SSE2 only — baseline numbers before AVX2 work lands.
          neon       = ARM NEON acceleration (runs on native aarch64 runner).
          wasm       = WebAssembly wasm32-wasip1 target + simd128 via wasmtime.
          scalar     = pure scalar fallback, no SIMD backend at all — needs
                       --features force-scalar since sse2 is otherwise
                       unconditional on any x86/x86_64 target_arch regardless
                       of target-cpu. f32 only for now (f64/wide unaffected).
        required: true
        default: 'native'
        type: choice
        options:
          - native
          - x86-64-v4
          - x86-64-v3
          - x86-64-v2
          - x86-64
          - neon
          - wasm
          - scalar

env:
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bench:
    name: bench (${{ inputs.target_cpu }})
    runs-on: ${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      # ── Setup environment flags based on target selection ──────────────────
      - name: Configure target environment
        run: |
          if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
            echo "RUSTFLAGS=-C target-feature=+simd128" >> $GITHUB_ENV
            echo "BENCH_TARGET=--target wasm32-wasip1" >> $GITHUB_ENV
            echo "ACTIVE_CPU_FLAGS=-C target-feature=+simd128" >> $GITHUB_ENV
            echo "BENCH_FEATURES=" >> $GITHUB_ENV
          elif [ "${{ inputs.target_cpu }}" = "neon" ]; then
            echo "BENCH_TARGET=" >> $GITHUB_ENV
            echo "ACTIVE_CPU_FLAGS=" >> $GITHUB_ENV
            echo "BENCH_FEATURES=" >> $GITHUB_ENV
          elif [ "${{ inputs.target_cpu }}" = "scalar" ]; then
            # No target-cpu flag needed — force-scalar bypasses the sse2 cfg
            # entirely regardless of what instructions rustc would otherwise
            # emit for this host. f32 only right now; f64/wide crates are
            # unaffected and keep building/benching normally either way.
            echo "BENCH_TARGET=" >> $GITHUB_ENV
            echo "ACTIVE_CPU_FLAGS=" >> $GITHUB_ENV
            echo "BENCH_FEATURES=--features force-scalar" >> $GITHUB_ENV
          else
            # IMPORTANT: use CARGO_TARGET_<TRIPLE>_RUSTFLAGS, NOT RUSTFLAGS.
            # RUSTFLAGS bleeds into build scripts (num-traits, zerocopy etc) which
            # are compiled for the HOST. If the runner lacks the requested ISA
            # (e.g. AVX-512 on AMD EPYC), those build scripts SIGILL at compile time.
            # CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS applies only to the
            # TARGET binary (the bench), never to host/build-script compilations.
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C target-cpu=${{ inputs.target_cpu }}" >> $GITHUB_ENV
            echo "BENCH_TARGET=" >> $GITHUB_ENV
            echo "ACTIVE_CPU_FLAGS=-C target-cpu=${{ inputs.target_cpu }}" >> $GITHUB_ENV
            echo "BENCH_FEATURES=" >> $GITHUB_ENV
          fi

      # ── Soft hardware gate for x86-64-v4 ─────────────────────────────────────
      # Runs ONLY for x86-64-v4. Never exits non-zero — sets an output flag
      # that later steps check. This turns "job fails red every single time
      # on GitHub-hosted runners" into "job succeeds green, clearly marked
      # skipped, with a reason". rustc always reports avx512f as present when
      # asked for x86-64-v4 regardless of real hardware, so we check actual
      # /proc/cpuinfo flags instead of trusting rustc's cfg output.
      - name: Check AVX-512 hardware availability
        id: hwcheck
        if: inputs.target_cpu == 'x86-64-v4'
        run: |
          if grep -qw 'avx512f' /proc/cpuinfo; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## bench (x86-64-v4) — skipped"
              echo ""
              echo "> GitHub-hosted \`ubuntu-latest\` runners use AMD EPYC CPUs without AVX-512."
              echo "> rustc will happily emit AVX-512 instructions for \`-C target-cpu=x86-64-v4\`"
              echo "> regardless of the host's real capabilities — running the resulting binary"
              echo "> here would SIGILL. This run is marked successful (skipped, not failed)."
              echo ">"
              echo "> To get real x86-64-v4 numbers, this workflow needs a self-hosted runner"
              echo "> on actual AVX-512-capable hardware (Ice Lake / Zen 4 or newer)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ inputs.target_cpu == 'wasm' && 'wasm32-wasip1' || '' }}
          # Disable the default `-D warnings` that setup-rust-toolchain injects.
          # Bench runs should not fail on dead-code or other style warnings —
          # those belong in CI lint/test jobs, not perf measurement workflows.
          rustflags: ""

      - name: Install wasmtime
        if: inputs.target_cpu == 'wasm'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: v25.0.2

      # ── WASM runner config ───────────────────────────────────────────────────
      # NOTE: --allow-unknown-experimental-proposals was removed from wasmtime's
      # CLI by (at latest) v25.0.2 — SIMD has been stable/non-experimental for a
      # long time, so the allowlist flag became dead weight and was deleted
      # upstream. wasmtime now auto-detects SIMD directly from the binary's own
      # wasm-features section; no flag is needed for that anymore.
      # Two real additions vs before:
      #   --dir .              preopens the cwd so criterion's (mostly optional,
      #                        gracefully-degrading) disk writes actually work
      #                        under WASI instead of silently failing every time.
      #   --env CRITERION_DEBUG=1
      #                        forwards this var into the WASI guest. Without
      #                        --env, wasmtime does NOT pass through ANY host
      #                        env vars by default — CRITERION_DEBUG, CARGO,
      #                        CARGO_TARGET_DIR were all invisible to criterion
      #                        before this. With it set, criterion prints, for
      #                        EVERY benchmark, the literal warm-up measurement:
      #                          "Completed N iterations in N nanoseconds,
      #                           estimated execution time is N ns"
      #                        This tells us directly whether wasmtime's WASI
      #                        clock is resolving our ns-scale ops correctly,
      #                        or whether it's the cause of the empty results
      #                        (criterion silently skips printing for any
      #                        benchmark whose measured elapsed time hits
      #                        exactly 0.0 — see src/analysis/mod.rs in
      #                        criterion 0.5.1, no panic, no error code).
      - name: Configure WASM test runner
        if: inputs.target_cpu == 'wasm'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.wasm32-wasip1]
          runner = ["wasmtime", "run", "--dir", ".", "--env", "CRITERION_DEBUG=1", "--"]
          EOF

      # ── Confirm what the runner and compiler actually have ──────────────────
      - name: Confirm CPU and compiler features
        run: |
          {
            echo "## CPU & Compiler — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Runner        | \`${{ inputs.target_cpu == 'neon' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}\` |"
            echo "| target-cpu    | \`${{ inputs.target_cpu }}\` |"
            echo "| ACTIVE_CPU_FLAGS | \`$ACTIVE_CPU_FLAGS\` |"
            echo "| Rust          | \`$(rustc --version)\` |"
            echo "| Branch        | \`${{ github.ref_name }}\` |"
            echo "| Commit        | \`${GITHUB_SHA:0:8}\` |"
            echo ""
            echo "### Hardware SIMD flags (/proc/cpuinfo)"
            echo '```'
            if grep -q '^Features' /proc/cpuinfo; then
              grep -m1 '^Features' /proc/cpuinfo | tr ' ' '\n' | grep -E '(neon|fp|asimd|sve)' | sort
            elif grep -q '^flags' /proc/cpuinfo; then
              grep -m1 '^flags' /proc/cpuinfo \
                | tr ' ' '\n' \
                | grep -E '^(sse|avx|fma|bmi|aes|sha|vpclm|avx512)' \
                | sort \
                | paste - - - - - - -
            else
              echo "No standard CPU flags found"
            fi
            echo '```'
            echo ""
            echo "### Rustc target_feature cfg"
            echo '```'
            if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
              rustc --print cfg --target wasm32-wasip1 $RUSTFLAGS 2>&1 | grep '^target_feature' | sort
            else
              rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -E '^target_(arch|feature)' | sort
            fi
            echo '```'
            echo ""

            if [ "${{ inputs.target_cpu }}" != "wasm" ] && [ "${{ inputs.target_cpu }}" != "neon" ] && [ "${{ inputs.target_cpu }}" != "scalar" ]; then
              AVX512=$(rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -c 'target_feature="avx512f"' || true)
              AVXFMA=$(rustc --print cfg $ACTIVE_CPU_FLAGS 2>&1 | grep -c 'target_feature="avx"' || true)
              if [ "$AVX512" -gt 0 ]; then
                echo "> **Active path:** avx512/mat4.rs (target ~2.0 ns mat4/mul)" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$AVXFMA" -gt 0 ]; then
                echo "> **Active path:** avx/mat4.rs AVX2+FMA (target ~4.0 ns mat4/mul)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "> **Active path:** sse2/mat4.rs (target ~7.0 ns mat4/mul)" >> "$GITHUB_STEP_SUMMARY"
              fi
            elif [ "${{ inputs.target_cpu }}" = "scalar" ]; then
              echo "> **Active path:** scalar/mat4.rs (--features force-scalar, no SIMD backend, f32 only)" >> "$GITHUB_STEP_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.target_cpu }}" = "x86-64-v3" ]; then
            rustc --print cfg -C target-cpu=x86-64-v3 2>&1 \
              | grep -q 'target_feature="avx2"' \
              || echo "::warning::x86-64-v3 selected but avx2 not found in rustc output — verify hardware"
          fi

      - name: Cache cargo registry + build artifacts
        if: steps.hwcheck.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # v2: bumped to bust caches built before the RUSTFLAGS→CARGO_TARGET_*
          # migration. Old caches may contain build-script binaries compiled with
          # AVX-512 flags that SIGILL on non-AVX-512 runners.
          key: ${{ runner.os }}-${{ runner.arch }}-bench-${{ inputs.target_cpu }}-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bench-${{ inputs.target_cpu }}-v3-

      - name: Run vs_all benchmarks
        if: steps.hwcheck.outputs.skip != 'true'
        run: |
          # GitHub Actions' default Linux shell is already
          # `bash --noprofile --norc -eo pipefail {0}`, so `$?` below already
          # reflects cargo's real exit status, not tee's — pipefail makes that
          # true without extra plumbing. Confirmed: a clean "Bench exit code: 0"
          # really does mean cargo/criterion ran to completion without error;
          # it does NOT by itself mean every benchmark printed a result line
          # (criterion can legitimately skip printing one bench's line without
          # erroring — see the WASM diagnostics step below for why).
          cargo bench --bench vs_all -p mid-math $BENCH_TARGET $BENCH_FEATURES 2>&1 | tee bench-vs-all-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      # ── Surface criterion's own diagnostics directly in the summary ─────────
      # Pulls forward anything criterion itself flagged (zero-time warnings,
      # "unable to complete N samples" messages, and — for WASM specifically —
      # the CRITERION_DEBUG warm-up lines) so the root cause is visible at a
      # glance instead of requiring a download of the raw artifact.
      - name: Surface bench diagnostics
        if: steps.hwcheck.outputs.skip != 'true'
        run: |
          {
            echo "### Diagnostics"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|Completed [0-9]+ iterations' \
              bench-vs-all-raw.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish bench summary
        if: steps.hwcheck.outputs.skip != 'true'
        run: |
          {
            echo "## bench summary mid-math vs glam vs nalgebra vs ultraviolet"
            echo ""
            echo "Build: #${{ github.run_number }} &nbsp;|&nbsp; Rust: \`$(rustc --version | cut -d' ' -f2)\` &nbsp;|&nbsp; target-cpu: \`${{ inputs.target_cpu }}\`"
            echo ""
            echo "> Note: manual benchmark run"
            if [ "${{ inputs.target_cpu }}" = "wasm" ]; then
              echo "> Warning: Criterion process timing constraints may impact accuracy inside wasmtime runtime."
            fi
            echo ""
            echo "Lower is faster. Gaps vs mid-math show what to borrow."
            echo ""
            python3 scripts/bench_vs_all.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw bench output
        if: steps.hwcheck.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-all-${{ github.run_number }}-${{ inputs.target_cpu }}
          path: bench-vs-all-raw.txt
          retention-days: 90
