# .github/workflows/bench-vs-all.yml
# Four-way benchmark: mid-math vs glam vs nalgebra vs ultraviolet.
# Run: Actions → "mid-math: bench vs all" → Run workflow
# DO NOT add push/pull_request triggers — benchmarks take 10-15 minutes.

name: mid-math — bench vs all

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run (e.g. "post mat4 mul sse2 fix")'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-all-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Run four-way criterion benchmarks
        run: |
          echo "Running: cargo bench --bench vs_all -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_all -p mid-math 2>&1 | tee bench-vs-all-raw.txt

      - name: Publish summary
        run: |
          {
            echo "## mid-math vs glam vs nalgebra vs ultraviolet"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> Lower is faster. Gaps vs mid-math show what to borrow."
            echo ""
            python3 scripts/bench_vs_all.py
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-all-${{ github.run_number }}
          path: |
            bench-vs-all-raw.txt
            target/criterion/
          retention-days: 30
