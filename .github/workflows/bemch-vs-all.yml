# .github/workflows/bench-vs-all.yml
# Four-way benchmark: mid-math vs glam vs nalgebra vs ultraviolet.
# Run: Actions → "mid-math: bench vs all" → Run workflow
# DO NOT add push/pull_request triggers — benchmarks take 10-15 minutes.

name: mid-math — bench vs all

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run (e.g. "post mat4 mul sse2 fix")'
        required: false
        default: 'manual benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-all-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Run four-way criterion benchmarks
        run: |
          echo "Running: cargo bench --bench vs_all -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_all -p mid-math 2>&1 | tee bench-vs-all-raw.txt

      - name: Publish summary
        run: |
          {
            echo "## mid-math vs glam vs nalgebra vs ultraviolet"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> Lower is faster. Gaps vs mid-math show what to borrow."
            echo ""

            python3 - << 'PYEOF'
          import re, sys

          RE_ANSI   = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          RE_RESULT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE,
          )

          try:
              raw  = open('bench-vs-all-raw.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print("*(bench-vs-all-raw.txt not found)*")
              sys.exit(0)

          text = RE_ANSI.sub('', raw)
          current_group = None

          for m in RE_RESULT.finditer(text):
              name = m.group(1).strip()
              mean = m.group(3).strip()

              parts = name.split('/')
              group   = '/'.join(parts[:-1]) if len(parts) >= 2 else name
              variant = parts[-1] if len(parts) >= 2 else ''

              if group != current_group:
                  if current_group is not None:
                      print()
                  print(f"#### {group}")
                  print("| Impl | Mean |")
                  print("|---|---|")
                  current_group = group

              # Tag gaps visually
              tag = ''
              if 'mid-math' in variant and current_group:
                  pass  # baseline row
              print(f"| {variant} | {mean} |")
          PYEOF

          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-all-${{ github.run_number }}
          path: |
            bench-vs-all-raw.txt
            target/criterion/
          retention-days: 30
