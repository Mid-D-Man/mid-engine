# .github/workflows/bemch-vs-all.yml
name: mid-math — bench vs all

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: >
          Compiler target-cpu. Controls which SIMD instructions rustc emits.
          native     = all hardware features the runner has (AVX2+FMA on GitHub-hosted).
          x86-64-v3  = AVX2+FMA+BMI2 guaranteed (Haswell+) — use for OPT-7 AVX2 work.
          x86-64-v2  = SSE4.2 baseline — no AVX.
          x86-64     = SSE2 only — baseline numbers before AVX2 work lands.
        required: true
        default: 'native'
        type: choice
        options:
          - native
          - x86-64-v3
          - x86-64-v2
          - x86-64

env:
  RUSTFLAGS: "-C target-cpu=${{ inputs.target_cpu }}"
  CARGO_TERM_COLOR: never                     # keep bench-vs-all-raw.txt ANSI-free
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true    # opt into Node.js 24 before forced cutover

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      # ── Confirm what the runner and compiler actually have ──────────────────
      - name: Confirm CPU and compiler features
        run: |
          {
            echo "## CPU & Compiler — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Runner        | \`ubuntu-latest\` |"
            echo "| target-cpu    | \`${{ inputs.target_cpu }}\` |"
            echo "| RUSTFLAGS     | \`-C target-cpu=${{ inputs.target_cpu }}\` |"
            echo "| Rust          | \`$(rustc --version)\` |"
            echo "| Branch        | \`${{ github.ref_name }}\` |"
            echo "| Commit        | \`${GITHUB_SHA:0:8}\` |"
            echo ""
            echo "### Hardware SIMD flags (/proc/cpuinfo)"
            echo '```'
            grep -m1 '^flags' /proc/cpuinfo \
              | tr ' ' '\n' \
              | grep -E '^(sse|avx|fma|bmi|aes|sha|vpclm)' \
              | sort \
              | paste - - - - - - -
            echo '```'
            echo ""
            echo "### Rustc target_feature cfg for \`-C target-cpu=${{ inputs.target_cpu }}\`"
            echo '```'
            rustc --print cfg -C "target-cpu=${{ inputs.target_cpu }}" 2>&1 \
              | grep '^target_feature' \
              | sort
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Warn (don't fail) if x86-64-v3 selected but AVX2 isn't confirmed
          if [ "${{ inputs.target_cpu }}" = "x86-64-v3" ]; then
            rustc --print cfg -C target-cpu=x86-64-v3 2>&1 \
              | grep -q 'target_feature="avx2"' \
              || echo "::warning::x86-64-v3 selected but avx2 not found in rustc output — verify hardware"
          fi

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ inputs.target_cpu }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-${{ inputs.target_cpu }}-
            ${{ runner.os }}-bench-

      # ── Run the benchmark suite ─────────────────────────────────────────────
      - name: Run vs_all benchmarks
        run: |
          cargo bench --bench vs_all -p mid-math \
            2>&1 | tee bench-vs-all-raw.txt
          echo "Bench exit code: $?" >> "$GITHUB_STEP_SUMMARY"

      # ── Parse and publish results ───────────────────────────────────────────
      # scripts/bench_vs_all.py reads bench-vs-all-raw.txt (default) and
      # prints markdown tables to stdout — we append that to the summary.
      - name: Publish bench summary
        run: |
          {
            echo "## bench summary mid-math vs glam vs nalgebra vs ultraviolet"
            echo ""
            echo "Build: #${{ github.run_number }} &nbsp;|&nbsp; Rust: \`$(rustc --version | cut -d' ' -f2)\` &nbsp;|&nbsp; target-cpu: \`${{ inputs.target_cpu }}\`"
            echo ""
            echo "> Note: manual benchmark run"
            echo ""
            echo "Lower is faster. Gaps vs mid-math show what to borrow."
            echo ""
            python3 scripts/bench_vs_all.py
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload raw criterion output ─────────────────────────────────────────
      - name: Upload raw bench output
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-all-${{ github.run_number }}
          path: bench-vs-all-raw.txt
          retention-days: 90
