# .github/workflows/bench-vs-mat4-asm.yml
# mat4 multiply benchmark: AVX intrinsic vs explicit asm! vs glam.
# Evaluates if pinning ymm0–ymm9 changes wall-clock time vs LLVM's free assignment.
# Run: Actions → "mid-math: bench mat4 asm" → Run workflow
# DO NOT add push/pull_request triggers.

name: mid-math — bench mat4 asm

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run (e.g. "AVX intrinsic vs pinned ymm asm")'
        required: false
        default: 'manual mat4 asm benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-mat4-asm-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Run mat4 asm criterion benchmarks
        run: |
          echo "Running: RUSTFLAGS='-C target-cpu=native' cargo bench --bench vs_mat4_asm -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          RUSTFLAGS='-C target-cpu=native' cargo bench --bench vs_mat4_asm -p mid-math 2>&1 | tee bench-mat4-asm-raw.txt

      - name: Publish summary
        run: |
          {
            echo "## mid-math mat4 asm vs intrinsic vs glam — Criterion Benchmarks"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> Evaluates AVX intrinsic performance vs explicit \`asm!\` with pinned \`ymm0-ymm9\` registers."
            echo "> Compiled with \`-C target-cpu=native\` to ensure AVX+FMA active. Includes a 4-way independent throughput test."
            echo ""

            python3 - << 'PYEOF'
          import re, sys

          RE_ANSI   = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          RE_RESULT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE,
          )

          try:
              raw  = open('bench-mat4-asm-raw.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print("*(bench-mat4-asm-raw.txt not found)*")
              sys.exit(0)

          text = RE_ANSI.sub('', raw)
          current_group = None

          for m in RE_RESULT.finditer(text):
              name = m.group(1).strip()
              mean = m.group(3).strip()
              parts = name.split('/')
              group   = '/'.join(parts[:-1]) if len(parts) >= 2 else name
              variant = parts[-1] if len(parts) >= 2 else ''
              if group != current_group:
                  if current_group is not None:
                      print()
                  print(f"#### {group}")
                  print("| Impl | Mean |")
                  print("|---|---|")
                  current_group = group
              print(f"| {variant} | {mean} |")
          PYEOF

          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-mat4-asm-${{ github.run_number }}
          path: |
            bench-mat4-asm-raw.txt
            target/criterion/
          retention-days: 30
