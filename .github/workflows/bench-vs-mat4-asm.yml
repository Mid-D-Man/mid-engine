# .github/workflows/bench-vs-mat4-asm.yml
# Bench mat4 multiply: AVX intrinsic vs explicit asm! with pinned low ymm registers.
# Runs ONLY on manual dispatch to avoid polluting CI.

name: mid-math — bench mat4 asm

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Context for this run'
        required: false
        default: 'asm vs intrinsic mat4 mul'

env:
  RUSTFLAGS: "-C target-cpu=native"
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Confirm CPU features and AVX availability
        run: |
          {
            echo "## CPU & Compiler — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Runner        | \`ubuntu-latest\` |"
            echo "| RUSTFLAGS     | \`-C target-cpu=native\` |"
            echo "| Rust          | \`$(rustc --version)\` |"
            echo "| Commit        | \`${GITHUB_SHA:0:8}\` |"
            echo "| Note          | ${{ inputs.note }} |"
            echo ""
            echo "### AVX/FMA flags"
            echo '```'
            grep -m1 '^flags' /proc/cpuinfo \
              | tr ' ' '\n' \
              | grep -E '^(avx|fma|sse)' \
              | sort \
              | paste - - - - -
            echo '```'
            echo ""
            echo "### Rustc target_feature cfg"
            echo '```'
            rustc --print cfg -C target-cpu=native 2>&1 \
              | grep '^target_feature' \
              | grep -E '"(avx|fma|sse)' \
              | sort
            echo '```'
            echo ""
            # Hard fail if AVX+FMA not present — bench is meaningless without it
            rustc --print cfg -C target-cpu=native 2>&1 | grep -q 'target_feature="avx"' \
              || { echo "::error::AVX not available on this runner — asm bench requires AVX+FMA"; exit 1; }
            rustc --print cfg -C target-cpu=native 2>&1 | grep -q 'target_feature="fma"' \
              || { echo "::error::FMA not available on this runner — asm bench requires AVX+FMA"; exit 1; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-asm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-asm-
            ${{ runner.os }}-bench-

      - name: Run mat4 asm benchmark
        run: |
          cargo bench --bench vs_mat4_asm -p mid-math \
            2>&1 | tee bench-mat4-asm-raw.txt
          echo "Exit: $?" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish bench summary
        run: |
          {
            echo "## mat4 mul — asm vs intrinsic vs glam"
            echo ""
            echo "Build: #${{ github.run_number }} &nbsp;|&nbsp; Rust: \`$(rustc --version | cut -d' ' -f2)\` &nbsp;|&nbsp; target-cpu: \`native\`"
            echo ""
            echo "> \`mid-math/4x-independent\` throughput ≈ cglm methodology (4 independent muls)."
            echo "> Lower is faster. All times are per operation."
            echo ""
            python3 scripts/bench_vs_all.py
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BENCH_RAW_FILE: bench-mat4-asm-raw.txt

      - name: Emit LLVM assembly for inspection
        run: |
          RUSTFLAGS="-C target-cpu=native --emit=asm" \
          cargo build -p mid-math --release 2>/dev/null || true
          # Pull the col_pair / mat4_mul sections for the summary
          ASM_FILE=$(find target/release/deps -name 'mid_math-*.s' 2>/dev/null | head -1)
          if [ -n "$ASM_FILE" ]; then
            {
              echo ""
              echo "### LLVM ASM — col_pair / avx mat4 mul (first 60 lines)"
              echo '```asm'
              grep -A 60 'col_pair\|glm_mat4_mul_avx\|mat4.*mul\|from_trs' "$ASM_FILE" 2>/dev/null | head -80 || echo "(not found)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-mat4-asm-${{ github.run_number }}
          path: bench-mat4-asm-raw.txt
          retention-days: 30
