# .github/workflows/bench-vs-bevy-ecs.yml
# mid-ecs vs bevy_ecs: spawn throughput, dense query iteration, and
# structural-churn (insert/remove) migration cost.
# Run: Actions → "ecs-vs-bevy-ecs: bench vs bevy_ecs" → Run workflow
# DO NOT add push/pull_request triggers — benchmarks take real time, and
# bevy_ecs's own rust-version = "1.95.0" (see benches/ecs-vs-bevy-ecs/
# Cargo.toml) means this can only build here, on @stable, not in the
# sandbox this was authored in (apt's best available toolchain there:
# 1.91) — first real CI run for this workflow is also the first real
# compile check for the bevy_ecs half of vs_bevy_ecs.rs. Confirm it
# actually builds before trusting the numbers.
#
# NO target_cpu/ISA-tier matrix here, unlike Abench-vs-all-f64.yml —
# deliberate, not a gap. See docs/benching-standards.md's "Benchmarking
# across runners and platforms" section: spawn/query/churn are archetype-
# migration and hashmap-lookup bound, not vectorized-arithmetic bound, so
# there's no dispatched SIMD backend here to sweep tiers against (same
# reasoning bench-mid-collections-sparse-set.yml already documents for
# itself). What this DOES carry is an opt-in cross-OS/cross-arch matrix
# (`platforms: all`) — a genuinely different concern from ISA tiers,
# mirrored from test-geom.yml's real ubuntu/macos/windows pattern and
# mid-math-test-neon.yml's real macos-14 (Apple Silicon) ARM coverage.

name: ecs-vs-bevy-ecs — bench vs bevy_ecs

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run (e.g. "pre insert_bundle optimization")'
        required: false
        default: 'manual mid-ecs vs bevy_ecs benchmark'
      platforms:
        description: >
          ubuntu-only = fast default, ubuntu-latest (x86-64) alone.
          all = ubuntu-latest + macos-latest (Apple Silicon, real ARM via
          GitHub's free-tier hosted runner) + ubuntu-24.04-arm (real ARM,
          Linux). ~400-crate bevy_ecs dependency tree makes each leg take
          real minutes to build -- opt into `all` deliberately, don't
          default to it, and reach for it before trusting a cross-platform
          performance claim from this bench specifically.
        required: true
        default: 'ubuntu-only'
        type: choice
        options:
          - ubuntu-only
          - all

permissions:
  contents: read
  actions:  read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      os_list: ${{ steps.set.outputs.os_list }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.platforms }}" = "all" ]; then
            echo 'os_list=["ubuntu-latest","macos-latest","ubuntu-24.04-arm"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os_list=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  bench:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os_list) }}
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Confirm rustc clears bevy_ecs's MSRV
        run: |
          echo "bevy_ecs 0.19.1 requires rustc 1.95.0 -- confirming this runner's toolchain clears it:"
          rustc --version

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-vs-bevy-ecs-${{ matrix.os }}-${{ hashFiles('benches/ecs-vs-bevy-ecs/Cargo.toml') }}
          restore-keys: cargo-registry-bench-vs-bevy-ecs-${{ matrix.os }}-

      - name: Run vs_bevy_ecs benchmarks
        run: |
          # set -o pipefail (established pattern -- see mid-ecs-test.yml's
          # own "Run mid-ecs tests" step comment and the real incident it
          # traces back to): without this, `cargo bench | tee file` reports
          # tee's exit code (always 0), not cargo bench's, so a real
          # failure would show green here. This step was missing it before
          # this pass -- fixed now, not left as a silent gap.
          set -o pipefail
          echo "Running: cargo bench -p ecs-vs-bevy-ecs --bench vs_bevy_ecs"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench -p ecs-vs-bevy-ecs --bench vs_bevy_ecs 2>&1 | tee bench-vs-bevy-ecs-raw.txt

      - name: Surface bench diagnostics
        if: always()
        run: |
          {
            echo "### Diagnostics (${{ matrix.os }})"
            echo '```'
            grep -E 'took zero time|Unable to complete|Warning:|panicked|Completed [0-9]+ iterations' \
              bench-vs-bevy-ecs-raw.txt | head -60 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## mid-ecs vs bevy_ecs — ${{ matrix.os }}"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\` &nbsp; **Runner:** \`${{ matrix.os }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "Three groups, each mid-ecs vs bevy_ecs on an equivalent workload"
            echo "(N=10,000 entities). See"
            echo "\`benches/ecs-vs-bevy-ecs/benches/vs_bevy_ecs.rs\` for exactly what"
            echo "each one does and why, including the one workload"
            echo "(\`spawn\`) that isn't perfectly apples-to-apples between the two"
            echo "engines' APIs — read that file's own top doc comment before"
            echo "drawing conclusions from it specifically. No ISA-tier matrix here"
            echo "on purpose -- see this workflow's own header comment."
            echo ""
            python3 scripts/bench_vs_bevy_ecs.py
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-vs-bevy-ecs-${{ matrix.os }}-${{ github.run_number }}
          path: bench-vs-bevy-ecs-raw.txt
          retention-days: 30
