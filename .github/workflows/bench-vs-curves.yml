# .github/workflows/bench-vs-curves.yml
name: mid-math — bench curves

on:
  workflow_dispatch:
    inputs:
      baseline_note:
        description: 'Context for this run (e.g. "baseline curve evaluation")'
        required: false
        default: 'manual curves benchmark run'

permissions:
  contents: read
  actions:  read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-bench-curves-${{ hashFiles('crates/mid-math/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Run curves criterion benchmarks
        run: |
          echo "Running: cargo bench --bench vs_curves -p mid-math"
          echo "Note: ${{ inputs.baseline_note }}"
          cargo bench --bench vs_curves -p mid-math 2>&1 | tee bench-curves-raw.txt

      - name: Publish summary
        run: |
          {
            echo "## mid-math Curve Benchmarks"
            echo ""
            echo "**Build:** #${{ github.run_number }} &nbsp; **Rust:** \`${{ steps.rustver.outputs.ver }}\`"
            echo ""
            echo "**Note:** ${{ inputs.baseline_note }}"
            echo ""
            echo "> All timings are per evaluate() call. Lower is faster."
            echo "> Bulk columns show cost per point in a 1000-point sample_uniform call."
            echo ""

            python3 - << 'PYEOF'
          import re, sys

          RE_ANSI   = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          RE_RESULT = re.compile(
              r'^(\S[^\n]+?)\s+time:\s+\[\s*([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s*\]',
              re.MULTILINE,
          )

          try:
              raw  = open('bench-curves-raw.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print("*(bench-curves-raw.txt not found)*")
              sys.exit(0)

          text    = RE_ANSI.sub('', raw)
          results = RE_RESULT.findall(text)

          if not results:
              print("*(No benchmark results found — check bench-curves-raw.txt artifact)*")
              sys.exit(0)

          current_group = None
          for name, lo, mean, hi in results:
              parts   = name.strip().split('/')
              group   = '/'.join(parts[:-1]) if len(parts) >= 2 else name.strip()
              variant = parts[-1]            if len(parts) >= 2 else ''
              if group != current_group:
                  if current_group is not None:
                      print()
                  print(f"#### {group}")
                  print("| Variant | Low | Mean | High |")
                  print("|---|---|---|---|")
                  current_group = group
              print(f"| {variant} | {lo} | {mean} | {hi} |")
          PYEOF

          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-curves-${{ github.run_number }}
          path: |
            bench-curves-raw.txt
            target/criterion/
          retention-days: 30
