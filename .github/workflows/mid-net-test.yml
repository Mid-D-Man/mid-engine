# .github/workflows/mid-net-test.yml
name: mid-net — Tests

on:
  workflow_dispatch:

permissions:
  contents: write
  actions:  read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      # Cache only the cargo registry — NOT target/.
      # target/ for a Rust workspace is 200-500 MB and blows the 0.5 GB
      # Actions storage limit within a single billing cycle.
      # The registry cache is ~20-50 MB and is stable across runs.
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('crates/mid-net/**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Check formatting
        run: cargo fmt -p mid-net -p mid-net-wire -p mid-net-transport -p mid-net-reliable --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy -p mid-net -p mid-net-wire -p mid-net-transport -p mid-net-reliable -- -D warnings
        continue-on-error: true

      - name: Build all crate types
        run: |
          echo "=== Building mid-net family (facade + wire + transport + reliable) ==="
          echo "=== mid-net itself builds as rlib + cdylib + staticlib; the sub-crates are plain rlibs ==="
          cargo build -p mid-net -p mid-net-wire -p mid-net-transport -p mid-net-reliable
          echo ""
          echo "=== Produced libraries ==="
          find target/debug -maxdepth 1 \
            \( -name "libmid_net.so"    \
            -o -name "libmid_net.a"     \
            -o -name "libmid_net.dylib" \
            -o -name "mid_net.dll" \)   \
            -exec ls -lh {} \; 2>/dev/null || echo "  (platform-specific names — fine)"

      - name: Run unit tests
        continue-on-error: true
        run: |
          cargo test -p mid-net -p mid-net-wire -p mid-net-transport -p mid-net-reliable \
            --color=never \
            --no-fail-fast \
            -- --show-output 2>&1 | tee mid-net-test-raw.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      # Real end-to-end verification, not just Rust-side unit tests: an
      # actual C program, compiled with gcc, linked against the
      # libmid_net.so this job just built, exercising memory allocated
      # on the C side and passed across the real FFI boundary. Ubuntu's
      # GitHub-hosted runners ship gcc preinstalled, no extra setup.
      - name: FFI smoke test (real C program via gcc, not just Rust tests)
        continue-on-error: true
        run: |
          echo "=== Compiling C smoke test against mid_net.h ==="
          gcc -o crates/mid-net/ffi-smoke-test/test \
            crates/mid-net/ffi-smoke-test/test.c \
            -I crates/mid-net/ffi-smoke-test \
            -L target/debug \
            -lmid_net -Wall -Wextra
          echo ""
          echo "=== Running against the real compiled libmid_net.so ==="
          LD_LIBRARY_PATH=target/debug crates/mid-net/ffi-smoke-test/test 2>&1 | tee mid-net-ffi-smoke-raw.txt

      # mid-net-transport-quinn is new this pass and could NOT be
      # compiled or tested wherever it was written — its `web-transport-quinn`
      # dependency needs edition2024 (~1.85+), which that environment
      # didn't have. This runner's `stable` toolchain should clear that
      # bar, so this step is the FIRST real compile it's ever seen.
      # Deliberately kept separate from the steps above (own step, own
      # continue-on-error) rather than folded into the existing build/test
      # commands: if this fails, it shouldn't take the already-verified
      # 60 tests down with it or block the dashboard from reporting them.
      # Not wired into the JSON/dashboard parsing pipeline below yet —
      # do that once this has gone green here at least once.
      - name: Build mid-net-transport-quinn (native QUIC backend, unverified)
        id: quinn_build
        continue-on-error: true
        run: cargo build -p mid-net-transport-quinn

      - name: Test mid-net-transport-quinn (unverified)
        continue-on-error: true
        run: cargo test -p mid-net-transport-quinn --no-fail-fast -- --show-output

      - name: Flag if mid-net-transport-quinn didn't build
        if: steps.quinn_build.outcome == 'failure'
        run: |
          echo "::warning::mid-net-transport-quinn failed to build — this is the first real compile it's had, see its crate-level doc comment for context. Check the 'Build mid-net-transport-quinn' step's log above."

      - name: Parse results to JSON
        env:
          BUILD_NUM:    ${{ github.run_number }}
          BRANCH:       ${{ github.ref_name }}
          COMMIT:       ${{ github.sha }}
          BUILD_DATE:   ${{ github.event.head_commit.timestamp }}
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          python3 - << 'PYEOF'
          import re, json, os

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          def strip(s): return RE_ANSI.sub('', s)

          raw  = open('mid-net-test-raw.txt', encoding='utf-8', errors='replace').read()
          text = strip(raw)

          test_output = {}
          for m in re.finditer(
              r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)'
              r'(?=\n---- |\n\n(?:successes|failures):\n|\ntest result:|\Z)',
              text, re.DOTALL):
              content = m.group(2).strip()
              if content:
                  test_output[m.group(1)] = content

          fail_output = {}
          fail_section = re.search(r'\nfailures:\n(.*?)(?:\ntest result:|\Z)', text, re.DOTALL)
          if fail_section:
              for m in re.finditer(
                  r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)(?=\n---- |\Z)',
                  fail_section.group(1), re.DOTALL):
                  content = m.group(2).strip()
                  if content:
                      fail_output[m.group(1)] = content

          suites    = []
          cur_name  = None
          cur_tests = []
          cur_dur   = 0.0

          RE_RUN    = re.compile(r'Running\s+(?:unittests?\s+)?(\S+)\s+\(')
          RE_TEST   = re.compile(
              r'^test\s+([\w:]+(?:::\w+)*)\s+\.\.\.\s+'
              r'(ok|FAILED|ignored)(?:\s+\(([\d.]+)s\))?'
          )
          RE_RESULT = re.compile(r'test result:.*?finished in ([\d.]+)s')

          def flush(name, tests, dur):
              if name and tests:
                  suites.append({
                      'name':       name,
                      'passed':     sum(1 for t in tests if t['status'] == 'passed'),
                      'failed':     sum(1 for t in tests if t['status'] == 'failed'),
                      'ignored':    sum(1 for t in tests if t['status'] == 'ignored'),
                      'duration_s': round(dur, 4),
                      'tests':      tests,
                  })

          for line in text.splitlines():
              m = RE_RUN.search(line)
              if m:
                  flush(cur_name, cur_tests, cur_dur)
                  base = os.path.splitext(os.path.basename(m.group(1)))[0]
                  cur_name  = base + ' (unit tests)' if base in ('lib', 'main') else base
                  cur_tests = []
                  cur_dur   = 0.0
                  continue
              m = RE_TEST.match(line)
              if m:
                  if cur_name is None:
                      cur_name, cur_tests, cur_dur = 'mid-net unit tests', [], 0.0
                  tname, status, dur = m.group(1), m.group(2), m.group(3)
                  out = fail_output.get(tname) or test_output.get(tname, '')
                  cur_tests.append({
                      'name':        tname,
                      'status':      {'ok':'passed','FAILED':'failed','ignored':'ignored'}.get(status,'unknown'),
                      'duration_ms': int(float(dur) * 1000) if dur else 0,
                      'output':      out,
                  })
                  continue
              m = RE_RESULT.search(line)
              if m:
                  cur_dur = float(m.group(1))
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = None, [], 0.0

          flush(cur_name, cur_tests, cur_dur)

          # FFI smoke test (real C program, not cargo test) -- a much
          # simpler format than the above: `ok:   <msg>` / `FAIL: <msg>
          # (line N)`, see crates/mid-net/ffi-smoke-test/test.c's CHECK()
          # macro. Never fed into the dashboard before this pass -- the
          # step's stdout wasn't even being captured to a file, and this
          # parser only understood `cargo test` output anyway. Folded into
          # the same `suites` list as its own entry so it counts toward
          # the real total instead of only getting a static one-line
          # mention in the Protocol Coverage card.
          RE_C_OK   = re.compile(r'^ok:\s+(.+)$')
          RE_C_FAIL = re.compile(r'^FAIL:\s+(.+?)\s+\(line (\d+)\)$')

          c_tests = []
          try:
              c_raw = strip(open('mid-net-ffi-smoke-raw.txt', encoding='utf-8', errors='replace').read())
              for line in c_raw.splitlines():
                  m = RE_C_FAIL.match(line)
                  if m:
                      c_tests.append({
                          'name':        m.group(1),
                          'status':      'failed',
                          'duration_ms': 0,
                          'output':      f'line {m.group(2)}',
                      })
                      continue
                  m = RE_C_OK.match(line)
                  if m:
                      c_tests.append({
                          'name':        m.group(1),
                          'status':      'passed',
                          'duration_ms': 0,
                          'output':      '',
                      })
          except FileNotFoundError:
              pass  # smoke test step didn't run (or the compile itself failed before it could produce output)

          if c_tests:
              suites.append({
                  'name':       'ffi-smoke-test (C, real gcc)',
                  'passed':     sum(1 for t in c_tests if t['status'] == 'passed'),
                  'failed':     sum(1 for t in c_tests if t['status'] == 'failed'),
                  'ignored':    0,
                  'duration_s': 0.0,
                  'tests':      c_tests,
              })

          total   = sum(s['passed'] + s['failed'] + s['ignored'] for s in suites)
          passed  = sum(s['passed']  for s in suites)
          failed  = sum(s['failed']  for s in suites)
          ignored = sum(s['ignored'] for s in suites)
          dur     = sum(s['duration_s'] for s in suites)

          result = {
              'build':        os.environ.get('BUILD_NUM',    '0'),
              'branch':       os.environ.get('BRANCH',       'unknown'),
              'commit':       os.environ.get('COMMIT',       'unknown')[:8],
              'date':         os.environ.get('BUILD_DATE',   ''),
              'rust_version': os.environ.get('RUST_VERSION', 'stable'),
              'crate':        'mid-net',
              'summary': {
                  'total':      total,
                  'passed':     passed,
                  'failed':     failed,
                  'ignored':    ignored,
                  'duration_s': round(dur, 3),
              },
              'suites': suites,
          }

          with open('mid-net-test-results.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"Suites:{len(suites)}  Passed:{passed}  Failed:{failed}  Ignored:{ignored}")
          PYEOF

      - name: Build HTML report
        env:
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          cp .github/mid-net-test-template.html mid-net-test-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g"  mid-net-test-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"       mid-net-test-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"            mid-net-test-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                     mid-net-test-index.html
          sed -i "s|RUST_VERSION_PLACEHOLDER|${RUST_VERSION}|g"        mid-net-test-index.html

      # raw.txt is excluded — it's the largest artifact and is only needed
      # during the parsing step above (which has already run).
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-net-test-results-${{ github.run_number }}
          path: |
            mid-net-test-results.json
            mid-net-test-index.html
          retention-days: 7

  deploy-results:
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: always() && needs.run-tests.result != 'skipped'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mid-net-test-results-${{ github.run_number }}
          path: deploy/mid-net/

      - name: Ensure deploy content exists
        run: |
          mkdir -p deploy/mid-net
          if [ ! -f deploy/mid-net/mid-net-test-results.json ]; then
            echo '{
              "build":"${{ github.run_number }}",
              "branch":"${{ github.ref_name }}",
              "commit":"${{ github.sha }}",
              "crate":"mid-net",
              "summary":{"total":0,"passed":0,"failed":0,"ignored":0,"duration_s":0},
              "suites":[]
            }' > deploy/mid-net/mid-net-test-results.json
          fi
          if [ ! -f deploy/mid-net/mid-net-test-index.html ]; then
            cp .github/mid-net-test-template.html deploy/mid-net/mid-net-test-index.html
            sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g" deploy/mid-net/mid-net-test-index.html
            sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"      deploy/mid-net/mid-net-test-index.html
            sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"           deploy/mid-net/mid-net-test-index.html
            sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                    deploy/mid-net/mid-net-test-index.html
            sed -i "s|RUST_VERSION_PLACEHOLDER|unknown|g"               deploy/mid-net/mid-net-test-index.html
          fi

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "Mid Engine CI"
          git config --global user.email "ci@mid-engine.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/mid-net" "$WORK/mid-net/builds/build_${BUILD_NUM}"

          cp deploy/mid-net/mid-net-test-results.json "$WORK/mid-net/mid-net-test-results.json"
          cp deploy/mid-net/mid-net-test-index.html   "$WORK/mid-net/index.html"
          cp deploy/mid-net/mid-net-test-results.json "$WORK/mid-net/builds/build_${BUILD_NUM}/mid-net-test-results.json"
          cp deploy/mid-net/mid-net-test-index.html   "$WORK/mid-net/builds/build_${BUILD_NUM}/index.html"

          cp .github/mid-engine-landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy."
            exit 0
          fi
          git commit -m "mid-net tests — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

  summary:
    runs-on: ubuntu-latest
    needs: [run-tests, deploy-results]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  mid-net Test Summary"
          echo "============================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Tests:   ${{ needs.run-tests.result    || 'skipped' }}"
          echo "Deploy:  ${{ needs.deploy-results.result || 'skipped' }}"
