# .github/workflows/mid-ecs-test.yml
#
# Covers both mid-collections and mid-ecs in one workflow, the same way
# mid-net-test.yml covers mid-net + its wire/transport/reliable
# sub-crates under one dashboard -- mid-collections isn't an independent
# thing, it's built piece-by-piece specifically to serve mid-ecs (see
# docs/mid-collections.md), so they share a test surface here too.
#
# One real fix over mid-net-test.yml's own parser, worth calling out since
# it matters more here than it did there: the JSON-parsing step's
# suite-name regex used to capture whatever came right after "Running
# unittests " in cargo's own output -- which is always the literal
# *source file path* ("src/lib.rs"), not the crate name. Every crate in
# this workspace uses "src/lib.rs" as its lib target, so with two crates
# tested together that regex would have produced two suites both
# literally named "lib (unit tests)" with no way to tell mid-collections'
# results from mid-ecs's in the dashboard. Fixed here by capturing the
# actual binary name out of the "(target/debug/deps/NAME-HASH)" portion
# of the same line instead -- see the regex comment below. Not touching
# mid-net-test.yml itself; out of scope for this pass, and it currently
# reads as one cohesive "mid-net family" suite there rather than crates
# that need to stay visually distinct the way these two do.

name: mid-ecs — Tests

on:
  workflow_dispatch:

permissions:
  contents: write
  actions:  read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      # Cache only the cargo registry — NOT target/. See mid-net-test.yml
      # for why (target/ blows the 0.5 GB Actions storage limit fast).
      # v4, not v3: matches this repo's own Abench-vs-all-f64.yml, and
      # sidesteps the real Feb-2025 GitHub-wide cache-service-v1
      # deprecation that older actions/cache releases integrated against
      # (github.com/actions/cache/discussions/1510) -- v3 was the
      # original draft here, inconsistent with the project's own more
      # recently-evolved convention elsewhere in this repo.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('crates/mid-collections/**/Cargo.toml', 'crates/mid-ecs/**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Check formatting
        run: cargo fmt -p mid-collections -p mid-ecs --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy -p mid-collections -p mid-ecs -- -D warnings
        continue-on-error: true

      - name: Build
        run: |
          echo "=== mid-collections: rlib only, zero dependencies ==="
          echo "=== mid-ecs: rlib + cdylib + staticlib (rayon dependency — needs rustc 1.80+," \
               "which this runner's stable toolchain clears; sandbox-side verification during" \
               "development couldn't compile this crate at all for that reason) ==="
          cargo build -p mid-collections -p mid-ecs
          echo ""
          echo "=== Produced mid-ecs libraries ==="
          find target/debug -maxdepth 1 \
            \( -name "libmid_ecs.so"    \
            -o -name "libmid_ecs.a"     \
            -o -name "libmid_ecs.dylib" \
            -o -name "mid_ecs.dll" \)   \
            -exec ls -lh {} \; 2>/dev/null || echo "  (platform-specific names — fine)"

      # The real point of this step: rayon (mid-ecs's future parallel-query
      # dependency) and its whole transitive tree (crossbeam-deque/epoch/
      # utils, either, rayon-core) need real OS threads, which
      # wasm32-unknown-unknown doesn't provide the way rayon needs.
      # Confirmed directly, not assumed, via `cargo tree --target
      # wasm32-unknown-unknown -p mid-ecs` before gating it out in
      # mid-ecs/Cargo.toml under `[target.'cfg(not(target_arch =
      # "wasm32"))'.dependencies]` -- the whole tree showed up in the
      # wasm32 graph beforehand. This CI step is what actually PROVES that
      # gate works end to end (real compile, not just dependency-graph
      # resolution) -- the sandbox this was developed in has no wasm32
      # target installed at all, so `cargo tree --target
      # wasm32-unknown-unknown` (dependency resolution only, no real
      # target toolchain needed) was as far as local verification could
      # go. mid-collections needs no gating of its own -- zero
      # dependencies regardless of target, checked here anyway as a
      # cheap, real confirmation of that rather than just asserting it.
      - name: Check wasm32 build (mid-collections + mid-ecs)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p mid-collections --target wasm32-unknown-unknown
          cargo check -p mid-ecs --target wasm32-unknown-unknown

      - name: Run unit tests
        continue-on-error: true
        run: |
          # set -o pipefail: without this, `cargo test | tee file` reports
          # tee's exit code (always 0), not cargo test's -- the exact
          # lesson this repo already paid for once, see
          # Abench-vs-all-f64.yml's "Run f64 criterion benchmarks" step
          # comment (build #4 there showed false success on a real
          # failure). continue-on-error already means this step can't
          # fail the job either way, but the step's own reported status
          # should still reflect reality, not tee's.
          set -o pipefail
          cargo test -p mid-collections -p mid-ecs \
            --color=never \
            --no-fail-fast \
            -- --show-output 2>&1 | tee mid-ecs-test-raw.txt

      # Real end-to-end verification, not just Rust-side unit tests: an
      # actual C program, compiled with gcc, linked against the
      # libmid_ecs.so this job just built (see the "Build" step above) --
      # same pattern as mid-net-test.yml's own FFI smoke test step,
      # mirrored here, not reinvented. World lifecycle only for now
      # (spawn/despawn/is_alive/entity_count) -- see ffi.rs's own doc
      # comment for why component data access isn't covered yet.
      - name: FFI smoke test (real C program via gcc, not just Rust tests)
        continue-on-error: true
        run: |
          echo "=== Compiling C smoke test against mid_ecs.h ==="
          gcc -o crates/mid-ecs/ffi-smoke-test/test \
            crates/mid-ecs/ffi-smoke-test/test.c \
            -I crates/mid-ecs/ffi-smoke-test \
            -L target/debug \
            -lmid_ecs -Wall -Wextra
          echo ""
          echo "=== Running against the real compiled libmid_ecs.so ==="
          LD_LIBRARY_PATH=target/debug crates/mid-ecs/ffi-smoke-test/test 2>&1 | tee mid-ecs-ffi-smoke-raw.txt

      - name: Parse results to JSON
        env:
          BUILD_NUM:    ${{ github.run_number }}
          BRANCH:       ${{ github.ref_name }}
          COMMIT:       ${{ github.sha }}
          BUILD_DATE:   ${{ github.event.head_commit.timestamp }}
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          python3 - << 'PYEOF'
          import re, json, os

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          def strip(s): return RE_ANSI.sub('', s)

          raw  = open('mid-ecs-test-raw.txt', encoding='utf-8', errors='replace').read()
          text = strip(raw)

          test_output = {}
          for m in re.finditer(
              r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)'
              r'(?=\n---- |\n\n(?:successes|failures):\n|\ntest result:|\Z)',
              text, re.DOTALL):
              content = m.group(2).strip()
              if content:
                  test_output[m.group(1)] = content

          fail_output = {}
          fail_section = re.search(r'\nfailures:\n(.*?)(?:\ntest result:|\Z)', text, re.DOTALL)
          if fail_section:
              for m in re.finditer(
                  r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)(?=\n---- |\Z)',
                  fail_section.group(1), re.DOTALL):
                  content = m.group(2).strip()
                  if content:
                      fail_output[m.group(1)] = content

          suites    = []
          cur_name  = None
          cur_tests = []
          cur_dur   = 0.0

          # Captures the real binary/crate name out of
          # "... (target/debug/deps/mid_collections-f0bd8e754cfd2210)"
          # rather than the source file path that precedes it — see this
          # file's header comment for why that distinction matters here.
          RE_RUN    = re.compile(r'Running\s+.*?\(\S*?/deps/([A-Za-z0-9_]+)-[0-9a-f]{8,}\)\s*$')
          RE_TEST   = re.compile(
              r'^test\s+([\w:]+(?:::\w+)*)\s+\.\.\.\s+'
              r'(ok|FAILED|ignored)(?:\s+\(([\d.]+)s\))?'
          )
          RE_RESULT = re.compile(r'test result:.*?finished in ([\d.]+)s')

          def flush(name, tests, dur):
              # A real "Running unittests ..." line always sets `name`
              # explicitly (see the loop below), even when that crate
              # turns out to have zero #[test] functions -- mid-ecs's
              # actual current state. Keep that as a real suite entry so
              # it shows up as "0 tests" rather than vanishing, which
              # would look like the crate never ran at all. The doc-tests
              # sections cargo also prints have no preceding "Running
              # ..." line of their own, so `name` stays `None` for those
              # and they're correctly dropped here instead.
              if name is not None:
                  suites.append({
                      'name':       name,
                      'passed':     sum(1 for t in tests if t['status'] == 'passed'),
                      'failed':     sum(1 for t in tests if t['status'] == 'failed'),
                      'ignored':    sum(1 for t in tests if t['status'] == 'ignored'),
                      'duration_s': round(dur, 4),
                      'tests':      tests,
                  })

          for line in text.splitlines():
              m = RE_RUN.search(line)
              if m:
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name  = m.group(1).replace('_', '-')
                  cur_tests = []
                  cur_dur   = 0.0
                  continue
              m = RE_TEST.match(line)
              if m:
                  if cur_name is None:
                      cur_name, cur_tests, cur_dur = 'unknown suite', [], 0.0
                  tname, status, dur = m.group(1), m.group(2), m.group(3)
                  out = fail_output.get(tname) or test_output.get(tname, '')
                  cur_tests.append({
                      'name':        tname,
                      'status':      {'ok':'passed','FAILED':'failed','ignored':'ignored'}.get(status,'unknown'),
                      'duration_ms': int(float(dur) * 1000) if dur else 0,
                      'output':      out,
                  })
                  continue
              m = RE_RESULT.search(line)
              if m:
                  cur_dur = float(m.group(1))
                  flush(cur_name, cur_tests, cur_dur)
                  cur_name, cur_tests, cur_dur = None, [], 0.0

          flush(cur_name, cur_tests, cur_dur)

          total   = sum(s['passed'] + s['failed'] + s['ignored'] for s in suites)
          passed  = sum(s['passed']  for s in suites)
          failed  = sum(s['failed']  for s in suites)
          ignored = sum(s['ignored'] for s in suites)
          dur     = sum(s['duration_s'] for s in suites)

          result = {
              'build':        os.environ.get('BUILD_NUM',    '0'),
              'branch':       os.environ.get('BRANCH',       'unknown'),
              'commit':       os.environ.get('COMMIT',       'unknown')[:8],
              'date':         os.environ.get('BUILD_DATE',   ''),
              'rust_version': os.environ.get('RUST_VERSION', 'stable'),
              'crate':        'mid-ecs',
              'summary': {
                  'total':      total,
                  'passed':     passed,
                  'failed':     failed,
                  'ignored':    ignored,
                  'duration_s': round(dur, 3),
              },
              'suites': suites,
          }

          with open('mid-ecs-test-results.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"Suites:{len(suites)}  Passed:{passed}  Failed:{failed}  Ignored:{ignored}")
          PYEOF

      # Same pattern as mid-net-test.yml / mid-math's Abench-vs-all-f64.yml
      # Publish-summary step: real content in $GITHUB_STEP_SUMMARY, not
      # just the gh-pages dashboard, so it's visible even on a run where
      # deploy-results fails. Reads the JSON the step above just wrote.
      - name: Write test results to job summary
        if: always()
        run: |
          python3 - << 'PYEOF'
          import json
          import os

          try:
              with open('mid-ecs-test-results.json') as f:
                  result = json.load(f)
          except FileNotFoundError:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("## mid-ecs Test Results\n\n")
                  f.write("`mid-ecs-test-results.json` wasn't produced — the parse step "
                          "above likely failed before writing it. Check its log.\n")
              raise SystemExit(0)

          summary = result['summary']
          suites  = result['suites']

          lines = []
          lines.append(f"## mid-ecs Test Results — Build #{result['build']}")
          lines.append("")
          lines.append(
              f"Branch: `{result['branch']}` &nbsp;|&nbsp; "
              f"Commit: `{result['commit']}` &nbsp;|&nbsp; "
              f"Rust: `{result['rust_version']}`"
          )
          lines.append("")

          if summary['failed'] == 0 and summary['total'] > 0:
              lines.append(f"### ✅ All {summary['total']} tests passed")
          elif summary['total'] == 0:
              lines.append("### ⚠️ No tests were collected — check the raw log")
          else:
              lines.append(f"### ❌ {summary['failed']} of {summary['total']} tests failed")
          lines.append("")

          # mid-ecs itself has no real tests yet — World/Archetype/Query/
          # sync/ffi are still stubs. That's expected right now, not a
          # failure, so call it out explicitly rather than let a 0-test
          # suite look like something went wrong.
          ecs_suite = next((s for s in suites if s['name'] == 'mid-ecs'), None)
          if ecs_suite and ecs_suite['passed'] + ecs_suite['failed'] + ecs_suite['ignored'] == 0:
              lines.append(
                  "> ℹ️ `mid-ecs` itself has 0 tests — expected for now, "
                  "its modules are still stubs. `mid-collections` below is the real work so far."
              )
              lines.append("")

          failing = [
              (s['name'], t)
              for s in suites
              for t in s['tests']
              if t['status'] == 'failed'
          ]
          if failing:
              lines.append("### Failures")
              lines.append("")
              for suite_name, t in failing:
                  lines.append(f"- **{suite_name} :: {t['name']}**")
                  if t.get('output'):
                      first_line = t['output'].strip().splitlines()[0]
                      lines.append(f"  - `{first_line}`")
              lines.append("")

          lines.append("| Suite | Passed | Failed | Ignored | Duration |")
          lines.append("|---|---|---|---|---|")
          for s in suites:
              mark = "✅" if s['failed'] == 0 else "❌"
              lines.append(
                  f"| {mark} {s['name']} | {s['passed']} | {s['failed']} | "
                  f"{s['ignored']} | {s['duration_s']:.2f}s |"
              )
          lines.append("")
          lines.append(
              f"**Total: {summary['total']}** &nbsp;|&nbsp; "
              f"Passed: {summary['passed']} &nbsp;|&nbsp; "
              f"Failed: {summary['failed']} &nbsp;|&nbsp; "
              f"Ignored: {summary['ignored']} &nbsp;|&nbsp; "
              f"Duration: {summary['duration_s']:.2f}s"
          )
          lines.append("")

          for s in suites:
              lines.append(f"<details><summary>{s['name']} — {len(s['tests'])} tests</summary>")
              lines.append("")
              lines.append("| Test | Status |")
              lines.append("|---|---|")
              for t in s['tests']:
                  mark = "✅" if t['status'] == 'passed' else "❌"
                  lines.append(f"| `{t['name']}` | {mark} |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Build HTML report
        env:
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          cp .github/mid-ecs-test-template.html mid-ecs-test-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g"  mid-ecs-test-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"       mid-ecs-test-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"            mid-ecs-test-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                     mid-ecs-test-index.html
          sed -i "s|RUST_VERSION_PLACEHOLDER|${RUST_VERSION}|g"        mid-ecs-test-index.html

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-ecs-test-results-${{ github.run_number }}
          path: |
            mid-ecs-test-results.json
            mid-ecs-test-index.html
            mid-ecs-ffi-smoke-raw.txt
          retention-days: 7

  deploy-results:
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: always() && needs.run-tests.result != 'skipped'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mid-ecs-test-results-${{ github.run_number }}
          path: deploy/mid-ecs/

      - name: Ensure deploy content exists
        run: |
          mkdir -p deploy/mid-ecs
          if [ ! -f deploy/mid-ecs/mid-ecs-test-results.json ]; then
            echo '{
              "build":"${{ github.run_number }}",
              "branch":"${{ github.ref_name }}",
              "commit":"${{ github.sha }}",
              "crate":"mid-ecs",
              "summary":{"total":0,"passed":0,"failed":0,"ignored":0,"duration_s":0},
              "suites":[]
            }' > deploy/mid-ecs/mid-ecs-test-results.json
          fi
          if [ ! -f deploy/mid-ecs/mid-ecs-test-index.html ]; then
            cp .github/mid-ecs-test-template.html deploy/mid-ecs/mid-ecs-test-index.html
            sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g" deploy/mid-ecs/mid-ecs-test-index.html
            sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"      deploy/mid-ecs/mid-ecs-test-index.html
            sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"           deploy/mid-ecs/mid-ecs-test-index.html
            sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                   deploy/mid-ecs/mid-ecs-test-index.html
            sed -i "s|RUST_VERSION_PLACEHOLDER|unknown|g"              deploy/mid-ecs/mid-ecs-test-index.html
          fi

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "Mid Engine CI"
          git config --global user.email "ci@mid-engine.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/mid-ecs" "$WORK/mid-ecs/builds/build_${BUILD_NUM}"

          cp deploy/mid-ecs/mid-ecs-test-results.json "$WORK/mid-ecs/mid-ecs-test-results.json"
          cp deploy/mid-ecs/mid-ecs-test-index.html   "$WORK/mid-ecs/index.html"
          cp deploy/mid-ecs/mid-ecs-test-results.json "$WORK/mid-ecs/builds/build_${BUILD_NUM}/mid-ecs-test-results.json"
          cp deploy/mid-ecs/mid-ecs-test-index.html   "$WORK/mid-ecs/builds/build_${BUILD_NUM}/index.html"

          cp .github/mid-engine-landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy."
            exit 0
          fi
          git commit -m "mid-ecs tests — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

  summary:
    runs-on: ubuntu-latest
    needs: [run-tests, deploy-results]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  mid-ecs Test Summary"
          echo "============================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Tests:   ${{ needs.run-tests.result    || 'skipped' }}"
          echo "Deploy:  ${{ needs.deploy-results.result || 'skipped' }}"
